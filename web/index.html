  /* ---------------------------------------------------------------- session / 会话 */
  // 网络错误不能变成未处理的 Promise 拒绝：统一返回 status 0 与错误对象
  // A network error must not become an unhandled rejection: return status 0.
  async function api(path, body, method, signal){
    try {
      var opts = {
        method: method || "POST",
        headers: {"Content-Type": "application/json"},
        body: body ? JSON.stringify(body) : undefined
      };
      // 仅在有 AbortController 时附带 signal，桩环境不会碰到它
      // Attach a signal only when AbortController exists; the stub never sees it.
      if (signal && typeof AbortController !== "undefined") opts.signal = signal;
      var res = await fetch(path, opts);
      var data = null;
      try { data = await res.json(); } catch(e){ data = {ok:false, error:"bad response"}; }
      return {status: res.status, data: data};
    } catch (e) {
      return {status: 0, data: {ok:false, error: (e && e.message) || "network error"}};
    }
  }

  async function newSession(){
    var r = await api("api/session", {lang: state.lang});
    if (r.data && r.data.session){ state.session = r.data.session; setConn(true); }
    else {
      state.session = null; setConn(false);
      // 会话创建失败时给出提示，不能只让界面显示“未连接”
      // Report a failed session; the connection badge alone is not enough.
      if (r.data && r.data.error) addLine("fail", String(r.data.error));
    }
  }

  function setConn(ok){
    var el = $("st-conn");
    el.textContent = (ok ? "● " : "○ ") + t(ok ? "conn" : "dead");
    el.style.color = ok ? "var(--ok)" : "var(--err)";
  }

  // 流式求值可用时优先使用，长归约期间显示心跳而不再被 10 秒超时杀掉
  // Prefer streaming when available; heartbeats keep long reductions alive.
  function canStream(){
    return typeof TextDecoder !== "undefined" && typeof ReadableStream !== "undefined";
  }

  function showRunning(ms){
    var el = $("st-conn");
    if (!el) return;
    var s = Math.max(0, Math.round((ms || 0) / 1000));
    el.textContent = "● " + t("running") + (s ? " " + s + "s" : "");
    el.style.color = "var(--ok)";
  }

  // 只有后端的流级失败才算失败；解释器自己的 error 输出只是普通命令结果
  // Only the backend's stream-level failures count: an interpreter error
  // object (kind "error" with text and a code) is a normal command output and
  // must be rendered, not turned into a failed request.
  function isStreamFailure(obj){
    if (!obj) return false;
    if (obj.kind === "timeout" || obj.kind === "expired") return true;
    return obj.kind === "error" && obj.ok === false;
  }

  async function streamEval(line, signal){
    var opts = {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session: state.session, line: line, lang: state.lang})
    };
    if (signal && typeof AbortController !== "undefined") opts.signal = signal;
    var res = await fetch("api/eval/stream", opts);
    if (!res.ok || !res.body || typeof res.body.getReader !== "function") return null;
    var reader = res.body.getReader(), dec = new TextDecoder();
    var buf = "", outputs = [], session = null, failure = null;
    while (true){
      var part = await reader.read();
      if (part.done) break;
      buf += dec.decode(part.value, {stream: true});
      var idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        var frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (frame.slice(0, 6) !== "data: ") continue;
        var obj = null;
        try { obj = JSON.parse(frame.slice(6)); } catch(e){ continue; }
        if (!obj) continue;
        if (obj.kind === "start" || obj.kind === "done"){
          if (obj.session) session = obj.session;
        } else if (obj.kind === "heartbeat"){
          showRunning(obj.elapsedMs);
        } else if (isStreamFailure(obj)){
          failure = obj;
        } else {
          outputs.push(obj);
        }
      }
    }
    if (failure){
      var status = failure.timeout ? 408 : (failure.restart ? 410 : 500);
      return {status: status, data: failure};
    }
    return {status: 200, data: {ok: true, session: session, outputs: outputs}};
  }

  async function evalLine(line, silent){
    var gen = state.gen;
    if (!state.session) await newSession();
    var controller = null;
    // 特性检测：桩环境没有 AbortController / feature check: the stub has no AbortController
    if (typeof AbortController !== "undefined"){
      controller = new AbortController();
      activeController = controller;
    }
    var r = null;
    if (canStream()){
      try {
        r = await streamEval(line, controller ? controller.signal : undefined);
      } catch(e){
        if (controller && controller.signal && controller.signal.aborted) return [];
        r = null;
      }
    }
    if (!r){
      r = await api("api/eval", {session: state.session, line: line, lang: state.lang},
                    null, controller ? controller.signal : undefined);
    }
    if (activeController === controller) activeController = null;
    // 被取消的请求不再渲染错误 / a cancelled request renders nothing
    if (controller && controller.signal && controller.signal.aborted) return [];
    // 清空/重建后，旧请求的结果不能再改动会话或界面
    // After a clear/rebuild, a stale response must not touch session or UI.
    if (state.gen !== gen) return [];
    if (r.status === 408 || (r.data && (r.data.timeout || r.data.restart))){
      state.session = null; setConn(false);
      if (!silent){
        addLine("warn", (r.data && r.data.error) || t("timeout"));
        await rebuild();
      }
      return [];
    }
    if (!r.data || !r.data.ok){
      if (!silent) addLine("fail", (r.data && r.data.error) || "request failed");
      if (r.status === 0) setConn(false);
      else if (r.status >= 500) { state.session = null; setConn(false); }
      return [];
    }
    if (r.data.session) state.session = r.data.session;
    setConn(true);
    return r.data.outputs || [];
  }

  // 会话失效后重建并静默回放已有输入
  // Rebuild a dead session and silently replay previous lines.
  async function rebuild(){
    await newSession();
    await evalLine(":lang " + state.lang, true);
    await evalLine(":strategy " + $("strategy").value, true);
    await evalLine(":steps " + state.limit, true);
    await evalLine(":eta " + (state.eta ? "on" : "off"), true);
    await evalLine(":fast " + (state.fast ? "on" : "off"), true);
    for (var i = 0; i < state.codeLines.length; i++){
      await evalLine(state.codeLines[i], true);
    }
  }

  // 取消求值：中断 fetch、通知后端、再走已有的会话重建与历史回放
  // Cancel evaluation: abort the fetch, notify the backend, then rebuild and replay.
  async function cancelEval(){
    if (activeController && typeof activeController.abort === "function"){
      try { activeController.abort(); } catch(e){}
    }
    activeController = null;
    var sid = state.session;
    if (sid){
      try { await api("api/session/" + sid + "/cancel", {}); } catch(e){}
    }
    state.session = null;
    setConn(false);
    await rebuild();
    addLine("info", t("cancelled"));
  }

  async function execSilent(line){
    return evalLine(line, true);
  }

  async function refreshEnv(){
    var outs = await evalLine(":env", true);
    var env = outs.filter(function(o){ return o.kind === "env"; })[0];
    if (env){
      state.envRows = env.rows || [];
      if (state.tab === "env") renderPanel();
    }
    return env;
  }

  /* ------------------------------------------------------------------ exec / 执行 */
  function setManual(on, term){
    state.manual = !!on;
    if (term != null) state.manualTerm = term;
    if (!on) state.manualTerm = "";
    $("m-begin").disabled = state.manual;
    $("m-back").disabled = !state.manual;
    $("m-start").disabled = !state.manual;
    $("m-step").disabled = !state.manual;
    $("m-run").disabled = !state.manual;
    $("m-end").disabled = !state.manual;
    $("m-term").textContent = state.manual ? state.manualTerm : "";
    $("m-term").title = state.manual ? state.manualTerm : "";
    if (!state.manual) state.redexes = [];
    renderRedexes();
  }

  async function exec(line, opts){
    opts = opts || {};
    var gen = state.gen;
    if (!opts.silent) echoPrompt(line);
    var trimmed = line.trim();
    if (!trimmed) { scrollDown(); return []; }

    if (trimmed === ":clear" || trimmed === "clear" || trimmed === ":cls"){
      clearAll(); return [];
    }
    if (trimmed === ":q" || trimmed === ":quit"){
      addLine("info", dual("Web 会话不会退出；用“清空”重建会话。",
                           "The web session does not quit; use clear to reset it."));
      return [];
    }
    if (/^:edit\b/.test(trimmed)){
      addLine("info", dual("网页端不能启动服务器上的编辑器；请使用命令行 :edit。",
                           "The web app cannot launch a server-side editor; use :edit in the CLI."));
      return [];
    }

    if (opts.record !== false) state.codeLines.push(line);

    var outputs = await evalLine(line, opts.silent);
    // 期间清空了界面：丢弃这条命令的后续渲染与状态更新
    // If the UI was cleared meanwhile, drop this command's rendering/updates.
    if (state.gen !== gen) return [];
    outputs.forEach(function(o){ renderOutput(o, line, opts.silent); });

    if (/^:end\b/.test(trimmed)) setManual(false);
    if (/^:run\b/.test(trimmed)) setManual(false);
    if (/^:reset\b/.test(trimmed)) setManual(false);
    // 定义、删除、重置与 :load 之后只刷新一次环境，避免逐条定义重复请求
    // Refresh the environment once after definitions/deletes/load, not per definition.
    var needsEnv = outputs.some(function(o){ return o.kind === "define"; }) ||
                   /^:(reset|del|load)\b/.test(trimmed);
    if (needsEnv && !state.replaying) await refreshEnv();

    var stratMatch = trimmed.match(/^:strategy\s+(\S+)/);
    if (stratMatch && STRATEGY_LABELS[stratMatch[1]]){
      $("strategy").value = stratMatch[1];
      applyStaticTexts();
    }
    var stepsMatch = trimmed.match(/^:steps\s+(\d+)/);
    if (stepsMatch){
      state.limit = parseInt(stepsMatch[1], 10);
      $("st-limit").value = state.limit;
    }
    var etaMatch = trimmed.match(/^:eta\s+(on|off|true|false|1|0)\b/i);
    if (etaMatch){
      state.eta = /^(on|true|1)$/i.test(etaMatch[1]);
      if (state.tab === "tools") renderPanel();
    }
    var fastMatch = trimmed.match(/^:fast\s+(on|off|true|false|1|0)\b/i);
    if (fastMatch){
      state.fast = /^(on|true|1)$/i.test(fastMatch[1]);
      applyFastButton();
      if (state.tab === "tools") renderPanel();
    }
    // 终端里直接输入 :lang 时也要同步本地语言与界面（不只是下拉框走 lang 路由）
    // Typing :lang in the terminal must also sync local language and UI,
    // not just the select via the lang route.
    var langMatch = trimmed.match(/^:lang\s+(zh|en|both)\b/i);
    if (langMatch){
      state.lang = langMatch[1].toLowerCase();
      $("lang").value = state.lang;
      applyStaticTexts();
      applyTranscriptLang();
    }

    // :load 里的 :strategy/:steps/:eta/:fast/:lang 也要同步到界面
    // Settings inside a loaded file must also reach the UI state.
    // 普通求值结果里的 strategy/eta 是解释器“当前”的设置，不能拿来覆盖界面，
    // 否则分享链接里的策略会在回放时被结果冲掉
    // The strategy/eta of an ordinary result are the interpreter's current
    // settings; only a loaded file may change the UI, otherwise a shared
    // link's strategy would be overwritten while the history replays.
    if (/^:load\b/.test(trimmed)){
      var seen = {strategy: null, limit: null, eta: null, fast: null, lang: null};
      outputs.forEach(function(o){
        if (validStrategy(o.strategy)) seen.strategy = o.strategy;
        if (typeof o.limit === "number" && o.limit > 0) seen.limit = o.limit;
        if (typeof o.eta === "boolean") seen.eta = o.eta;
        if (typeof o.fast === "boolean") seen.fast = o.fast;
        if (validLang(o.lang)) seen.lang = o.lang;
      });
      if (seen.strategy){
        $("strategy").value = seen.strategy;
        $("st-strategy").textContent = strategyText(seen.strategy);
      }
      if (seen.limit){
        state.limit = seen.limit;
        $("st-limit").value = state.limit;
      }
      if (seen.eta != null){
        state.eta = seen.eta;
        if (state.tab === "tools") renderPanel();
      }
      if (seen.fast != null){
        state.fast = seen.fast;
        applyFastButton();
        if (state.tab === "tools") renderPanel();
      }
      if (seen.lang && seen.lang !== state.lang){
        state.lang = seen.lang;
        $("lang").value = state.lang;
        applyStaticTexts();
        applyTranscriptLang();
      }
    }

    var last = outputs.filter(function(o){ return o.kind === "result" || o.kind === "warn"; }).pop();
    if (last){
      // 协议提供 typeZh/typeEn，切语言时由 refreshStType 重新取值
      // The protocol provides typeZh/typeEn; refreshStType re-picks on language change.
      state.lastType = {zh: last.typeZh, en: last.typeEn, text: last.type};
      refreshStType();
      if (last.trace && last.trace.length && !opts.silent){
        state.selected = last;
        state.tracePos = last.trace.length - 1;
        if (state.tab === "trace") renderPanel();
      }
    }
    if (!opts.silent) scrollDown();
    saveLocal();
    return outputs;
  }

  /* ------------------------------------------------------------------- ac / 补全 */
  function tokenBeforeCursor(){
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos);
    var m = left.match(/(:[A-Za-z]+|[A-Za-z_][A-Za-z0-9_']*)$/);
    return m ? m[1] : "";
  }

  function candidates(token){
    var names = state.envRows.map(function(r){ return r.name; });
    var cmds = CMD_NAMES();
    var pool = token.charAt(0) === ":" ? cmds : names;
    var lower = token.toLowerCase();
    var seen = {};
    // 前缀匹配优先，其次允许子串匹配 / prefer prefix matches, then allow substring matches
    var start = [], inside = [];
    pool.forEach(function(x){
      if (seen[x]) return;
      seen[x] = 1;
      var i = x.toLowerCase().indexOf(lower);
      if (i === 0) start.push(x);
      else if (i > 0) inside.push(x);
    });
    return start.concat(inside).slice(0, 10);
  }

  function closeAc(){
    ac.classList.remove("open");
    if (ac.removeAttribute) ac.removeAttribute("aria-activedescendant");
    state.acItems = []; state.acIndex = -1;
  }

  function openAc(){
    var token = tokenBeforeCursor();
    if (!token || token.length < 1) { closeAc(); return; }
    var items = candidates(token);
    if (!items.length || (items.length === 1 && items[0] === token)) { closeAc(); return; }
    state.acItems = items;
    state.acIndex = 0;
    ac.innerHTML = items.map(function(x, i){
      return '<div class="item' + (i === 0 ? ' active' : '') + '" role="option" id="ac-opt-' + i +
             '" data-i="' + i + '" aria-selected="' + (i === 0 ? 'true' : 'false') + '">' +
             '<span>' + esc(x) + '</span><span class="hint">' + esc(cmdHint(x)) + '</span></div>';
    }).join("");
    if (ac.setAttribute) ac.setAttribute("aria-activedescendant", "ac-opt-0");
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el){
      el.addEventListener("mousedown", function(ev){ ev.preventDefault(); acceptAc(parseInt(el.dataset.i, 10)); });
    });
    ac.classList.add("open");
  }

  function acceptAc(i){
    if (i == null) i = state.acIndex;
    var token = tokenBeforeCursor();
    var pick = state.acItems[i];
    if (!pick) { closeAc(); return; }
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    cmd.value = left.slice(0, left.length - token.length) + pick + right;
    var newPos = pos - token.length + pick.length;
    cmd.setSelectionRange(newPos, newPos);
    closeAc();
    cmd.focus();
    pushEditor(cmd.value);
    syncEditor();
  }

  function insertText(text){
    var pos = cmd.selectionStart || cmd.value.length;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    var pad = left && !/\s$/.test(left) ? " " : "";
    cmd.value = left + pad + text + right;
    var p = (left + pad + text).length;
    cmd.setSelectionRange(p, p);
    cmd.focus();
    pushEditor(cmd.value);
    syncEditor();
  }

  /* ------------------------------------------------------------- 编辑器 / editor */
  // 读入的计算样式同步到高亮层与行号列，避免断点覆盖字体后错位
  // Copy computed metrics so breakpoint font overrides cannot desync the layers.
  function syncEditorMetrics(){
    if (!hl || !gutter || !cmd) return;
    if (typeof window.getComputedStyle !== "function") return;
    var cs = null;
    try { cs = window.getComputedStyle(cmd); } catch(e){ return; }
    if (!cs) return;
    var keys = ["fontFamily","fontSize","lineHeight","letterSpacing","paddingTop",
                "paddingRight","paddingBottom","paddingLeft","tabSize"];
    keys.forEach(function(k){
      var v = cs[k];
      if (v == null) return;
      if (hl.style) hl.style[k] = v;
      if (k === "fontFamily" || k === "fontSize" || k === "lineHeight" || k === "paddingTop"){
        if (gutter.style) gutter.style[k] = v;
      }
    });
  }
  // 返回光标附近配对括号的两个下标 / indices of the bracket pair near the caret
  function findBracketPair(src, pos){
    var i, depth, left = src.charAt(pos - 1), right = src.charAt(pos);
    function isOpen(c){ return c === "(" || c === "["; }
    function isClose(c){ return c === ")" || c === "]"; }
    function closer(c){ return c === "(" ? ")" : "]"; }
    function opener(c){ return c === ")" ? "(" : "["; }
    if (isOpen(left) || isOpen(right)){
      var s = isOpen(left) ? pos - 1 : pos;
      var open = src.charAt(s), want = closer(open);
      depth = 0;
      for (i = s; i < src.length; i++){
        var c = src.charAt(i);
        if (c === open) depth++;
        else if (c === want){ depth--; if (depth === 0) return [s, i]; }
      }
    } else if (isClose(left)){
      var back = opener(left);
      depth = 0;
      for (i = pos - 1; i >= 0; i--){
        var b = src.charAt(i);
        if (b === left) depth++;
        else if (b === back){ depth--; if (depth === 0) return [i, pos - 1]; }
      }
    }
    return null;
  }
  // 逐字符 token 化并转义，配对的括号额外标记 / tokenize and escape, mark matched brackets
  function highlight(src, pair){
    var re = /(:[A-Za-z]+|λ|\\|\d+|[()\[\]]|→|->|[A-Za-z_][A-Za-z0-9_']*)/g;
    var htmlOut = "", last = 0, m, idx;
    function isMatch(i){ return pair && (i === pair[0] || i === pair[1]); }
    while ((m = re.exec(src)) !== null){
      idx = m.index;
      if (idx > last) htmlOut += esc(src.slice(last, idx));
      var tok = m[0], cls = "";
      if (tok === "λ" || tok === "\\") cls = "tok-lam";
      else if (tok.charAt(0) === ":") cls = "tok-cmd";
      else if (/^\d/.test(tok)) cls = "tok-num";
      else if (tok === "(" || tok === ")" || tok === "[" || tok === "]") cls = isMatch(idx) ? "tok-paren-match" : "tok-paren";
      else if (/^[A-Za-z_]/.test(tok)) cls = "tok-var";
      htmlOut += cls ? '<span class="' + cls + '">' + esc(tok) + '</span>' : esc(tok);
      last = idx + tok.length;
    }
    if (last < src.length) htmlOut += esc(src.slice(last));
    return htmlOut;
  }
  function renderGutter(src){
    if (!gutter) return;
    var n = src.split("\n").length, s = "";
    for (var i = 1; i <= n; i++) s += '<div>' + i + '</div>';
    gutter.innerHTML = s;
  }
  function syncEditorScroll(){
    if (!cmd) return;
    var top = cmd.scrollTop || 0, left = cmd.scrollLeft || 0;
    if (hl){ hl.scrollTop = top; hl.scrollLeft = left; }
    if (gutter && gutter.scrollTop != null) gutter.scrollTop = top;
  }
  // 透明输入层、高亮层与行号列的统一刷新 / unified refresh of all three layers
  function syncEditor(){
    if (!cmd) return;
    var src = String(cmd.value == null ? "" : cmd.value);
    var pos = cmd.selectionStart;
    if (typeof pos !== "number") pos = src.length;
    var pair = findBracketPair(src, pos);
    if (hl) hl.innerHTML = highlight(src, pair);
    renderGutter(src);
    syncEditorMetrics();
    syncEditorScroll();
  }
  // 编辑器输入撤销栈，与终端输出历史相互独立 / undo stack separate from terminal history
  function pushEditor(value){
    var v = String(value == null ? "" : value);
    if (edHist[edHistIdx] === v) return;
    edHist = edHist.slice(0, edHistIdx + 1);
    edHist.push(v);
    if (edHist.length > 200) edHist.shift();
    edHistIdx = edHist.length - 1;
  }
  function setEditorValue(v){ cmd.value = v; syncEditor(); }
  function editorUndo(){ if (edHistIdx > 0){ edHistIdx--; setEditorValue(edHist[edHistIdx]); } }
  function editorRedo(){ if (edHistIdx < edHist.length - 1){ edHistIdx++; setEditorValue(edHist[edHistIdx]); } }

  // 多行输入：未闭合的括号/方括号或行尾反斜杠表示续行，与命令行一致
  // Multi-line input: an unclosed parenthesis/bracket or a trailing backslash
  // continues the line, exactly like the command line REPL.
  function needsContinuation(line){
    if (/\\\s*$/.test(line)) return true;
    var depth = 0;
    for (var i = 0; i < line.length; i++){
      var c = line.charAt(i);
      if (c === "(" || c === "[") depth++;
      else if (c === ")" || c === "]") depth--;
    }
    return depth > 0;
  }
  function splitLogicalCommands(text){
    var lines = String(text == null ? "" : text).split(/\r?\n/);
    var out = [], cur = null;
    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;
      // 行尾反斜杠是续行标记，去掉后与下一行拼接
      // A trailing backslash marks a continuation and is dropped.
      var continued = /\\\s*$/.test(line);
      if (continued) line = line.replace(/\\\s*$/, "").trim();
      cur = (cur == null) ? line : (cur + " " + line);
      if (!continued && !needsContinuation(cur)){ out.push(cur); cur = null; }
    }
    if (cur != null) out.push(cur);
    return out;
  }
  // 命令面板复用 dialog 的 list 模式 / the palette reuses dialog's list mode
  function openCommandPalette(){
    return dialog({
      title: t("cmdPaletteTitle"), message: t("cmdPaletteMsg"),
      input: true, ok: t("practiceInsert"), list: paletteItems()
    }).then(function(v){ if (v && typeof v === "string") insertText(v); });
  }

  /* ---------------------------------------------------------------- events / 事件 */
  cmd.addEventListener("input", function(){
    cmd.style.height = "auto";
    cmd.style.height = Math.min(cmd.scrollHeight, 120) + "px";
    pushEditor(cmd.value);
    syncEditor();
    openAc();
  });

  cmd.addEventListener("keydown", function(e){
    // 编辑器撤销/重做：独立于终端输出历史 / editor undo/redo, independent of terminal history
    if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")){
      e.preventDefault();
      if (e.shiftKey) editorRedo(); else editorUndo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === "y" || e.key === "Y")){
      e.preventDefault(); editorRedo(); return;
    }
    if (ac.classList.contains("open")){
      if (e.key === "ArrowDown"){ e.preventDefault(); state.acIndex = (state.acIndex + 1) % state.acItems.length; paintAc(); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); state.acIndex = (state.acIndex - 1 + state.acItems.length) % state.acItems.length; paintAc(); return; }
      if (e.key === "Tab" || e.key === "Enter"){ e.preventDefault(); acceptAc(); return; }
      if (e.key === "Escape"){ closeAc(); return; }
    }
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      var v = cmd.value;
      cmd.value = "";
      cmd.style.height = "auto";
      pushEditor("");
      syncEditor();
      if (v.trim()) state.history.push(v);
      state.hIdx = state.history.length;
      // 与命令行一致：未闭合的括号或行尾反斜杠表示续行，多行输入按一条命令发送
      // Like the CLI, an unclosed bracket or a trailing backslash continues the
      // line, so a multi-line term is sent as one command.
      var cmds = splitLogicalCommands(v);
      var chain = Promise.resolve();
      cmds.forEach(function(c){ chain = chain.then(function(){ return exec(c); }); });
      return;
    }
    if (e.key === "ArrowUp" && !cmd.value.includes("\n")){
      if (state.history.length){ if (state.hIdx > 0) state.hIdx--; cmd.value = state.history[state.hIdx] || ""; e.preventDefault(); }
    } else if (e.key === "ArrowDown" && !cmd.value.includes("\n")){
      if (state.history.length){
        if (state.hIdx < state.history.length - 1){ state.hIdx++; cmd.value = state.history[state.hIdx]; }
        else { state.hIdx = state.history.length; cmd.value = ""; }
      }
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")){
      e.preventDefault(); clearAll();
    }
  });

  function paintAc(){
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el, i){
      el.classList.toggle("active", i === state.acIndex);
      if (el.setAttribute) el.setAttribute("aria-selected", i === state.acIndex ? "true" : "false");
    });
    if (ac.setAttribute) ac.setAttribute("aria-activedescendant", "ac-opt-" + state.acIndex);
  }

  // 滚动与光标移动时同步高亮层、行号与括号匹配 / keep layers aligned on scroll and caret moves
  if (cmd.addEventListener){
    cmd.addEventListener("scroll", syncEditorScroll);
    cmd.addEventListener("click", syncEditor);
    cmd.addEventListener("select", syncEditor);
    cmd.addEventListener("keyup", function(e){
      if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" ||
          e.key === "ArrowDown" || e.key === "Home" || e.key === "End") syncEditor();
    });
  }

  async function startSession(opts){
    opts = opts || {};
    out.innerHTML = "";
    state.selected = null;
    state.envRows = [];
    state.replaying = true;
    setManual(false);
    stopPlay();
    try {
      if (!opts.reuse || !state.session) await newSession();
      addLine("info", t("welcome"), null, null, I18N.welcome.zh, I18N.welcome.en);
      for (var i = 0; i < state.codeLines.length; i++){
        await exec(state.codeLines[i], {record: false});
      }
      await evalLine(":lang " + state.lang, true);
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await evalLine(":eta " + (state.eta ? "on" : "off"), true);
      await evalLine(":fast " + (state.fast ? "on" : "off"), true);
      await refreshEnv();
    } finally {
      state.replaying = false;
    }
  }

  function clearAll(){
    state.gen = (state.gen || 0) + 1;
    out.innerHTML = "";
    state.codeLines = [];
    state.selected = null;
    state.envRows = [];
    state.session = null;
    setManual(false);
    newSession().then(async function(){
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await evalLine(":eta " + (state.eta ? "on" : "off"), true);
      await evalLine(":fast " + (state.fast ? "on" : "off"), true);
      addLine("info", t("welcome"), null, null, I18N.welcome.zh, I18N.welcome.en);
      await refreshEnv();
      renderPanel();
      saveLocal();
    });
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    cmd.value = "";
    pushEditor("");
    syncEditor();
    cmd.focus();
  }

  document.addEventListener("click", function(e){
    if (!ac.contains(e.target) && e.target !== cmd) closeAc();
  });

  // 轨迹快捷键：←/→ 单步，空格播放/暂停（输入框内不拦截）
  // Trace shortcuts: ←/→ step, Space plays/pauses (ignored while typing).
  document.addEventListener("keydown", function(e){
    if (state.tab !== "trace" || !state.selected || !state.selected.trace) return;
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ae.tagName)) return;
    var n = state.selected.trace.length;
    if (e.key === "ArrowLeft"){ e.preventDefault(); stopPlay(); state.tracePos = Math.max(0, state.tracePos - 1); renderPanel(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); stopPlay(); state.tracePos = Math.min(n - 1, state.tracePos + 1); renderPanel(); }
    else if (e.key === " "){ e.preventDefault(); if (state.playing){ stopPlay(); renderPanel(); } else startPlay(); }
  });

  // 全局快捷键：命令面板与取消求值 / global shortcuts: palette and cancel
  document.addEventListener("keydown", function(e){
    if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K" || e.key === "p" || e.key === "P")){
      e.preventDefault();
      openCommandPalette();
      return;
    }
    if (e.key === "Escape" && !dialogOpen && !ac.classList.contains("open")){
      if (activeController){ e.preventDefault(); cancelEval(); }
    }
  });

  selects = [initSelect("sel-lang"), initSelect("sel-strategy")];

  var tabEls = document.querySelectorAll(".tab");
  Array.prototype.forEach.call(tabEls, function(b){
    b.addEventListener("click", function(){ switchTab(b.dataset.tab); });
    // roving tabindex 与左右方向键切换 / roving tabindex and Left/Right navigation
    b.addEventListener("keydown", function(e){
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault();
      var arr = Array.prototype.slice.call(tabEls);
      var idx = arr.indexOf(b), next;
      if (e.key === "Home") next = 0;
      else if (e.key === "End") next = arr.length - 1;
      else next = (idx + (e.key === "ArrowRight" ? 1 : -1) + arr.length) % arr.length;
      if (arr[next]){
        switchTab(arr[next].dataset.tab);
        if (arr[next].focus) arr[next].focus();
      }
    });
  });

  $("clear").addEventListener("click", clearAll);
  $("cancel-eval").addEventListener("click", cancelEval);

  $("theme-toggle").addEventListener("click", function(){
    applyTheme(state.theme === "dark" ? "light" : "dark");
    saveLocal();
  });

  $("fast-toggle").addEventListener("click", toggleFast);

  $("lang").addEventListener("change", async function(){
    var lang = $("lang").value;
    state.lang = lang;
    applyStaticTexts();
    // 只切换解释器语言并本地重渲染，不重放历史
    // Switch the interpreter language and re-render locally; no replay.
    if (state.session){
      var r = await api("api/session/" + state.session + "/lang", {lang: lang});
      if (!r.data || !r.data.ok){
        state.session = null;
        setConn(false);
        await rebuild();
      }
    }
    applyTranscriptLang();
    saveLocal();
  });

  $("strategy").addEventListener("change", function(){
    execSilent(":strategy " + $("strategy").value).then(function(outs){
      outs.forEach(function(o){ if (o.kind === "info") addLine("info", o.text); });
      $("st-strategy").textContent = strategyText($("strategy").value);
      saveLocal();
    });
  });

  $("st-limit").addEventListener("change", function(){
    var v = parseInt(this.value, 10);
    if (!(v > 0)){ this.value = state.limit; return; }
    state.limit = v;
    execSilent(":steps " + v).then(function(outs){
      outs.forEach(function(o){
        if (o.kind === "info") addLine("info", o.text);
        else if (o.kind) addLine(o.kind, o.text || "");
      });
      saveLocal();
    });
  });

  // 手动归约 / manual reduction
  $("m-begin").addEventListener("click", async function(){
    var src = cmd.value.trim();
    if (!src){
      var rev = state.codeLines.slice().reverse();
      for (var i = 0; i < rev.length; i++){
        if (rev[i].trim() && rev[i].trim()[0] !== ":"){ src = rev[i].trim(); break; }
      }
    }
    if (!src){ toast(t("manualEmpty")); cmd.focus(); return; }
    cmd.value = ""; cmd.style.height = "auto";
    pushEditor(""); syncEditor();
    var outs = await exec(":begin " + src);
    if (outs && outs.some(function(o){ return o.kind === "term"; })) setManual(true, src);
  });
  $("m-step").addEventListener("click", function(){
    if (state.manual) exec(":step");
  });
  $("m-back").addEventListener("click", function(){
    if (state.manual) exec(":back");
  });
  $("m-start").addEventListener("click", function(){
    if (state.manual) exec(":goto 0");
  });
  $("m-run").addEventListener("click", async function(){
    if (!state.manual) return;

    setManual(false);
  });
  $("m-end").addEventListener("click", async function(){
    if (!state.manual) return;
    await exec(":end");
    setManual(false);

  function sharePayload(){
    return {
      v: 2,
      code: state.codeLines,
      strategy: $("strategy").value,
      limit: state.limit,
      theme: state.theme,
      lang: state.lang,
      eta: state.eta,
      fast: state.fast
    };
  }

  function encodeShareState(){
    return btoa(unescape(encodeURIComponent(JSON.stringify(sharePayload()))))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  // 分享链接可被手工构造（#state= 不经过服务端），因此逐字段校验，
  // 避免非法策略/步数/语言把界面带入无效状态
  // Share links can be crafted (#state= bypasses the server), so validate each
  // field instead of trusting it.
  function validLang(v){ return v === "zh" || v === "en" || v === "both"; }
  function validTheme(v){ return v === "light" || v === "dark"; }
  function validLimit(v){ return typeof v === "number" && isFinite(v) && v > 0; }
  function validStrategy(v){ return typeof v === "string" && !!STRATEGY_LABELS[v]; }

  function applySharePayload(payload){
    if (!payload) return;
    if (Array.isArray(payload.code)) {
      state.codeLines = payload.code.filter(function(x){ return typeof x === "string"; });
    }
    if (typeof payload.strategy === "string" && STRATEGY_LABELS[payload.strategy]) {
      $("strategy").value = payload.strategy;
    }
    if (validLimit(payload.limit)) state.limit = Math.floor(payload.limit);
    if (validTheme(payload.theme)) state.theme = payload.theme;
    if (validLang(payload.lang)) state.lang = payload.lang;
    if (payload.eta != null) state.eta = !!payload.eta;
    if (payload.fast != null) state.fast = !!payload.fast;
    applyFastButton();
  }

  async function copyShareUrl(url){
    try { history.replaceState(null, "", url.slice(url.indexOf("#"))); } catch(e){}
    if (navigator.clipboard){
      try { await navigator.clipboard.writeText(url); toast(t("copied")); }
      catch(e){ toast(t("shareOk")); }
    } else toast(t("shareOk"));
  }

  $("share").addEventListener("click", async function(){
    // 优先存服务端短链；失败时退回完整 #state= 链接
    // Prefer a server-side short id; fall back to the full #state= link.
    try {
      var r = await api("api/share", sharePayload());
      if (r.data && r.data.ok && r.data.id){
        var shortUrl = location.origin + location.pathname + "#s=" + r.data.id;
        await copyShareUrl(shortUrl);
        return;
      }
    } catch(e){}
    var enc = encodeShareState();
    await copyShareUrl(location.origin + location.pathname + "#state=" + enc);
  });

  $("export").addEventListener("click", function(){
    var blob = new Blob([state.codeLines.join("\n") + "\n"], {type:"text/plain;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lambda-session.lam";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  $("import").addEventListener("click", function(){ $("file").click(); });
  $("file").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = async function(){
      var lines = String(reader.result || "").split(/\r?\n/).filter(function(l){ return l.trim(); });
      for (var i = 0; i < lines.length; i++) await exec(lines[i]);
      toast(t("importOk") + " · " + lines.length);
      refreshEnv();
    };
    reader.readAsText(f, "utf-8");
    this.value = "";
  });

  /* --------------------------------------------------------------- examples / 示例 */
  // 分类示例库：每类一组表达式与预期提示 / categorized examples with short hints
  var EXAMPLE_CATS = [
    {key:"basic", items:[
      ["(\\x.x) a", "a"],
      ["\\x.\\y.x", "K"],
      ["(\\x.\\y.x) a b", "a"],
      ["id = \\x.x", "define"],
      [":trace (\\x.x) a", "trace"]
    ]},
    {key:"church", items:[
      ["PLUS ONE TWO", "3"],
      ["MULT TWO THREE", "6"],
      ["PRED THREE", "2"],
      ["SUB THREE ONE", "2"],
      ["SUCC TWO", "3"]
    ]},
    {key:"bool", items:[
      ["IF TRUE ONE TWO", "1"],
      ["NOT FALSE", "TRUE"],
      ["AND TRUE FALSE", "FALSE"],
      ["ISZERO ONE", "FALSE"]
    ]},
    {key:"comb", items:[
      ["(\\x.\\y.x) a b", "K"],
      ["S K K", "I"],
      ["Y", "fixpoint"],
      [":eq \\a.a , \\b.b", "alpha"]
    ]},
    {key:"rec", items:[
      ["rec fact = \\n. IF (ISZERO n) ONE (MULT n (fact (PRED n)))", "rec"],
      ["fact THREE", "6"],
      [":type \\f.\\x.f (f x)", "type"]
    ]},
    {key:"data", items:[
      ["PAIR ONE TWO", "pair"],
      ["FST (PAIR ONE TWO)", "1"],
      ["SND (PAIR ONE TWO)", "2"],
      ["NIL", "nil"]
    ]}
  ];

  function renderExamples(){
    var box = $("examples"), cats = $("ex-cats");
    if (cats){
      cats.innerHTML = EXAMPLE_CATS.map(function(c, i){
        return '<button class="chip ex-cat" type="button" data-cat="' + i + '"' +
               (i === state.exCat ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' +
               esc(t("exCat_" + c.key)) + '</button>';
      }).join("");
      // 分类切换沿用按钮，不用原生 select / category tabs are buttons, not a native select
      if (cats.querySelectorAll){
        Array.prototype.forEach.call(cats.querySelectorAll("[data-cat]"), function(b){
          b.addEventListener("click", function(){
            state.exCat = parseInt(b.dataset.cat, 10) || 0;
            renderExamples();
          });
        });
      }
    }
    if (!box) return;
    var items = (EXAMPLE_CATS[state.exCat] || EXAMPLE_CATS[0]).items;
    box.innerHTML = "";
    items.forEach(function(ex){
      var b = elem("span", "chip");
      b.innerHTML = esc(ex[0]) + ' <span style="color:var(--faint)">· ' + esc(ex[1]) + '</span>';
      b.addEventListener("click", function(){
        cmd.value = ex[0];
        cmd.focus();
        if (cmd.setSelectionRange) cmd.setSelectionRange(cmd.value.length, cmd.value.length);
        pushEditor(cmd.value);
        syncEditor();
      });
      box.appendChild(b);
    });
  }

  function loadPrelude(){
    fetch("api/prelude").then(function(r){ return r.json(); }).then(function(names){
      var box = $("chips");
      box.innerHTML = "";
      (names || []).forEach(function(n){
        var c = elem("span", "chip", esc(n));
        c.addEventListener("click", function(){ insertText(n); });
        box.appendChild(c);
      });
    }).catch(function(){});
  }

  // 不重放命令，直接用服务端同时返回的中/英文本刷新已有输出
  // Refresh existing output from the bilingual fields without replaying.
  function applyTranscriptLang(){
    Array.prototype.forEach.call(out.querySelectorAll(".line"), function(el){
      if (el._zh != null){
        var body = el.querySelector(".body");
        if (body) body.textContent = pickPair(el._zh, el._en, el._zh);
      }
      if (el._metaObj){
        var m = el.querySelector(".meta");
        if (m) m.textContent = resultMeta(el._metaObj);
      }
    });
    Array.prototype.forEach.call(out.querySelectorAll(".act"), function(b){
      if (b._relabel) b._relabel();
    });
    renderRedexes();
    refreshStType();
    renderPanel();
  }

  function applyStaticTexts(){
    document.body.dataset.lang = state.lang;
    $("subline").textContent = t("subline");
    $("ex-title").textContent = t("exTitle");
    $("pre-title").textContent = t("preTitle");
    $("foot-hint").textContent = t("foot");
    $("clear").textContent = t("clear");
    $("skip-link").textContent = t("skipLink");
    $("cancel-eval").textContent = t("cancelEval");
    $("share").textContent = t("share");
    $("export").textContent = t("exportB");
    $("import").textContent = t("importB");
    applyPlaceholder();
    $("theme-toggle").textContent = state.theme === "dark" ? t("light") : t("dark");
    $("st-steps-label").textContent = t("steps");
    $("m-label").textContent = t("manual");
    $("m-begin").textContent = t("begin");
    $("m-back").textContent = t("backB");
    $("m-start").textContent = t("startB");
    $("m-step").textContent = t("stepB");
    $("m-run").textContent = t("runB");
    $("m-end").textContent = t("endB");
    Array.prototype.forEach.call($("strategy").options, function(o){
      if (STRATEGY_LABELS[o.value]) o.textContent = strategyText(o.value);
    });
    $("st-strategy").textContent = strategyText($("strategy").value);
    applyFastButton();
    selects.forEach(function(s){ s.sync(); });
    renderExamples();
  }

  /* ------------------------------------------------------------------ boot / 启动 */
  async function boot(){
    var saved = loadLocal();
    if (saved){
      if (validLang(saved.lang)) state.lang = saved.lang;
      if (validTheme(saved.theme)) state.theme = saved.theme;
      if (validLimit(saved.limit)) state.limit = Math.floor(saved.limit);
      state.eta = !!saved.eta;
      state.fast = !!saved.fast;
      if (typeof saved.strategy === "string" && STRATEGY_LABELS[saved.strategy]) {
        $("strategy").value = saved.strategy;
      }
      if (Array.isArray(saved.code)) {
        state.codeLines = saved.code.filter(function(x){ return typeof x === "string"; });
      }
    }
    // 首次访问默认浅色；之后沿用用户保存的主题
    // First visit defaults to light; later visits keep the saved theme.
    applyTheme(state.theme);
    $("lang").value = state.lang;
    $("st-strategy").textContent = $("strategy").value;
    $("st-limit").value = state.limit;
    applyStaticTexts();
    loadPrelude();

    // URL 分享链接优先：新格式含代码 + 策略 + 步数 + 主题 + 语言
    // URL share state first: new format carries code, strategy, limit, theme and language.
    var hash = location.hash.slice(1);
    if (hash.indexOf("s=") === 0){
      try {
        var sr = await api("api/share/" + hash.slice(2), null, "GET");
        if (sr.data && sr.data.ok) applySharePayload(sr.data.state);
      } catch(e){}
    } else if (hash.indexOf("state=") === 0){
      try {
        var sb64 = hash.slice(6).replace(/-/g,"+").replace(/_/g,"/");
        while (sb64.length % 4) sb64 += "=";
        applySharePayload(JSON.parse(decodeURIComponent(escape(atob(sb64)))));
      } catch(e){}
    } else if (hash.indexOf("code=") === 0){
      try {
        var b64 = hash.slice(5).replace(/-/g,"+").replace(/_/g,"/");
        while (b64.length % 4) b64 += "=";
        var text = decodeURIComponent(escape(atob(b64)));
        state.codeLines = text.split("\n").filter(function(l){ return l.trim(); });
      } catch(e){}
    }

    var stepsLine = state.codeLines.filter(function(l){ return /^:steps\s+\d+/.test(l.trim()); }).pop();
    if (stepsLine) state.limit = parseInt(stepsLine.trim().split(/\s+/)[1], 10) || state.limit;
    // 分享链接可能覆盖语言/主题/策略，重新应用一次
    // A share link may override language/theme/strategy; re-apply them.
    applyTheme(state.theme);
    $("lang").value = state.lang;
    $("st-strategy").textContent = strategyText($("strategy").value);
    $("st-limit").value = state.limit;
    applyStaticTexts();
    await startSession();
    renderPanel();
    if (!saved && !state.codeLines.length && !hash) switchTab("guide");
    syncEditor();
    cmd.focus();
    showNarrowHint();
  }

  if (phoneQuery){
    if (phoneQuery.addEventListener) phoneQuery.addEventListener("change", applyPlaceholder);
    else if (phoneQuery.addListener) phoneQuery.addListener(applyPlaceholder);
  }

  boot();
})();
</script>
</body>
</html>
