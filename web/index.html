<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="./">
<link rel="icon" href="/icon.ico" type="image/x-icon">
<title>Lambda 演算计算器 · Lambda Calculus</title>
<style>
  @font-face{
    font-family:'APL385 Unicode';
    src:url(fonts/APL385.ttf) format('truetype');
    font-display:swap;
  }
  .lam{font-family:'APL385 Unicode',var(--mono);}
  :root{
    color-scheme: light;
    --bg:#fafaf8; --paper:#ffffff; --term-bg:#ffffff;
    --text:#141518; --dim:#5c5f66; --faint:#9a9da3;
    --border:rgba(20,21,24,.14); --border-strong:rgba(20,21,24,.46);
    --hover:rgba(20,21,24,.045);
    --accent:#141518; --prompt:#141518;
    --ok:#2f7d4f; --err:#b83a30; --warn:#8a6416; --info:#5c5f66;
    --del:#b83a30; --ins:#2f7d4f;
    --sel:rgba(20,21,24,.14);
    --scroll:#dddcd6; --scroll-hover:#bfbeb7;
    --mono:'APL385 Unicode','SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',Menlo,'Courier New',monospace;
    --serif:"Georgia","Times New Roman","Songti SC","SimSun","宋体",serif;
    --radius:2px;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b0c0e; --paper:#0e0f11; --term-bg:#0b0c0e;
    --text:#e8e9ec; --dim:#a2a5ac; --faint:#6b6f77;
    --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.44);
    --hover:rgba(255,255,255,.05);
    --accent:#f0f1f3; --prompt:#f0f1f3;
    --ok:#84c99b; --err:#e8887e; --warn:#d8b978; --info:#9ea1a8;
    --del:#e8887e; --ins:#84c99b;
    --sel:rgba(255,255,255,.16);
    --scroll:#26282d; --scroll-hover:#3a3d43;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--sel);color:inherit;}
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:14px;line-height:1.7;transition:background .2s ease,color .2s ease;}
  .app{max-width:1180px;margin:0 auto;padding:36px 20px 56px;}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px;flex-wrap:wrap;}
  h1{font-size:18px;font-weight:400;margin:0 0 4px;letter-spacing:.04em;font-family:var(--mono);}
  .sub{color:var(--dim);font-size:11.5px;margin:0;letter-spacing:.01em;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button.ctl,.sel-btn{font-family:var(--mono);font-size:11.5px;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;transition:color .15s,border-color .15s;}
  button.ctl:hover,.sel-btn:hover{color:var(--text);border-color:var(--border-strong);}
  button.ctl:focus-visible,.sel-btn:focus-visible{outline:1px solid var(--accent);outline-offset:2px;}
  .sel{position:relative;display:inline-flex;}
  .sel > select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;}
  .sel-btn{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;}
  .sel-btn .chev{color:var(--faint);font-size:9px;line-height:1;}
  .sel.open .sel-btn{border-color:var(--border-strong);color:var(--text);}
  .sel-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);display:none;max-height:280px;overflow:auto;padding:2px 0;}
  .sel.open .sel-menu{display:block;}
  .sel-opt{padding:5px 10px 5px 9px;border-left:1px solid transparent;font-family:var(--mono);font-size:11.5px;color:var(--dim);cursor:pointer;white-space:nowrap;}
  .sel-opt:hover{color:var(--text);}
  .sel-opt[aria-selected="true"]{color:var(--text);border-left-color:var(--accent);}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.open{display:flex;}
  .modal .box{width:min(420px,100%);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:16px;font-family:var(--mono);}
  .modal h3{margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400;}
  .modal p{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.6;}
  .modal input{width:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:12.5px;padding:7px 9px;outline:none;margin-bottom:14px;}
  .modal input:focus{border-color:var(--border-strong);}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:18px;align-items:start;}
  @media (max-width:900px){ main{grid-template-columns:minmax(0,1fr);} }
  .term{background:transparent;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .term-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);}
  .term-title{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase;}
  .term-tools{margin-left:auto;display:flex;gap:6px;}
  .term-tools button{font-family:var(--mono);font-size:11px;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:3px 9px;cursor:pointer;}
  .term-tools button:hover{background:var(--hover);color:var(--text);}
  .term-body{padding:12px 14px 10px;}
  .term-out{min-height:250px;max-height:56vh;overflow-y:auto;font-family:var(--mono);font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;padding-right:6px;}
  .line{margin:2px 0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .line .body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;}
  .line.echo{color:var(--faint);}
  .line.echo .p{color:var(--prompt);font-weight:600;}
  .line.result .body{color:var(--text);}
  .line.result .mark{color:var(--ok);}
  .line.define{color:var(--dim);}
  .line.define .mark{color:var(--faint);}
  .line.error .body{color:var(--err);}
  .line.fail .body{color:var(--err);}
  .line.warn .body{color:var(--warn);}
  .line.info .body{color:var(--info);}
  .mark{flex:none;font-weight:600;user-select:none;}
  .meta{font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;white-space:nowrap;background:transparent;}
  .line .act{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:0 7px;cursor:pointer;opacity:0;transition:opacity .12s,color .12s,border-color .12s;}
  .line:hover .act,.line.sel .act{opacity:1;}
  .line .act:hover{color:var(--text);border-color:var(--border-strong);}
  .line.sel{background:var(--hover);border-radius:var(--radius);}
  .caret{color:var(--err);font-family:var(--mono);white-space:pre;}
  .term-line{display:flex;align-items:flex-start;gap:9px;margin-top:10px;font-family:var(--mono);font-size:13.5px;border-top:1px solid var(--border);padding-top:11px;}
  .prompt{color:var(--prompt);flex:none;user-select:none;font-weight:600;padding-top:2px;}
  .input-wrap{flex:1;min-width:0;position:relative;}
  #cmd{width:100%;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--mono);font-size:13.5px;caret-color:var(--accent);padding:2px 0;resize:none;line-height:1.7;}
  #cmd::placeholder{color:var(--faint);}
  .ac{position:absolute;left:0;top:100%;z-index:20;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);min-width:220px;max-height:240px;overflow:auto;display:none;}
  .ac.open{display:block;}
  .ac .item{padding:4px 10px;font-family:var(--mono);font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;}
  .ac .item .hint{color:var(--faint);font-size:11px;}
  .ac .item.active,.ac .item:hover{background:var(--hover);}
  .status{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;align-items:center;}
  .status b{font-weight:500;color:var(--dim);}
  .status .lim{display:inline-flex;align-items:center;gap:5px;}
  .status input[type=number]{width:66px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);font-family:var(--mono);font-size:10.5px;padding:1px 4px;-moz-appearance:textfield;}
  .status input[type=number]::-webkit-outer-spin-button,
  .status input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .status input[type=number]:focus-visible{outline:1px solid var(--accent);outline-offset:1px;}
  .manual-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .mini{font-family:var(--mono);font-size:10.5px;color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:2px 8px;cursor:pointer;}
  .mini:hover:not(:disabled){color:var(--text);border-color:var(--border-strong);}
  .mini:disabled{opacity:.35;cursor:default;}
  .manual-bar .mterm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .panel-head h3{margin:0;}
  .panel-head .hp{display:flex;gap:6px;flex:none;}
  /* 右侧面板 / inspector */
  .side{background:transparent;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tab{flex:0 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono);font-size:11.5px;color:var(--dim);background:transparent;border:0;border-bottom:1px solid transparent;padding:8px 7px 7px;cursor:pointer;white-space:nowrap;}
  .tab .en{font-size:9px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
  .tab:hover{color:var(--text);}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);}
  .tab[aria-selected="true"] .en{color:var(--dim);}
  body[data-lang="zh"] .tab .en{display:none;}
  body[data-lang="en"] .tab .zh{display:none;}
  .panel{padding:12px 14px;min-height:280px;max-height:64vh;overflow:auto;font-family:var(--mono);}
  .panel h3{font-size:11px;font-weight:400;color:var(--dim);margin:0 0 8px;letter-spacing:.05em;font-family:var(--mono);text-transform:uppercase;}
  .panel pre{font-family:var(--mono);font-size:12.5px;line-height:1.7;margin:0;white-space:pre-wrap;word-break:break-word;}
  .empty{color:var(--faint);font-size:12px;font-style:italic;}
  .player{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .player button{font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);width:28px;height:26px;cursor:pointer;}
  .player button:hover{color:var(--text);border-color:var(--border-strong);}
  .player input[type=range]{flex:1;height:16px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;--p:0%;}
  .player input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:0;background:linear-gradient(to right,var(--text) 0 var(--p),var(--border) var(--p) 100%);}
  .player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-3.5px;border-radius:50%;background:var(--text);border:0;}
  .player input[type=range]::-moz-range-track{height:2px;border-radius:0;background:var(--border);}
  .player input[type=range]::-moz-range-progress{height:2px;background:var(--text);}
  .player input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--text);}
  .player input[type=range]:focus-visible{outline:1px solid var(--accent);outline-offset:3px;}
  .player .count{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;}
  .cmp{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
  .cmp .row{padding:8px 10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word;}
  .cmp .row + .row{border-top:1px dashed var(--border);}
  .cmp .lab{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.05em;display:block;margin-bottom:2px;}
  .cmp del{background:rgba(192,57,43,.16);color:var(--del);text-decoration:none;border-radius:2px;}
  .cmp ins{background:rgba(47,143,82,.16);color:var(--ins);text-decoration:none;border-radius:2px;}
  .note{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-bottom:10px;}
  .steps-list{display:flex;flex-direction:column;gap:2px;}
  .steps-list .st{font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:4px 8px;border-left:1px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .steps-list .st:hover{color:var(--text);border-left-color:var(--border-strong);}
  .steps-list .st.active{color:var(--text);border-left-color:var(--accent);}
  .env-row{display:flex;flex-direction:column;gap:1px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .env-row:last-child{border-bottom:0;}
  .env-head{display:flex;align-items:center;gap:8px;}
  .env-name{font-family:var(--mono);font-size:12.5px;color:var(--text);cursor:pointer;border-bottom:1px solid transparent;}
  .env-name:hover{border-bottom-color:var(--border-strong);}
  .env-val{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre-wrap;word-break:break-word;}
  .env-ty{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .env-del{margin-left:auto;font-size:10.5px;color:var(--faint);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;cursor:pointer;opacity:0;}
  .env-row:hover .env-del{opacity:1;}
  .env-del:hover{color:var(--err);border-color:var(--err);}
  .help-dl dt{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:7px;}
  .help-dl dd{margin:0 0 2px 0;font-size:12px;color:var(--dim);}
  .guide-step{padding:9px 0;border-top:1px dashed var(--border);}
  .guide-step:first-of-type{border-top:0;padding-top:0;}
  .guide-step h4{margin:0 0 3px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--text);font-weight:400;}
  .guide-step p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.65;}
  .guide-step .en-line{display:block;color:var(--faint);font-size:11px;margin-top:2px;}
  .guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  footer{margin-top:18px;}
  .helpers{margin-top:16px;}
  .helpers h2{font-size:10.5px;font-weight:400;color:var(--faint);margin:0 0 9px;letter-spacing:.14em;font-family:var(--mono);text-transform:uppercase;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);cursor:pointer;background:transparent;transition:color .12s,border-color .12s;}
  .chip:hover{color:var(--text);border-color:var(--border-strong);}
  .hint{color:var(--faint);font-size:11.5px;margin-top:9px;font-family:var(--mono);}
  kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--dim);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;font-family:var(--mono);font-size:12px;color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1><span class="lam">λ</span> 演算计算器 <span style="color:var(--faint)">/ Lambda Calculus</span></h1>
      <p class="sub" id="subline">Haskell 解释器 · 归约轨迹 · 语法树 · 类型推断</p>
    </div>
    <div class="controls">
      <div class="sel" id="sel-lang">
        <select id="lang" aria-label="language" tabindex="-1" aria-hidden="true">
          <option value="both">中 / EN</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="sel-label"></span><span class="chev">▾</span>
        </button>
        <div class="sel-menu" role="listbox"></div>
      </div>
      <div class="sel" id="sel-strategy">
        <select id="strategy" aria-label="strategy" tabindex="-1" aria-hidden="true">
          <option value="applicative">应用序 / applicative</option>
          <option value="normal">正规序 / normal</option>
          <option value="cbn">按名 / call-by-name</option>
          <option value="cbv">按值 / call-by-value</option>
        </select>
        <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="sel-label"></span><span class="chev">▾</span>
        </button>
        <div class="sel-menu" role="listbox"></div>
      </div>
      <button class="ctl" id="share" type="button">分享 / Share</button>
      <button class="ctl" id="export" type="button">导出 / Export</button>
      <button class="ctl" id="import" type="button">导入 / Import</button>
      <button class="ctl" id="theme-toggle" type="button">深色 / Dark</button>
      <input type="file" id="file" accept=".lam,.txt" hidden>
    </div>
  </header>

  <main>
    <section class="term" aria-label="REPL">
      <div class="term-bar">
        <span class="term-title">lambda-repl</span>
        <div class="term-tools">
          <button id="clear" type="button">清空 / clear</button>
        </div>
      </div>
      <div class="term-body">
        <div class="term-out" id="out" aria-live="polite"></div>
        <div class="term-line">
          <span class="prompt">λ&gt;</span>
          <div class="input-wrap">
            <textarea id="cmd" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"
              placeholder="输入表达式，回车执行 / type an expression, Enter to run"></textarea>
            <div class="ac" id="ac" role="listbox"></div>
          </div>
        </div>
        <div class="status">
          <span><b id="st-strategy">applicative</b></span>
          <span class="lim"><span id="st-steps-label">步 / steps</span>
            <input id="st-limit" type="number" min="1" step="1000" value="10000" aria-label="reduction step limit"></span>
          <span><b id="st-type">—</b></span>
          <span id="st-conn">●</span>
        </div>
        <div class="manual-bar">
          <span id="m-label">手动 / Manual</span>
          <button class="mini" id="m-begin" type="button">开始 / begin</button>
          <button class="mini" id="m-step" type="button" disabled>单步 / step</button>
          <button class="mini" id="m-run" type="button" disabled>到底 / run</button>
          <button class="mini" id="m-end" type="button" disabled>结束 / end</button>
          <span class="mterm" id="m-term"></span>
        </div>
      </div>
    </section>

    <aside class="side" aria-label="inspector">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="trace" aria-selected="true"><span class="zh">轨迹</span><span class="en">Trace</span></button>
        <button class="tab" role="tab" data-tab="ast"><span class="zh">结构</span><span class="en">AST</span></button>
        <button class="tab" role="tab" data-tab="type"><span class="zh">类型</span><span class="en">Type</span></button>
        <button class="tab" role="tab" data-tab="env"><span class="zh">环境</span><span class="en">Env</span></button>
        <button class="tab" role="tab" data-tab="help"><span class="zh">帮助</span><span class="en">Help</span></button>
        <button class="tab" role="tab" data-tab="guide"><span class="zh">指引</span><span class="en">Guide</span></button>
      </div>
      <div class="panel" id="panel"></div>
    </aside>
  </main>

  <footer>
    <div class="helpers">
      <h2 id="ex-title">示例（点击填入） / Examples</h2>
      <div class="chips" id="examples"></div>
    </div>
    <div class="helpers">

</div>

<script>
(function(){
  "use strict";

  /* ------------------------------------------------------------------ i18n */
  var I18N = {
    subline: {zh:"Haskell 解释器 · 归约轨迹 · 语法树 · 类型推断", en:"Haskell interpreter · reduction traces · AST · types"},
    exTitle: {zh:"示例（点击填入）", en:"Examples (click to insert)"},

    dark:    {zh:"深色", en:"Dark"}, light:{zh:"浅色", en:"Light"},

    reset:   {zh:"重置", en:"reset"},
    resetAsk:{zh:"确定要清空所有自定义定义吗？", en:"Reset all user definitions?"},
    loadB:   {zh:"加载", en:"load"},
    loadAsk: {zh:".lam 文件路径（相对解释器目录）", en:"path to a .lam file (relative to the interpreter directory)"},
    ok:      {zh:"确定", en:"OK"},
    cancel:  {zh:"取消", en:"cancel"},
    share:   {zh:"分享", en:"Share"},
    exportB: {zh:"导出", en:"Export"},
    importB: {zh:"导入", en:"Import"},
    placeholder:{zh:"输入表达式，回车执行", en:"type an expression, Enter to run"},
    manualEmpty:{zh:"先输入一个表达式，再点“开始”。", en:"Type an expression first, then press begin."},
    trace:   {zh:"轨迹", en:"trace"}, ast:{zh:"结构", en:"AST"}, type:{zh:"类型", en:"type"},
    welcome: {zh:"REPL 就绪。输入表达式后按 Enter 执行；右侧面板会显示归约轨迹、语法树与类型。", en:"REPL ready. Press Enter to run; the panel shows traces, AST and types."},
    noTrace: {zh:"这个结果没有归约步骤（已经是正规形）。", en:"No reduction steps for this result (already a normal form)."},
    noSel:   {zh:"执行一个表达式后，这里会显示它的归约轨迹。", en:"Run an expression to see its reduction trace here."},
    noAst:   {zh:"还没有可显示的语法树。", en:"No syntax tree yet."},
    noType:  {zh:"无法推断类型（无类型项或尚未执行表达式）。", en:"No type available (untypable term, or nothing run yet)."},
    envEmpty:{zh:"环境为空。", en:"Environment is empty."},
    before:  {zh:"归约前", en:"before"}, after:{zh:"归约后", en:"after"},
    step:    {zh:"第", en:"step"}, of:{zh:"步，共", en:"of"},
    shareOk: {zh:"链接已复制到地址栏", en:"Link is in the address bar"},
    copied:  {zh:"已复制链接", en:"Link copied"},
    importOk:{zh:"已导入", en:"Imported"},
    del:     {zh:"删除", en:"del"},
    run:     {zh:"运行", en:"run"},
    timeout: {zh:"计算超时，已重置会话。", en:"Timed out; session reset."},
    conn:    {zh:"已连接", en:"connected"}, dead:{zh:"已断开", en:"disconnected"},
    helpTitle:{zh:"命令", en:"Commands"},
    guideTitle:{zh:"使用指引", en:"Quick guide"},
    helpBody:{zh:"表达式语法：λx.body 或 \\\\x.body；应用 f a 左结合；括号 (expr)；数字自动转 Church 编码。", en:"Syntax: λx.body or \\\\x.body; application f a is left-assoc; grouping (expr); numbers become Church numerals."},
    typeHint:{zh:"简单类型（Hindley–Milner），自由变量用 t0, t1… 表示。", en:"Simple types (Hindley–Milner); free type variables appear as t0, t1…"},
    envHint:{zh:"点击变量名插入到输入框；悬停可删除。", en:"Click a name to insert it; hover to delete."}
  };

  var state = {
    lang: "both",
    theme: "light",
    session: null,
    codeLines: [],
    history: [],
    hIdx: 0,
    selected: null,      // 当前选中的 result 对象 / current result object
    tracePos: 0,
    tab: "trace",
    envRows: [],
    manual: false,       // 手动归约模式 / manual reduction mode
    manualTerm: "",
    limit: 10000,
    replaying: false,
    typing: false,
    acIndex: -1,
    acItems: []
  };

  var $ = function(id){ return document.getElementById(id); };
  var out = $("out"), cmd = $("cmd"), ac = $("ac"), panel = $("panel");
  var root = document.documentElement;

  function t(key, extra){
    var e = I18N[key] || {zh:key, en:key};
    if (state.lang === "zh") return e.zh;
    if (state.lang === "en") return e.en;
    return e.zh + " / " + e.en;
  }

  function dual(zh, en){
    if (state.lang === "zh") return zh;
    if (state.lang === "en") return en;
    return zh + " / " + en;
  }

  function bilingual(zh, en){
    if (state.lang === "zh") return esc(zh);
    if (state.lang === "en") return esc(en);
    return esc(zh) + '<span class="en-line">' + esc(en) + '</span>';
  }

  var STRATEGY_LABELS = {
    applicative: {zh: "应用序", en: "applicative"},
    normal:      {zh: "正规序", en: "normal"},
    cbn:         {zh: "按名调用", en: "call-by-name"},
    cbv:         {zh: "按值调用", en: "call-by-value"}
  };

  function strategyText(value){
    var p = STRATEGY_LABELS[value];
    return p ? dual(p.zh, p.en) : value;
  }

  /* -------------------------------------------------- custom select / 下拉 */
  function initSelect(wrapId){
    var wrap = $(wrapId);
    var sel = wrap.querySelector("select");
    var btn = wrap.querySelector(".sel-btn");
    var menu = wrap.querySelector(".sel-menu");
    var label = btn.querySelector(".sel-label");

    function sync(){
      var opt = sel.options[sel.selectedIndex];
      label.textContent = opt ? opt.textContent : "";
    }
    function paint(){
      menu.innerHTML = Array.prototype.map.call(sel.options, function(o, i){
        return '<div class="sel-opt" role="option" data-i="' + i + '" aria-selected="' +
               (o.selected ? "true" : "false") + '">' + esc(o.textContent) + '</div>';
      }).join("");
    }
    function open(){
      paint();
      wrap.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
    }
    function close(){
      wrap.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
    function choose(i){
      if (i < 0 || i >= sel.options.length) return;
      sel.selectedIndex = i;
      sel.dispatchEvent(new Event("change", {bubbles: true}));
      sync();
      close();
      btn.focus();
    }
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if (wrap.classList.contains("open")) close(); else open();
    });
    btn.addEventListener("keydown", function(e){
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        var n = sel.options.length;
        choose((sel.selectedIndex + (e.key === "ArrowDown" ? 1 : -1) + n) % n);
      } else if (e.key === "Escape"){
        close();
      }
    });
    menu.addEventListener("click", function(e){
      var opt = e.target.closest(".sel-opt");
      if (opt) choose(parseInt(opt.dataset.i, 10));
    });
    sel.addEventListener("change", sync);
    document.addEventListener("click", function(e){
      if (!wrap.contains(e.target)) close();
    });
    sync();
    return {sync: sync, close: close};
  }

  /* ------------------------------------------------ custom dialog / 对话框 */
  function dialog(opts){
    return new Promise(function(resolve){
      var modal = $("modal"), input = $("modal-input");
      $("modal-title").textContent = opts.title || "";
      $("modal-text").textContent = opts.message || "";
      $("modal-text").hidden = !opts.message;
      input.hidden = !opts.input;
      input.value = opts.value || "";
      $("modal-ok").textContent = opts.ok || t("ok");
      $("modal-cancel").textContent = opts.cancel || t("cancel");

      function finish(value){
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        document.removeEventListener("keydown", onKey, true);
        modal.removeEventListener("click", onBackdrop);
        resolve(value);
      }
      function accept(){
        finish(opts.input ? input.value.trim() : true);
      }
      function onKey(e){
        if (e.key === "Escape"){ e.preventDefault(); finish(null); }
        else if (e.key === "Enter"){ e.preventDefault(); accept(); }
      }
      function onBackdrop(e){ if (e.target === modal) finish(null); }
      $("modal-ok").onclick = accept;
      $("modal-cancel").onclick = function(){ finish(null); };
      modal.addEventListener("click", onBackdrop);
      document.addEventListener("keydown", onKey, true);
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      (opts.input ? input : $("modal-ok")).focus();
      if (opts.input) input.select();
    });
  }

  var selects = [];

  /* --------------------------------------------------------------- storage */
  var LS = "lambda.ui.v2";
  function saveLocal(){
    try {
      localStorage.setItem(LS, JSON.stringify({
        lang: state.lang, theme: state.theme, strategy: $("strategy").value,
        limit: state.limit, code: state.codeLines
      }));
    } catch(e){}
  }
  function loadLocal(){
    try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch(e){ return null; }
  }

  /* ----------------------------------------------------------------- theme */
  function applyTheme(th){
    state.theme = th;
    root.setAttribute("data-theme", th);
    $("theme-toggle").textContent = th === "dark" ? t("light") : t("dark");
  }

  /* ------------------------------------------------------------- text utils */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function shorten(s, n){
    s = String(s == null ? "" : s);
    return s.length <= n ? s : s.slice(0, n - 1) + "…";
  }
  function elem(tag, cls, html){
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }
  function scrollDown(){ out.scrollTop = out.scrollHeight; }

  function toast(msg){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1600);
  }

  /* ------------------------------------------------------------- terminal */
  function echoPrompt(line){
    var d = elem("div", "line echo");
    d.innerHTML = '<span class="mark p">λ&gt;</span><span class="body"></span>';
    d.querySelector(".body").textContent = line;
    out.appendChild(d);
  }

  function addLine(kind, text, meta, source){
    var d = elem("div", "line " + kind);
    var mark = "·";
    if (kind === "result") mark = "⇒";
    else if (kind === "define") mark = "⟶";
    else if (kind === "error" || kind === "fail") mark = "⚠";
    else if (kind === "warn") mark = "⚠";
    else if (kind === "step") mark = "→";
    d.innerHTML = '<span class="mark">' + mark + '</span><span class="body"></span>';
    d.querySelector(".body").textContent = text;
    if (meta){
      var m = elem("span", "meta");
      m.textContent = meta;
      d.appendChild(m);
    }
    out.appendChild(d);
    return d;
  }

  function addActions(lineEl, obj, source){
    // 手动单步的输出没有 trace，补一个单步对比 / synthesize a one-step trace
    if (!obj.trace && obj.before && obj.term){
      obj = Object.assign({}, obj, {
        trace: [{n: 1, rule: obj.rule || "β", note: obj.note || "",
                 before: obj.before, after: obj.term}],
        steps: 1
      });
    }
    var btn = elem("button", "act", "⚙ " + t("trace"));
    btn.type = "button";
    btn.addEventListener("click", function(ev){
      ev.stopPropagation();
      selectResult(obj, lineEl, "trace");
    });
    lineEl.appendChild(btn);
    lineEl.addEventListener("click", function(){
      if (obj.trace || obj.ast || obj.type) selectResult(obj, lineEl, state.tab === "trace" && !obj.trace ? "ast" : "trace");
    });
    lineEl._obj = obj;
    return obj;
  }

  function selectResult(obj, lineEl, tab){
    state.selected = obj;
    state.tracePos = (obj.trace && obj.trace.length) ? obj.trace.length - 1 : 0;
    Array.prototype.forEach.call(out.querySelectorAll(".line.sel"), function(n){ n.classList.remove("sel"); });
    if (lineEl && lineEl.classList) lineEl.classList.add("sel");
    switchTab(tab || "trace");
  }

  function renderOutput(obj, source, silent){
    if (obj.kind === "env"){
      state.envRows = obj.rows || [];
      if (state.tab === "env") renderPanel();
      return;
    }
    if (silent) return;

    if (obj.kind === "result" || obj.kind === "warn"){
      var meta = [];
      if (obj.steps) meta.push(obj.steps + " " + t("steps"));
      if (obj.hint) meta.push(obj.hint.trim());
      var el = addLine(obj.kind, obj.term || obj.text, meta.join(" · "));
      addActions(el, obj, source);
      if (!state.selected) selectResult(obj, el, "trace");
      if (state.tab !== "env" && el.classList.contains("sel")) renderPanel();
      return;
    }
    if (obj.kind === "error"){
      var d = addLine("error", obj.text);
      if (obj.pos && source){
        var caret = elem("div", "line");
        caret.innerHTML = '<span class="mark"></span><span class="caret"></span>';
        caret.querySelector(".caret").textContent = " ".repeat(Math.max(0, obj.pos + 3)) + "^";
        out.appendChild(caret);
      }
      return;
    }
    if (obj.kind === "fail" || obj.kind === "info" || obj.kind === "define" || obj.kind === "step" || obj.kind === "term"){
      var line = addLine(obj.kind, obj.text || obj.term);
      if (obj.kind === "step" && obj.term) line.querySelector(".body").textContent = obj.term;
      if (obj.kind === "define") { if (!state.replaying) refreshEnv(); }
      if (obj.kind === "term"){ setManual(true, obj.term); }
      if (obj.kind === "term" || obj.kind === "step"){
        var enriched = addActions(line, obj, source);
        if (obj.kind === "step") selectResult(enriched, line, "trace");
      }
      return;
    }
    if (obj.kind === "trace"){
      var o = {term: obj.final, trace: obj.trace || [], steps: obj.steps || 0, type: ""};
      var el2 = addLine("result", o.term, (o.steps || 0) + " " + t("steps"));
      addActions(el2, o, source);
      selectResult(o, el2, "trace");
      return;
    }
    if (obj.kind === "ast"){
      state.selected = {ast: obj.tree, term: ""};
      switchTab("ast");
      return;
    }
    if (obj.kind === "db"){
      addLine("info", "db: " + (obj.text || ""));
      state.selected = {term: obj.term || "", ast: obj.ast || [], db: obj.text || ""};
      switchTab("ast");
      return;
    }
    if (obj.kind === "type"){
      addLine("info", "⊢ " + (obj.type || obj.text));
      state.selected = obj;
      switchTab("type");
      return;
    }
    if (obj.kind === "help"){
      addLine("info", obj.text || "");
      switchTab("help");
      return;
    }
    addLine("info", obj.text || "");
  }

  /* ------------------------------------------------------------- inspector */
  function switchTab(tab){
    state.tab = tab;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false");
    });
    renderPanel();
  }

  function diffParts(a, b){
    a = String(a || ""); b = String(b || "");
    var p = 0;
    while (p < a.length && p < b.length && a[p] === b[p]) p++;
    var s = 0;
    while (s < a.length - p && s < b.length - p && a[a.length-1-s] === b[b.length-1-s]) s++;
    return { pre: a.slice(0, p), aMid: a.slice(p, a.length - s), bMid: b.slice(p, b.length - s), suf: a.slice(a.length - s) };
  }

  function renderTrace(){
    var obj = state.selected;
    if (!obj || (!obj.trace && !obj.term)) return '<p class="empty">' + esc(t("noSel")) + '</p>';
    var steps = obj.trace || [];
    if (!steps.length) return '<p class="empty">' + esc(t("noTrace")) + '</p>';

    var i = Math.min(state.tracePos, steps.length - 1);
    var st = steps[i];
    var d = diffParts(st.before, st.after);
    var html = '';
    html += '<div class="player">';
    html += '<button type="button" data-nav="prev" aria-label="prev">◀</button>';
    var pct = steps.length > 1 ? (i / (steps.length - 1) * 100) : 0;
    html += '<input type="range" id="tr-range" min="0" max="' + (steps.length - 1) + '" value="' + i + '" style="--p:' + pct + '%">';
    html += '<button type="button" data-nav="next" aria-label="next">▶</button>';
    html += '<span class="count">' + (i + 1) + " / " + steps.length + '</span>';
    html += '</div>';
    html += '<div class="note">' + esc(st.note || ("β " + (i + 1))) + '</div>';
    html += '<div class="cmp">';
    html += '<div class="row"><span class="lab">' + esc(t("before")) + '</span>' + esc(st.before) + '</div>';
    html += '<div class="row"><span class="lab">' + esc(t("after")) + '</span>' +
            esc(d.pre) + (d.bMid ? '<ins>' + esc(d.bMid) + '</ins>' : '') + esc(d.suf) + '</div>';
    html += '</div>';
    html += '<div class="steps-list">';
    steps.forEach(function(s, k){
      html += '<div class="st' + (k === i ? ' active' : '') + '" data-step="' + k + '">' +
              (k + 1) + '. ' + esc(shorten(s.after, 64)) + '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderAst(){
    var obj = state.selected;
    if (!obj || !obj.ast || !obj.ast.length) return '<p class="empty">' + esc(t("noAst")) + '</p>';
    var html = '<h3>' + esc(t("ast")) + '</h3><pre>' + obj.ast.map(esc).join("\n") + '</pre>';
    if (obj.db) html += '<h3 style="margin-top:12px">de Bruijn</h3><pre>' + esc(obj.db) + '</pre>';
    return html;
  }

  function renderType(){
    var obj = state.selected;
    if (!obj || !obj.type) return '<p class="empty">' + esc(t("noType")) + '</p>';
    return '<h3>' + esc(t("type")) + '</h3><pre style="color:var(--accent);font-size:14px">' + esc(obj.type) + '</pre>' +
           '<p class="empty" style="margin-top:10px;font-style:normal">' + esc(t("typeHint")) + '</p>';
  }

  function renderEnv(){
    var head = '<div class="panel-head"><h3>' + esc(t("env")) + ' · ' + state.envRows.length +
               '</h3><span class="hp">' +
               '<button class="mini" type="button" data-load="1">' + esc(t("loadB")) + '</button>' +
               '<button class="mini" type="button" data-reset="1">' + esc(t("reset")) + '</button>' +
               '</span></div>';
    if (!state.envRows.length) return head + '<p class="empty">' + esc(t("envEmpty")) + '</p>';
    var html = head;
    html += '<p class="empty" style="margin-bottom:8px;font-style:normal">' + esc(t("envHint")) + '</p>';
    state.envRows.forEach(function(r){
      html += '<div class="env-row">';
      html += '<div class="env-head"><span class="env-name" data-insert="' + esc(r.name) + '">' + esc(r.name) + '</span>';
      if (r.type) html += '<span class="env-ty">' + esc(r.type) + '</span>';
      html += '<button class="env-del" type="button" data-del="' + esc(r.name) + '">' + esc(t("del")) + '</button></div>';
      html += '<div class="env-val">' + esc(r.value) + '</div>';
      html += '</div>';
    });
    return html;
  }

  function renderGuide(){
    var rows = [
      {h: ["1 · 输入与执行", "1 · Type and run"],
       b: ["输入表达式后按 Enter。Tab 补全、↑↓ 历史、Ctrl+L 清空。",
           "Press Enter to run. Tab completes, ↑↓ history, Ctrl+L clears."]},
      {h: ["2 · 看懂结果", "2 · Read the result"],
       b: ["⇒ 是结果；「轨迹」看每一步前后差异，「结构」看语法树，「类型」看推断。",
           "⇒ marks a result. Trace shows each step, AST the tree, Type the inference."]},
      {h: ["3 · 手动归约", "3 · Step through"],
       b: ["写好表达式后点「开始」，用「单步」观察，或「到底」一次算完。",
           "Press Start, then Step through it or Run to finish."]},
      {h: ["4 · 定义与环境", "4 · Definitions"],
       b: ["用 id = \\x.x 定义；「环境」可插入、删除、加载 .lam、重置。",
           "Define with id = \\x.x; Env inserts, deletes, loads .lam and resets."]},
      {h: ["5 · 小贴士", "5 · Tips"],
       b: ["数字自动转 Church 编码；下方示例点击即可填入。",
           "Numbers become Church numerals; click an example to fill it in."]}
    ];
    var html = '<h3>' + esc(t("guideTitle")) + '</h3>';
    rows.forEach(function(r){
      html += '<div class="guide-step"><h4>' + bilingual(r.h[0], r.h[1]) + '</h4>' +
              '<p>' + bilingual(r.b[0], r.b[1]) + '</p></div>';
    });
    html += '<div class="guide-actions">' +
      '<button class="mini" data-guide="run" type="button">' + esc(dual("运行示例", "run example")) + '</button>' +
      '<button class="mini" data-guide="manual" type="button">' + esc(dual("手动归约示例", "step example")) + '</button>' +
      '<button class="mini" data-guide="start" type="button">' + esc(dual("开始使用", "start")) + '</button>' +
      '</div>';
    return html;
  }

  function renderHelp(){
    var cmds = [
      [":help", "显示帮助 / show help"],
      [":trace <expr>", "归约轨迹 / reduction trace"],
      [":ast <expr>", "语法树 / syntax tree"],
      [":db <expr>", "de Bruijn 索引 / de Bruijn indices"],
      [":type <expr>", "推断类型 / infer type"],
      [":strategy <s>", "applicative / normal / cbn / cbv"],
      [":steps <n>", "步数上限 / step limit"],
      [":begin <expr>", "开始手动归约 / start manual reduction"],
      [":step / :run / :end", "单步 / 到底 / 结束 / step / finish / end"],
      [":let name = expr", "定义 / define"],
      [":env / :del <n> / :reset", "环境 / environment"],
      [":lang zh|en|both", "语言 / language"],
      [":q", "退出 / quit"]
    ];
    var html = '<h3>' + esc(t("helpTitle")) + '</h3><dl class="help-dl">';
    cmds.forEach(function(c){
      html += '<dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + '</dd>';
    });
    html += '</dl><h3 style="margin-top:14px">' + esc(t("type")) + '</h3><p class="empty" style="font-style:normal">' + esc(t("helpBody")) + '</p>';
    return html;
  }

  function renderPanel(){
    var html = "";
    if (state.tab === "trace") html = renderTrace();
    else if (state.tab === "ast") html = renderAst();
    else if (state.tab === "type") html = renderType();
    else if (state.tab === "env") html = renderEnv();
    else if (state.tab === "guide") html = renderGuide();
    else html = renderHelp();
    panel.innerHTML = html;

    var range = panel.querySelector("#tr-range");
    if (range){
      range.addEventListener("input", function(){
        state.tracePos = parseInt(range.value, 10) || 0;
        var n = (state.selected && state.selected.trace) ? state.selected.trace.length : 1;
        range.style.setProperty("--p", (n > 1 ? state.tracePos / (n - 1) * 100 : 0) + "%");
        renderPanel();
      });
    }
    Array.prototype.forEach.call(panel.querySelectorAll("[data-nav]"), function(b){
      b.addEventListener("click", function(){
        var n = (state.selected && state.selected.trace) ? state.selected.trace.length : 0;
        if (!n) return;
        state.tracePos = Math.max(0, Math.min(n - 1, state.tracePos + (b.dataset.nav === "next" ? 1 : -1)));
        renderPanel();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-step]"), function(el){
      el.addEventListener("click", function(){
        state.tracePos = parseInt(el.dataset.step, 10) || 0;
        renderPanel();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-insert]"), function(el){
      el.addEventListener("click", function(){ insertText(el.dataset.insert); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function(el){
      el.addEventListener("click", function(){ execSilent(":del " + el.dataset.del).then(refreshEnv); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-load]"), function(el){
      el.addEventListener("click", async function(){
        var path = await dialog({title: t("loadB"), message: t("loadAsk"),
                                 input: true, ok: t("loadB")});
        if (!path) return;
        exec(":load " + path).then(refreshEnv);
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-guide]"), function(el){
      el.addEventListener("click", function(){
        var action = el.dataset.guide;
        if (action === "run"){
          exec("PLUS TWO THREE").then(function(){ switchTab("trace"); });
        } else if (action === "manual"){
          insertText("(\\x.x) ((\\y.y) z)");
          toast(dual("点终端下方的「开始」", "press Start below the terminal"));
        } else {
          switchTab("trace");
          cmd.focus();
        }
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-reset]"), function(el){
      el.addEventListener("click", async function(){
        var ok = await dialog({title: t("reset"), message: t("resetAsk"), ok: t("reset")});
        if (!ok) return;
        execSilent(":reset").then(function(){
          setManual(false);
          refreshEnv();
          saveLocal();
        });
      });
    });
  }

  /* ---------------------------------------------------------------- session */
  async function api(path, body, method){
    var res = await fetch(path, {
      method: method || "POST",
      headers: {"Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch(e){ data = {ok:false, error:"bad response"}; }
    return {status: res.status, data: data};
  }

  async function newSession(){
    var r = await api("api/session", {lang: state.lang});
    if (r.data && r.data.session){ state.session = r.data.session; setConn(true); }
    else { state.session = null; setConn(false); }
  }

  function setConn(ok){
    var el = $("st-conn");
    el.textContent = (ok ? "● " : "○ ") + t(ok ? "conn" : "dead");
    el.style.color = ok ? "var(--ok)" : "var(--err)";
  }

  async function evalLine(line, silent){
    if (!state.session) await newSession();
    var r = await api("api/eval", {session: state.session, line: line, lang: state.lang});
    if (r.status === 408 || (r.data && (r.data.timeout || r.data.restart))){
      state.session = null; setConn(false);
      if (!silent){
        addLine("warn", (r.data && r.data.error) || t("timeout"));
        await rebuild();
      }
      return [];
    }
    if (!r.data || !r.data.ok){
      if (!silent) addLine("fail", (r.data && r.data.error) || "request failed");
      if (r.status >= 500) { state.session = null; setConn(false); }
      return [];
    }
    if (r.data.session) state.session = r.data.session;
    return r.data.outputs || [];
  }

  // 会话失效后重建并静默回放已有输入
  // Rebuild a dead session and silently replay previous lines.
  async function rebuild(){
    await newSession();
    for (var i = 0; i < state.codeLines.length; i++){
      await evalLine(state.codeLines[i], true);
    }
  }

  async function execSilent(line){
    return evalLine(line, true);
  }

  async function refreshEnv(){
    var outs = await evalLine(":env", true);
    var env = outs.filter(function(o){ return o.kind === "env"; })[0];
    if (env){
      state.envRows = env.rows || [];
      if (state.tab === "env") renderPanel();
    }
    return env;
  }

  /* ------------------------------------------------------------------ exec */
  function setManual(on, term){
    state.manual = !!on;
    if (term != null) state.manualTerm = term;
    if (!on) state.manualTerm = "";
    $("m-begin").disabled = state.manual;
    $("m-step").disabled = !state.manual;
    $("m-run").disabled = !state.manual;
    $("m-end").disabled = !state.manual;
    $("m-term").textContent = state.manual ? state.manualTerm : "";
    $("m-term").title = state.manual ? state.manualTerm : "";
  }

  async function exec(line, opts){
    opts = opts || {};
    if (!opts.silent) echoPrompt(line);
    var trimmed = line.trim();
    if (!trimmed) { scrollDown(); return []; }

    if (trimmed === ":clear" || trimmed === "clear" || trimmed === ":cls"){
      clearAll(); return [];
    }

    if (opts.record !== false) state.codeLines.push(line);

    var outputs = await evalLine(line, opts.silent);
    outputs.forEach(function(o){ renderOutput(o, line, opts.silent); });

    if (/^:end\b/.test(trimmed)) setManual(false);
    if (/^:reset\b/.test(trimmed)){ setManual(false); if (!state.replaying) await refreshEnv(); }
    if (/^:del\b/.test(trimmed) || /^:load\b/.test(trimmed)){ if (!state.replaying) await refreshEnv(); }

    var stratMatch = trimmed.match(/^:strategy\s+(\S+)/);
    if (stratMatch && STRATEGY_LABELS[stratMatch[1]]){
      $("strategy").value = stratMatch[1];
      applyStaticTexts();
    }
    var stepsMatch = trimmed.match(/^:steps\s+(\d+)/);
    if (stepsMatch){
      state.limit = parseInt(stepsMatch[1], 10);
      $("st-limit").value = state.limit;
    }

    var last = outputs.filter(function(o){ return o.kind === "result" || o.kind === "warn"; }).pop();
    if (last){
      $("st-type").textContent = last.type || "—";
      if (last.trace && last.trace.length && !opts.silent){
        state.selected = last;
        state.tracePos = last.trace.length - 1;
        if (state.tab === "trace") renderPanel();
      }
    }
    if (!opts.silent) scrollDown();
    saveLocal();
    return outputs;
  }

  /* ------------------------------------------------------------------- ac */
  function tokenBeforeCursor(){
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos);
    var m = left.match(/(:[A-Za-z]+|[A-Za-z_][A-Za-z0-9_']*)$/);
    return m ? m[1] : "";
  }

  function candidates(token){
    var names = state.envRows.map(function(r){ return r.name; });
    var cmds = [":help",":trace",":ast",":db",":type",":strategy",":steps",":begin",":step",":run",":end",":let",":load",":env",":del",":reset",":lang",":clear",":q"];
    var pool = token.charAt(0) === ":" ? cmds : names;
    var lower = token.toLowerCase();
    var seen = {};
    return pool.filter(function(x){
      if (seen[x]) return false;
      seen[x] = 1;
      return x.toLowerCase().indexOf(lower) === 0;
    }).slice(0, 10);
  }

  function closeAc(){ ac.classList.remove("open"); state.acItems = []; state.acIndex = -1; }

  function openAc(){
    var token = tokenBeforeCursor();
    if (!token || token.length < 1) { closeAc(); return; }
    var items = candidates(token);
    if (!items.length || (items.length === 1 && items[0] === token)) { closeAc(); return; }
    state.acItems = items;
    state.acIndex = 0;
    ac.innerHTML = items.map(function(x, i){
      return '<div class="item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
             '<span>' + esc(x) + '</span><span class="hint"></span></div>';
    }).join("");
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el){
      el.addEventListener("mousedown", function(ev){ ev.preventDefault(); acceptAc(parseInt(el.dataset.i, 10)); });
    });
    ac.classList.add("open");
  }

  function acceptAc(i){
    if (i == null) i = state.acIndex;
    var token = tokenBeforeCursor();
    var pick = state.acItems[i];
    if (!pick) { closeAc(); return; }
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    cmd.value = left.slice(0, left.length - token.length) + pick + right;
    var newPos = pos - token.length + pick.length;
    cmd.setSelectionRange(newPos, newPos);
    closeAc();
    cmd.focus();
  }

  function insertText(text){
    var pos = cmd.selectionStart || cmd.value.length;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    var pad = left && !/\s$/.test(left) ? " " : "";
    cmd.value = left + pad + text + right;
    var p = (left + pad + text).length;
    cmd.setSelectionRange(p, p);
    cmd.focus();
  }

  /* ---------------------------------------------------------------- events */
  cmd.addEventListener("input", function(){
    cmd.style.height = "auto";
    cmd.style.height = Math.min(cmd.scrollHeight, 120) + "px";
    openAc();
  });

  cmd.addEventListener("keydown", function(e){
    if (ac.classList.contains("open")){
      if (e.key === "ArrowDown"){ e.preventDefault(); state.acIndex = (state.acIndex + 1) % state.acItems.length; paintAc(); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); state.acIndex = (state.acIndex - 1 + state.acItems.length) % state.acItems.length; paintAc(); return; }
      if (e.key === "Tab" || e.key === "Enter"){ e.preventDefault(); acceptAc(); return; }
      if (e.key === "Escape"){ closeAc(); return; }
    }
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      var v = cmd.value;
      cmd.value = "";
      cmd.style.height = "auto";
      if (v.trim()) state.history.push(v);
      state.hIdx = state.history.length;
      exec(v);
      return;
    }
    if (e.key === "ArrowUp" && !cmd.value.includes("\n")){
      if (state.history.length){ if (state.hIdx > 0) state.hIdx--; cmd.value = state.history[state.hIdx] || ""; e.preventDefault(); }
    } else if (e.key === "ArrowDown" && !cmd.value.includes("\n")){
      if (state.history.length){
        if (state.hIdx < state.history.length - 1){ state.hIdx++; cmd.value = state.history[state.hIdx]; }
        else { state.hIdx = state.history.length; cmd.value = ""; }
      }
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")){
      e.preventDefault(); clearAll();
    }
  });

  function paintAc(){
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el, i){
      el.classList.toggle("active", i === state.acIndex);
    });
  }

  async function startSession(){
    out.innerHTML = "";
    state.selected = null;
    state.envRows = [];
    state.replaying = true;
    setManual(false);
    try {
      await newSession();
      addLine("info", t("welcome"));
      for (var i = 0; i < state.codeLines.length; i++){
        await exec(state.codeLines[i], {record: false});
      }
      await evalLine(":lang " + state.lang, true);
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await refreshEnv();
    } finally {
      state.replaying = false;
    }
  }

  function clearAll(){
    out.innerHTML = "";
    state.codeLines = [];
    state.selected = null;
    state.envRows = [];
    state.session = null;
    setManual(false);
    newSession().then(function(){
      addLine("info", t("welcome"));
      renderPanel();
      saveLocal();
    });
    cmd.value = "";
    cmd.focus();
  }

  document.addEventListener("click", function(e){
    if (!ac.contains(e.target) && e.target !== cmd) closeAc();
  });

  selects = [initSelect("sel-lang"), initSelect("sel-strategy")];

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){ switchTab(b.dataset.tab); });
  });

  $("clear").addEventListener("click", clearAll);

  $("theme-toggle").addEventListener("click", function(){
    applyTheme(state.theme === "dark" ? "light" : "dark");
    saveLocal();
  });

  $("lang").addEventListener("change", async function(){
    state.lang = $("lang").value;
    applyStaticTexts();
    await startSession();
    renderPanel();
    saveLocal();
  });

  $("strategy").addEventListener("change", function(){
    execSilent(":strategy " + $("strategy").value).then(function(outs){
      outs.forEach(function(o){ if (o.kind === "info") addLine("info", o.text); });
      $("st-strategy").textContent = strategyText($("strategy").value);
      saveLocal();
    });
  });

  $("st-limit").addEventListener("change", function(){
    var v = parseInt(this.value, 10);
    if (!(v > 0)){ this.value = state.limit; return; }
    state.limit = v;
    execSilent(":steps " + v).then(function(outs){
      outs.forEach(function(o){
        if (o.kind === "info") addLine("info", o.text);
        else if (o.kind) addLine(o.kind, o.text || "");
      });
      saveLocal();
    });
  });

  // 手动归约 / manual reduction
  $("m-begin").addEventListener("click", async function(){
    var src = cmd.value.trim();
    if (!src){
      var rev = state.codeLines.slice().reverse();
      for (var i = 0; i < rev.length; i++){
        if (rev[i].trim() && rev[i].trim()[0] !== ":"){ src = rev[i].trim(); break; }
      }
    }
    if (!src){ toast(t("manualEmpty")); cmd.focus(); return; }
    cmd.value = ""; cmd.style.height = "auto";
    var outs = await exec(":begin " + src);
    if (outs && outs.some(function(o){ return o.kind === "term"; })) setManual(true, src);
  });
  $("m-step").addEventListener("click", function(){
    if (state.manual) exec(":step");
  });
  $("m-run").addEventListener("click", async function(){
    if (!state.manual) return;
    await exec(":run");
    setManual(false);
  });
  $("m-end").addEventListener("click", async function(){
    if (!state.manual) return;
    await exec(":end");
    setManual(false);
  });

  $("share").addEventListener("click", function(){
    var code = state.codeLines.join("\n");
    var enc = btoa(unescape(encodeURIComponent(code))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    var url = location.origin + location.pathname + "#code=" + enc;
    try { history.replaceState(null, "", "#code=" + enc); } catch(e){}
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ toast(t("copied")); }, function(){ toast(t("shareOk")); });
    else toast(t("shareOk"));
  });

  $("export").addEventListener("click", function(){
    var blob = new Blob([state.codeLines.join("\n") + "\n"], {type:"text/plain;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "lambda-session.lam";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  $("import").addEventListener("click", function(){ $("file").click(); });
  $("file").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = async function(){
      var lines = String(reader.result || "").split(/\r?\n/).filter(function(l){ return l.trim(); });
      for (var i = 0; i < lines.length; i++) await exec(lines[i]);
      toast(t("importOk") + " · " + lines.length);
      refreshEnv();
    };
    reader.readAsText(f, "utf-8");
    this.value = "";
  });

  /* --------------------------------------------------------------- examples */
  var EXAMPLES = [
    ["PLUS ONE TWO", "3"],
    ["MULT TWO THREE", "6"],
    ["IF TRUE ONE TWO", "1"],
    ["NOT FALSE", "TRUE"],
    ["AND TRUE FALSE", "FALSE"],
    ["SUCC THREE", "4"],
    ["(\\x.\\y.x) a b", "K"],
    ["(\\x.x x)(\\x.x)", "self-apply"],
    ["\\x.\\y.x y", "λ"],
    ["id = \\x.x", "define"],
    [":type \\f.\\x.f (f x)", "type"],
    [":trace (\\x.x) a", "trace"]
  ];

  function renderExamples(){
    var box = $("examples");
    box.innerHTML = "";
    EXAMPLES.forEach(function(ex){
      var b = elem("span", "chip");
      b.innerHTML = esc(ex[0]) + ' <span style="color:var(--faint)">· ' + esc(ex[1]) + '</span>';
      b.addEventListener("click", function(){ cmd.value = ex[0]; cmd.focus(); cmd.setSelectionRange(cmd.value.length, cmd.value.length); });
      box.appendChild(b);
    });
  }

  function loadPrelude(){
    fetch("api/prelude").then(function(r){ return r.json(); }).then(function(names){
      var box = $("chips");
      box.innerHTML = "";
      (names || []).forEach(function(n){
        var c = elem("span", "chip", esc(n));
        c.addEventListener("click", function(){ insertText(n); });
        box.appendChild(c);
      });
    }).catch(function(){});
  }

  function applyStaticTexts(){
    document.body.dataset.lang = state.lang;
    $("subline").textContent = t("subline");
    $("ex-title").textContent = t("exTitle");
    $("pre-title").textContent = t("preTitle");
    $("foot-hint").textContent = t("foot");
    $("clear").textContent = t("clear");
    $("share").textContent = t("share");
    $("export").textContent = t("exportB");
    $("import").textContent = t("importB");
    $("cmd").placeholder = t("placeholder");
    $("theme-toggle").textContent = state.theme === "dark" ? t("light") : t("dark");
    $("st-steps-label").textContent = t("steps");
    $("m-label").textContent = t("manual");
    $("m-begin").textContent = t("begin");
    $("m-step").textContent = t("stepB");
    $("m-run").textContent = t("runB");
    $("m-end").textContent = t("endB");
    Array.prototype.forEach.call($("strategy").options, function(o){
      if (STRATEGY_LABELS[o.value]) o.textContent = strategyText(o.value);
    });
    $("st-strategy").textContent = strategyText($("strategy").value);
    selects.forEach(function(s){ s.sync(); });
    renderExamples();
  }

  /* ------------------------------------------------------------------ boot */
  async function boot(){
    var saved = loadLocal();
    if (saved){
      state.lang = saved.lang || "both";
      state.theme = saved.theme || "light";
      state.limit = saved.limit || 10000;
      $("strategy").value = saved.strategy || "applicative";
      if (Array.isArray(saved.code)) state.codeLines = saved.code;
    }
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches && !saved){
      state.theme = "dark";
    }
    applyTheme(state.theme);
    $("lang").value = state.lang;
    $("st-strategy").textContent = $("strategy").value;
    $("st-limit").value = state.limit;
    applyStaticTexts();
    loadPrelude();

    // URL 分享链接优先
    var hash = location.hash.slice(1);
    if (hash.indexOf("code=") === 0){
      try {
        var b64 = hash.slice(5).replace(/-/g,"+").replace(/_/g,"/");
        while (b64.length % 4) b64 += "=";
        var text = decodeURIComponent(escape(atob(b64)));
        state.codeLines = text.split("\n").filter(function(l){ return l.trim(); });
      } catch(e){}
    }

    var stepsLine = state.codeLines.filter(function(l){ return /^:steps\s+\d+/.test(l.trim()); }).pop();
    if (stepsLine) state.limit = parseInt(stepsLine.trim().split(/\s+/)[1], 10) || state.limit;
    $("st-limit").value = state.limit;
    await startSession();
    renderPanel();
    if (!saved && !state.codeLines.length) switchTab("guide");
    cmd.focus();
  }

  boot();
})();
</script>
</body>
</html>
