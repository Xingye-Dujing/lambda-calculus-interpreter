  // 播放时只更新当前帧，不重建整个面板和最多 500 条的步列表
  // Update only the current frame while playing; never rebuild the whole panel.
  function updateTraceFrame(){
    var obj = state.selected;
    if (!obj || !obj.trace || !obj.trace.length) return;
    var steps = obj.trace;
    var i = Math.min(state.tracePos, steps.length - 1);
    var st = steps[i];
    var d = diffParts(st.before, st.after);
    var rows = panel.querySelectorAll(".cmp .row");
    if (rows.length >= 2){
      rows[0].innerHTML = '<span class="lab">' + esc(t("before")) + '</span>' +
        esc(d.pre) + (d.aMid ? '<del>' + esc(d.aMid) + '</del>' : '') + esc(d.suf);
      rows[1].innerHTML = '<span class="lab">' + esc(t("after")) + '</span>' +
        esc(d.pre) + (d.bMid ? '<ins>' + esc(d.bMid) + '</ins>' : '') + esc(d.suf);
    }
    var note = panel.querySelector(".note");
    if (note) note.textContent = st.note || ("β " + (i + 1));
    var count = panel.querySelector(".player .count");
    if (count) count.textContent = (i + 1) + " / " + steps.length;
    var range = panel.querySelector("#tr-range");
    if (range){
      range.value = i;
      var pct = steps.length > 1 ? (i / (steps.length - 1) * 100) : 0;
      range.style.setProperty("--p", pct + "%");
    }
    Array.prototype.forEach.call(panel.querySelectorAll(".steps-list .st"), function(b, k){
      if (b.classList) b.classList.toggle("active", k === i);
    });
  }

  function startPlay(){
    var total = (state.selected && state.selected.trace) ? state.selected.trace.length : 0;
    if (total < 1) return;
    if (state.tracePos >= total - 1) state.tracePos = 0;
    state.playing = true;
    state.playTimer = setInterval(function(){
      var n = (state.selected && state.selected.trace) ? state.selected.trace.length : 0;
      if (!n || state.tracePos >= n - 1){
        stopPlay();
        renderPanel();
        return;
      }
      state.tracePos += 1;
      updateTraceFrame();
    }, state.playMs);
    renderPanel();
  }

  function diffParts(a, b){
    a = String(a || ""); b = String(b || "");
    var p = 0;
    while (p < a.length && p < b.length && a[p] === b[p]) p++;
    var s = 0;
    while (s < a.length - p && s < b.length - p && a[a.length-1-s] === b[b.length-1-s]) s++;
    return { pre: a.slice(0, p), aMid: a.slice(p, a.length - s), bMid: b.slice(p, b.length - s), suf: a.slice(a.length - s) };
  }

  function astNodeHtml(n){
    if (!n) return "";
    var label = n.k === "var" ? n.label
              : n.k === "lam" ? "λ " + n.label
              : "App";
    var kids = n.c || [];
    if (!kids.length) {
      return '<div class="leaf"><span class="k">' + (n.k === "var" ? "• " : "") +
             '</span>' + esc(label) + '</div>';
    }
    return '<details open><summary>' + esc(label) + '</summary>' +
           kids.map(astNodeHtml).join("") + '</details>';
  }

  function astLayout(root){
    var leaves = 0, maxDepth = 0;
    function walk(n, depth, path){
      path = path || "";
      if (!n) return {x: 0, depth: depth, label: "", kids: [], path: path};
      if (depth > maxDepth) maxDepth = depth;
      var kids = (n.c || []).map(function(c, i){ return walk(c, depth + 1, path + (path ? "/" : "") + i); });
      var x;
      if (!kids.length) x = leaves++;
      else x = (kids[0].x + kids[kids.length - 1].x) / 2;
      var label = n.k === "var" ? n.label
                : n.k === "lam" ? "λ " + n.label
                : "App";
      return {x: x, depth: depth, label: label, kids: kids, path: path};
    }
    var r = walk(root, 0);
    return {root: r, leaves: Math.max(1, leaves), depth: maxDepth};
  }

  function astSvg(root){
    var layout = astLayout(root);
    var selected = state.selected || {};
    var redexes = selected.redexes || [];
    var byPath = {};
    redexes.forEach(function(r){
      var p = String(r.path || "");
      if (p === "root") p = "";
      byPath[p] = r.i;
    });
    var dx = 92, dy = 64, pad = 26;
    var width = Math.max(360, layout.leaves * dx + pad * 2);
    var height = (layout.depth + 1) * dy + pad * 2;
    var parts = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
                 width + ' ' + height + '" width="' + width + '" height="' + height + '">'];
    function draw(n){
      var cx = pad + n.x * dx, cy = pad + n.depth * dy;
      n.kids.forEach(function(k){
        var kx = pad + k.x * dx, ky = pad + k.depth * dy;
        parts.push('<line x1="' + cx + '" y1="' + (cy + 11) + '" x2="' + kx +
                   '" y2="' + (ky - 12) + '" class="ast-edge"/>');
      });
      var w = Math.max(34, Math.min(180, n.label.length * 9 + 18));
      var ri = byPath[n.path];
      var hot = (ri !== undefined) ? ' ast-redex" data-redex-node="' + esc(String(ri)) : '';
      parts.push('<rect x="' + (cx - w / 2) + '" y="' + (cy - 12) +
                 '" width="' + w + '" height="24" rx="3" class="ast-node-rect' + hot + '"/>');
      parts.push('<text x="' + cx + '" y="' + (cy + 5) +
                 '" text-anchor="middle" class="ast-node-text">' + esc(n.label) + '</text>');
      n.kids.forEach(draw);
    }
    draw(layout.root);
    parts.push('</svg>');
    return '<div class="ast-svg">' + parts.join("") + '</div>';
  }

  async function runTool(tool){
    var ask = function(title, message){
      return dialog({title: title, message: message, input: true, ok: t("ok")});
    };
    if (tool === "shortest"){
      var sa = await ask(":shortest", dual("起始表达式", "source expression"));
      if (!sa) return;
      var sb = await ask(":shortest", dual("目标表达式", "target expression"));
      if (!sb) return;
      exec(":shortest " + sa + " , " + sb);
    } else if (tool === "growth"){
      var ge = await ask(":growth", dual("表达式", "expression"));
      if (ge) exec(":growth " + ge);
    } else if (tool === "gallery"){
      var gr = await api("api/gallery", {}, "GET");
      var examples = (gr.data && gr.data.examples) || [];
      var items = examples.map(function(ex){
        return {value: ex.code, label: state.lang === "zh" ? ex.zh
                  : state.lang === "en" ? ex.en : ex.zh + " / " + ex.en,
                hint: ex.code};
      });
      var pick = await dialog({title: t("gallery"), message: dual("选择一个示例", "choose an example"),
                               input: true, list: items, ok: t("runB")});
      if (pick) exec(pick);
    } else if (tool === "par"){
      var pe2 = await ask(":par", dual("表达式", "expression"));
      if (pe2) exec(":par " + pe2);
    } else if (tool === "ftype"){
      var fe = await ask(":ftype", dual("System F 项，如 Λa. \\x : a. x",
                                    "System F term, e.g. Λa. \\x : a. x"));
      if (fe) exec(":ftype " + fe);
    } else if (tool === "machine"){
      var me = await ask(":machine", dual("表达式（带轨迹的环境抽象机）",
                                      "expression (traced environment machine)"));
      if (me) exec(":machine " + me);
    } else if (tool === "stats"){
      var se = await ask(":stats", dual("表达式", "expression"));
      if (se) exec(":stats " + se);
    } else if (tool === "race"){
      var re = await ask("策略竞速", dual("表达式（四种策略同时归约）",
                                     "expression (reduce under all four strategies)"));
      if (!re) return;
      var rr = await api("api/race", {session: state.session, line: re,
                                      lang: state.lang, strategy: $("strategy").value});
      if (rr.status === 408 || (rr.data && (rr.data.restart || rr.data.timeout))){
        state.expiredSession = state.session;
        state.session = null; setConn(false);
        addLine("warn", (rr.data && rr.data.error) || t("timeout"));
        await rebuild();
        return;
      }
      if (!rr.data || !rr.data.ok){
        addLine("fail", (rr.data && rr.data.error) || dual("策略竞速失败", "strategy race failed"));
        return;
      }
      state.session = rr.data.session;
      state.raceResults = rr.data.results || {};
      setConn(true);
      switchTab("race");
    } else if (tool === "eq" || tool === "conv" || tool === "prove"){
      var a = await ask(":" + tool, dual("表达式 1", "expression 1"));
      if (!a) return;
      var b = await ask(":" + tool, dual("表达式 2", "expression 2"));
      if (!b) return;
      exec(":" + tool + " " + a + " , " + b);
    } else if (tool === "nf" || tool === "whnf" || tool === "int"){
      var e = await ask(":" + tool, dual("表达式", "expression"));
      if (e) exec(":" + tool + " " + e);
    } else if (tool === "church"){
      var n = await ask(":church", dual("0-9999 的整数", "an integer 0-9999"));
      if (n) exec(":church " + n);
    } else if (tool === "eta"){
      state.eta = !state.eta;
      exec(":eta " + (state.eta ? "on" : "off"));
      renderPanel();
    } else if (tool === "fast"){
      toggleFast();
      renderPanel();
    } else if (tool === "rec"){
      var name = await ask("rec", dual("名字", "name"));
      if (!name) return;
      var body = await ask("rec", dual("表达式（可引用名字本身）", "expression (may refer to itself)"));
      if (!body) return;
      exec("rec " + name + " = " + body);
    } else if (tool === "save"){
      var path = await ask(":save", dual(".lam 路径", "path to a .lam file"));
      if (path) exec(":save " + path);
    } else if (tool === "time"){
      var te = await ask(":time", t("askExpr"));
      if (te) exec(":time " + te);
    } else if (tool === "bench"){
      var bn = await ask(":bench", t("askCount"));
      if (!bn) return;
      var be = await ask(":bench", t("askExpr"));
      if (be) exec(":bench " + bn + " " + be);
    } else if (tool === "helpcmd"){
      var hc = await ask(":help", t("askCmdName"));
      if (hc) exec(":help " + hc);
    }
  }

  function renderGrowth(){
    var g = state.growth;
    if (!g) return '<p class="empty">' + esc(dual(
      "在工具标签运行 :growth，这里会画出项规模随步数变化的曲线。",
      "Run :growth from Tools to plot term size against reduction steps.")) + '</p>';
    var html = '<h3>' + esc(t("growth")) + '</h3>' +
      '<p class="empty" style="font-style:normal">' +
      esc(dual("应用序与正规序对照，纵轴为节点数。",
               "Applicative vs normal order; the vertical axis is node count.")) + '</p>';
    var series = [["applicative", "--del"], ["normal", "--accent"]];
    var all = [], maxY = 1, maxX = 1;
    series.forEach(function(pair){
      (g[pair[0]] || []).forEach(function(pt){
        all.push({x: pt.n, y: pt.after || 0, c: pair[1]});
        maxY = Math.max(maxY, pt.after || 0); maxX = Math.max(maxX, pt.n);
      });
    });
    var W = 420, H = 200, pad = 30;
    function xy(p){ return [pad + (p.x / maxX) * (W - pad * 2),
                            H - pad - (p.y / maxY) * (H - pad * 2)]; }
    html += '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
    series.forEach(function(pair){
      var pts = all.filter(function(p){ return p.c === pair[1]; }).map(xy);
      if (pts.length > 1){
        html += '<polyline fill="none" stroke="var(' + pair[1] + ')" stroke-width="2" points="' +
                pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') +
                '"/>';
      }
    });
    html += '<text x="' + pad + '" y="16" font-size="10" fill="var(--dim)">' + maxY + '</text>' +
            '<text x="' + (W - pad) + '" y="' + (H - 8) + '" font-size="10" fill="var(--dim)">' +
            maxX + '</text></svg>';
    html += '<div class="sess-meta">' + esc(dual(
      "应用序 " + (g.applicativeSteps || 0) + " 步 / 峰值 " + (g.applicativePeak || 0) +
      "，正规序 " + (g.normalSteps || 0) + " 步 / 峰值 " + (g.normalPeak || 0),

      ", normal " + (g.normalSteps || 0) + " steps / peak " + (g.normalPeak || 0))) + '</div>';
    return html;
  }

  async function runCompareSide(side){
    var input = $(side === "left" ? "cmp-left" : "cmp-right");
    if (!input) return;
    state.compare[side] = input.value.trim();
    if (!state.compare[side]) return;
    var sidKey = side + "Session";
    if (!state.compare[sidKey]){
      var ns = await api("api/session", {lang: state.lang});
      if (!ns.data || !ns.data.session){ addLine("fail", dual("无法创建对比会话", "cannot create compare session")); return; }
      state.compare[sidKey] = ns.data.session;
    }
    var ev = await api("api/eval", {session: state.compare[sidKey],
                                    line: state.compare[side], lang: state.lang});
    // 对比会话在后端失效后返回 410：清掉旧 id 并提示，避免静默显示过期结果
    // A dead compare session returns 410: drop the stale id instead of silently
    // rendering the cached term from a session that no longer exists.
    if (ev.status === 410 || (ev.data && ev.data.restart)){
      state.compare[sidKey] = null;
      state.compare[side + "Term"] = "";
      addLine("fail", dual("对比会话已过期，请重新运行", "compare session expired; run again"));
      renderPanel();
      return;
    }
    var objs = ev.data && ev.data.outputs;
    var o = objs && objs[0];
    if (o) state.compare[side + "Term"] = o.term || o.text || "";
    renderPanel();
  }

  async function checkExercise(i){
    var ex = EXERCISES[i];
    var input = $("ex-input-" + i);
    var line = input ? input.value.trim() : "";
    if (!line) return;
    await ensureSession();
    var r = await api("api/eval", {session: state.session, lang: state.lang,
                                   line: ":conv " + line + " , " + ex.target});
    var res = $("ex-result-" + i);
    if (r.status === 408 || (r.data && (r.data.restart || r.data.timeout))){
      state.expiredSession = state.session;
      state.session = null; setConn(false);
      await rebuild();
      return;
    }
    var obj = r.data && r.data.outputs && r.data.outputs[0];
    var ok = !!(obj && obj.equal === true);
    if (res){
      if (r.status === 0){
        // 连接失败不是“答错”，提示网络问题 / A connectivity failure is not a wrong answer
        res.textContent = dual("无法连接解释器，请检查 web/app.py 是否运行",
                               "Cannot reach the interpreter; check that web/app.py is running");
        res.className = "ex-result no";
      } else {
        res.textContent = ok ? t("correct") : t("wrong");
        res.className = "ex-result " + (ok ? "ok" : "no");
      }
    }
    if (ok){
      state.exerciseDone[i] = true;
      saveLocal();
    }
  }

    // 重绘前记录焦点与滚动，重绘后恢复 / capture focus and scroll before repaint
    var keepScroll = panel.scrollTop || 0;
    var keepFocus = null;
    try {
      var ae = document.activeElement;
      if (ae && panel.contains && panel.contains(ae)) keepFocus = focusKeyOf(ae);
    } catch(e){}
    var html = "";
    if (state.tab === "trace"){
      html = (state.selected && state.selected.leftTrace) ? renderProof() : renderTrace();
    }
    else if (state.tab === "race") html = renderRace();
    else if (state.tab === "ast") html = renderAst();
    else if (state.tab === "type") html = renderType();
    else if (state.tab === "env") html = renderEnv();
    else if (state.tab === "growth") html = renderGrowth();
    else if (state.tab === "notebook") html = renderNotebook();
    else if (state.tab === "compare") html = renderCompare();
    else if (state.tab === "exercises") html = renderExercises();
    else if (state.tab === "sessions") html = renderSessions();
    else if (state.tab === "tools") html = renderTools();
    else if (state.tab === "guide") html = renderGuide();
    else html = renderHelp();
    panel.innerHTML = html;
    if (panel.scrollTop != null) panel.scrollTop = keepScroll;
    if (keepFocus && panel.querySelector){
      var nf = panel.querySelector(keepFocus);
      if (nf && nf.focus) nf.focus();
    }

    var range = panel.querySelector("#tr-range");
    if (range){
      range.addEventListener("input", function(){
        stopPlay();
        state.tracePos = parseInt(range.value, 10) || 0;
        var n = (state.selected && state.selected.trace) ? state.selected.trace.length : 1;
        range.style.setProperty("--p", (n > 1 ? state.tracePos / (n - 1) * 100 : 0) + "%");
        // 只刷新当前帧，不能重建面板：否则正在拖动的滑块会被 innerHTML 销毁
        // Update only the current frame; a full re-render would destroy the
        // range input being dragged.
        updateTraceFrame();
      });
    }
    var playBtn = panel.querySelector("[data-play]");
    if (playBtn){
      playBtn.addEventListener("click", function(){
        if (state.playing){ stopPlay(); renderPanel(); }
        else startPlay();
      });
    }
    Array.prototype.forEach.call(panel.querySelectorAll("[data-nav]"), function(b){
      b.addEventListener("click", function(){
        stopPlay();
        var n = (state.selected && state.selected.trace) ? state.selected.trace.length : 0;
        if (!n) return;
        state.tracePos = Math.max(0, Math.min(n - 1, state.tracePos + (b.dataset.nav === "next" ? 1 : -1)));
        renderPanel();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-step]"), function(el){
      el.addEventListener("click", function(){
        stopPlay();
        state.tracePos = parseInt(el.dataset.step, 10) || 0;
        renderPanel();
      });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-insert]"), function(el){
      el.addEventListener("click", function(){ insertText(el.dataset.insert); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-del]"), function(el){
      el.addEventListener("click", function(){ exec(":del " + el.dataset.del).then(refreshEnv); });
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-load]"), function(el){
      el.addEventListener("click", async function(){

    Array.prototype.forEach.call(panel.querySelectorAll("[data-astview]"), function(el){

    Array.prototype.forEach.call(panel.querySelectorAll("[data-tool]"), function(el){

    Array.prototype.forEach.call(panel.querySelectorAll("[data-proof-export]"), function(el){
      el.addEventListener("click", function(){

    var cmpRun = function(kind){

      state.compare.left = l.value.trim(); state.compare.right = r.value.trim();
      var a = state.compare.leftTerm || state.compare.left;

    var cmpConv = panel.querySelector("[data-cmp-conv]");

    var sessRefresh = panel.querySelector("[data-sess-refresh]");
    if (sessRefresh) sessRefresh.addEventListener("click", function(){ refreshSessions(); });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-sess-restore]"), function(el){
      el.addEventListener("click", async function(){
        var r = await api("api/session/" + encodeURIComponent(el.dataset.sessRestore) + "/restore",
                          {lang: state.lang});
        if (r.status === 200 && r.data && r.data.ok){
          // 取消旧会话并中止进行中的请求，避免旧解释器泄漏
          // Cancel the old session and abort in-flight requests so no interpreter leaks.
          var oldSid = state.session;
          if (oldSid){
            try { await api("api/session/" + oldSid + "/cancel", {}); } catch(e){}
          }
          inflight.slice().forEach(function(c){
            try { if (c && typeof c.abort === "function") c.abort(); } catch(e){}
          });
          inflight.length = 0; activeController = null; setCancelActive(false);
          // 清空回放区并重置界面状态，与 rebuild() 保持一致
          // Clear the transcript and reset UI state, in line with rebuild().
          state.gen++;
          out.innerHTML = "";
          state.selected = null;
          state.envRows = [];
          // 清除上一个会话残留的检查器数据，避免状态栏/竞速/曲线面板显示旧内容
          // Drop inspector data from the old session so the status bar, Race and
          // Growth panels do not keep showing stale results.
          state.lastType = null;
          state.raceResults = null;
          state.growth = null;
          state.expiredSession = null;
          state.tracePos = 0;
          setManual(false);
          state.session = r.data.session;
          state.codeLines = Array.isArray(r.data.code) ? r.data.code.slice() : [];
          setConn(true);
          // 后端按快照保存的语言恢复，这里用界面当前语言重新声明
          // The backend restores with the snapshot's saved language; re-assert the UI language.
          state.replaying = true;
          try {
            await evalLine(":lang " + state.lang, true);
            await refreshEnv();
          } finally { state.replaying = false; }
          saveLocal();
          renderPanel();
          toast(dual("会话已恢复", "session restored"));
          switchTab("trace");
        } else addLine("fail", (r.data && r.data.error) || dual("恢复失败", "restore failed"));

  /* ---------------------------------------------------------------- session / 会话 */
  // 会话所有权令牌：本地生成、持久保存，随请求发送，防止别人的快照被列举/删除
  // Session owner token: generated and persisted locally, sent with requests so
  // other users' snapshots cannot be enumerated or deleted.
  function ownerToken(){
    var key = "lambda-owner";
    var t = null;
    try { t = localStorage.getItem(key); } catch(e){}
    if (!t){
      var bytes = new Uint8Array(16);
      if (typeof crypto !== "undefined" && crypto.getRandomValues) crypto.getRandomValues(bytes);
      else for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
      t = Array.prototype.map.call(bytes, function(b){
        return ("0" + b.toString(16)).slice(-2);
      }).join("");
      try { localStorage.setItem(key, t); } catch(e){}
    }
    return t;
  }

  // 网络错误不能变成未处理的 Promise 拒绝：统一返回 status 0 与错误对象
  // A network error must not become an unhandled rejection: return status 0.
  async function api(path, body, method, signal){
    try {
      var verb = method || "POST";
      var payload = body;
      if (verb === "GET"){
        path += (path.indexOf("?") < 0 ? "?" : "&") + "owner=" + encodeURIComponent(ownerToken());
      } else {
        if (!payload || typeof payload !== "object" || Array.isArray(payload)) payload = {};
        payload = Object.assign({}, payload, {owner: ownerToken()});
      }
      var opts = {
        method: verb,
        headers: {"Content-Type": "application/json"},
        body: verb === "GET" ? undefined : JSON.stringify(payload)
      };
      // 仅在有 AbortController 时附带 signal，桩环境不会碰到它
      // Attach a signal only when AbortController exists; the stub never sees it.
      if (signal && typeof AbortController !== "undefined") opts.signal = signal;
      var res = await fetch(path, opts);
      var data = null;
      try { data = await res.json(); } catch(e){ data = {ok:false, error:"bad response"}; }
      return {status: res.status, data: data};
    } catch (e) {
      return {status: 0, data: {ok:false, error: (e && e.message) || "network error"}};
    }
  }

  // 并发调用共享同一个进行中的 Promise：清空界面后立即提交命令时，
  // evalLine 不会再创建第二个后端会话 / Concurrent callers share one in-flight
  // promise so a command submitted right after clear cannot orphan a second session.
  var pendingSession = null;
  async function newSession(){
    if (pendingSession) return pendingSession;
    var p = (async function(){
      var r = await api("api/session", {lang: state.lang});
      if (r.data && r.data.session){ state.session = r.data.session; setConn(true); }
      else {
        state.session = null; setConn(false);
        // 会话创建失败时给出提示，不能只让界面显示“未连接”
        // Report a failed session; the connection badge alone is not enough.
        if (r.data && r.data.error) addLine("fail", String(r.data.error));
      }
    })();
    pendingSession = p;
    try { return await p; }
    finally { if (pendingSession === p) pendingSession = null; }
  }

  // 辅助接口（判题、对比）也必须确保有会话，不能让后端隐式创建后丢弃 session id
  // Helper routes must ensure a session exists; otherwise the backend creates one
  // whose id is dropped, leaking an interpreter subprocess on every call.
  async function ensureSession(){
    if (!state.session) await newSession();
    return state.session;
  }

  function setConn(ok){
    var el = $("st-conn");
    el.textContent = (ok ? "● " : "○ ") + t(ok ? "conn" : "dead");
    el.style.color = ok ? "var(--ok)" : "var(--err)";
  }

  // 流式求值可用时优先使用，长归约期间显示心跳而不再被 10 秒超时杀掉
  // Prefer streaming when available; heartbeats keep long reductions alive.
  function canStream(){
    return typeof TextDecoder !== "undefined" && typeof ReadableStream !== "undefined";
  }

  function showRunning(ms){
    var el = $("st-conn");
    if (!el) return;
    var s = Math.max(0, Math.round((ms || 0) / 1000));
    el.textContent = "● " + t("running") + (s ? " " + s + "s" : "");
    el.style.color = "var(--ok)";
  }

  // 只有后端的流级失败才算失败；解释器自己的 error 输出只是普通命令结果
  // Only the backend's stream-level failures count: an interpreter error
  // object (kind "error" with text and a code) is a normal command output and
  // must be rendered, not turned into a failed request.
  function isStreamFailure(obj){
    if (!obj) return false;
    if (obj.kind === "timeout" || obj.kind === "expired") return true;
    return obj.kind === "error" && obj.ok === false;
  }

  async function streamEval(line, signal, streamState){
    var opts = {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session: state.session, line: line, lang: state.lang})
    };
    if (signal && typeof AbortController !== "undefined") opts.signal = signal;
    var res = await fetch("api/eval/stream", opts);
    if (!res.ok){
      // 后端直接拒绝（限流/坏请求）时保留错误体，不能再回退到 /api/eval，
      // 否则同一条命令可能被执行两次且真实原因被吞掉
      // Surface a rejected stream directly; falling back would re-run the line.
      var body = null;
      try { body = await res.json(); } catch(e){}
      return {status: res.status, data: body || {ok: false,
        error: "stream failed", code: "internal_error"}};
    }
    // 代理有时会把 SSE 转成普通 JSON：直接采纳，不能再回退到 /api/eval 重发命令
    // A proxy may convert SSE into a plain JSON body: use it directly instead of
    // falling back to /api/eval (which would execute the line twice).
    var ctype = (res.headers && res.headers.get && res.headers.get("content-type")) || "";
    if (ctype && ctype.indexOf("text/event-stream") < 0){
      var direct = null;
      try { direct = await res.json(); } catch(e){}
      if (direct && Array.isArray(direct.outputs)) return {status: res.status, data: direct};
      return {status: res.status, data: direct || {ok: false,
        error: "unexpected stream response", code: "internal_error"}};
    }
    if (!res.body || typeof res.body.getReader !== "function") return null;
    var reader = res.body.getReader(), dec = new TextDecoder();
    // 后端已收到并可能已开始执行这一行；此后若传输中断，不能再通过 /api/eval 重发
    // The backend already received (and may be running) the line; a later transport
    // failure must not re-send it through /api/eval.
    if (streamState) streamState.started = true;
    var buf = "", outputs = [], session = null, failure = null;
    var consume = function(){
      var idx;
      while ((idx = buf.indexOf("\n\n")) >= 0){
        var frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (frame.slice(0, 6) !== "data: ") continue;
        var obj = null;
        try { obj = JSON.parse(frame.slice(6)); } catch(e){ continue; }
        if (!obj) continue;
        if (obj.kind === "start" || obj.kind === "done"){
          if (obj.session) session = obj.session;
        } else if (obj.kind === "heartbeat"){
          showRunning(obj.elapsedMs);
        } else if (isStreamFailure(obj)){
          failure = obj;
        } else {
          outputs.push(obj);
        }
      }
    };
    while (true){
      var part = await reader.read();
      if (part.done) break;
      buf += dec.decode(part.value, {stream: true});
      consume();
    }
    // 冲刷解码器，避免流末尾被拆分的多字节字符丢失
    // Flush the decoder so a multi-byte character split at the very end is kept.
    buf += dec.decode();
    consume();
    if (failure){
      var status = failure.timeout ? 408 : (failure.restart ? 410 : 500);
      return {status: status, data: failure};
    }
    return {status: 200, data: {ok: true, session: session, outputs: outputs}};
  }

  async function evalLine(line, silent, recorded){
    var gen = state.gen;
    // 取消时要把 exec() 刚压入回放历史的那一行撤掉，否则 rebuild() 会重跑它
    // 只撤掉有记录来源的行，避免误删后台静默调用（如 :env）复用的历史条目
    // On cancel, drop the line exec() just recorded so rebuild() will not replay it.
    // Only drop lines that were actually recorded, so silent callers cannot remove
    // a legitimate older history entry that happens to have the same text.
    function dropRecorded(){
      if (!recorded) return;
      var dead = state.codeLines.lastIndexOf(line);
      if (dead >= 0){ state.codeLines.splice(dead, 1); saveLocal(); }
    }
    if (!state.session) await newSession();
    var controller = null;
    // 特性检测：桩环境没有 AbortController / feature check: the stub has no AbortController
    if (typeof AbortController !== "undefined"){
      controller = new AbortController();
      trackRequest(controller);
    }
    var streamState = {started: false};
    var r = null;
    try {
      if (canStream()){
        try {
          r = await streamEval(line, controller ? controller.signal : undefined, streamState);
        } catch(e){
          if (controller && controller.signal && controller.signal.aborted){ dropRecorded(); return []; }
          if (streamState.started){
            // 流已开始，后端可能已执行这一行；再用 /api/eval 重发会重复定义和历史
            // Streaming began: the backend may have run the line. Re-sending through
            // /api/eval would duplicate definitions/history, so expire the session and
            // rebuild/replay from history instead of re-sending the same line.
            if (!silent) addLine("warn", dual("连接中断，正在重建会话", "Connection lost; rebuilding session"));
            state.expiredSession = state.session;
            state.session = null; setConn(false);
            if (!state.replaying) await rebuild();
            return [];
          }
          r = null;
        }
      }
      if (!r){
        r = await api("api/eval", {session: state.session, line: line, lang: state.lang},
                      null, controller ? controller.signal : undefined);
      }
    } finally {
      untrackRequest(controller);
    }
    // 被取消的请求不再渲染错误，并撤掉刚记录的回放行
    // A cancelled request renders nothing and drops the just-recorded replay line.
    if (controller && controller.signal && controller.signal.aborted){ dropRecorded(); return []; }
    // 清空/重建后，旧请求的结果不能再改动会话或界面
    // After a clear/rebuild, a stale response must not touch session or UI.
    if (state.gen !== gen) return [];
    if (r.status === 408 || (r.data && (r.data.timeout || r.data.restart))){
      // 超时/过期的命令不能留在回放历史里，否则每次重建都重跑并切碎会话
      // A timed-out line must not stay in the replay history and re-thrash sessions.
      var dead = state.codeLines.lastIndexOf(line);
      if (dead >= 0){ state.codeLines.splice(dead, 1); saveLocal(); }
      // 记下失效的会话 id，重建时优先尝试服务端快照恢复
      // Remember the dead session id so rebuild can try a server-side snapshot first.
      state.expiredSession = state.session;
      state.session = null; setConn(false);
      if (!silent){
        addLine("warn", (r.data && r.data.error) || t("timeout"));
      }
      // 静默调用（刷新环境、回放等）也必须重建，否则会丢失会话和此前的定义；
      // 回放期间用 state.replaying 防止递归重建
      // Silent callers must rebuild too, or the session and earlier definitions are
      // lost; the guard prevents recursive rebuilds while replaying.
      if (!state.replaying) await rebuild();
      return [];
    }
    if (!r.data || !r.data.ok){
      if (!silent){
        var failEl = addLine("fail", (r.data && r.data.error) || dual(
          "请求失败，请检查 web/app.py 是否运行。", "Request failed; check that web/app.py is running."));
        if (r.status === 0){
          // 网络错误给出可点击的重试，不再只显示一句失败
          // Offer a retry button instead of a bare failure message.
          var retry = elem("button", "act");
          retry.textContent = dual("重试", "retry");
          retry.style.opacity = "1";
          // 原命令已在回放历史里，重试不能重复记录
          // The original line is already in replay history; do not record it twice.
          retry.addEventListener("click", function(){ exec(line, {record: false}); });
          failEl.querySelector(".line-main").appendChild(retry);
        }
      }
      if (r.status === 0) setConn(false);
      else if (r.status >= 500) { state.session = null; setConn(false); }
      return [];
    }
    if (r.data.session) state.session = r.data.session;
    setConn(true);
    return r.data.outputs || [];
  }

  // 会话失效后重建并静默回放已有输入
  // Rebuild a dead session and silently replay previous lines.
  async function rebuild(){
    var old = state.expiredSession;
    state.expiredSession = null;
    if (old){
      var rr = await api("api/session/" + encodeURIComponent(old) + "/restore",
                         {lang: state.lang});
      if (rr.status === 200 && rr.data && rr.data.ok){
        state.session = rr.data.session;
        state.codeLines = Array.isArray(rr.data.code) ? rr.data.code.slice() : [];
        saveLocal();
        setConn(true);
        state.replaying = true;
        try { await evalLine(":lang " + state.lang, true); }
        finally { state.replaying = false; }
        return;
      }
    }
    await newSession();
    state.replaying = true;
    try {
      await evalLine(":lang " + state.lang, true);
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await evalLine(":eta " + (state.eta ? "on" : "off"), true);
      await evalLine(":fast " + (state.fast ? "on" : "off"), true);
      await evalLine(":encoding " + state.encoding, true);
      // 历史里的 :lang 会覆盖下拉框当前选择，回放时跳过并在结束后重新声明
      // Stale :lang lines in history would override the dropdown choice; skip
      // them and re-assert the UI language after replay.
      var lines = state.codeLines.filter(function(l){ return !/^\s*:lang\b/i.test(l); });
      for (var i = 0; i < lines.length; i++){
        await evalLine(lines[i], true);
      }
      await evalLine(":lang " + state.lang, true);
    } finally {
      state.replaying = false;
      setCancelActive(false);
    }
  }

  // 取消求值：中断 fetch、通知后端、再走已有的会话重建与历史回放
  // Cancel evaluation: abort the fetch, notify the backend, then rebuild and replay.
  async function cancelEval(){
    // 重建/回放期间忽略取消，避免连环重建出多个会话
    // Ignore cancel while rebuilding/replaying to avoid cascading sessions.
    if (state.replaying) return;
    // 递增代数：即便某个并行请求没有被 abort，它的旧结果也不能再渲染
    // Bump the generation so a parallel request that was not aborted cannot render.
    state.gen++;
    // 并行请求全部中止，不能只取消最近的一个
    // Abort every in-flight request, not only the most recent one.
    inflight.slice().forEach(function(c){
      if (c && typeof c.abort === "function"){
        try { c.abort(); } catch(e){}
      }
    });
    inflight.length = 0;
    activeController = null;
    setCancelActive(false);
    var sid = state.session;
    if (sid){
      try { await api("api/session/" + sid + "/cancel", {}); } catch(e){}
    }
    state.session = null;
    setConn(false);
    await rebuild();
    addLine("info", t("cancelled"));
  }

  async function execSilent(line){
    return evalLine(line, true);
  }

  async function refreshEnv(){
    var outs = await evalLine(":env", true);
    var env = outs.filter(function(o){ return o.kind === "env"; })[0];
    if (env){
      state.envRows = env.rows || [];
      if (state.tab === "env") renderPanel();
    }
    return env;
  }

  /* ------------------------------------------------------------------ exec / 执行 */
  function setManual(on, term){
    state.manual = !!on;
    if (term != null) state.manualTerm = term;
    if (!on) state.manualTerm = "";
    $("m-begin").disabled = state.manual;
    $("m-back").disabled = !state.manual;
    $("m-forward").disabled = true;  // 只有 :back 之后才有可重做的步骤 / redo exists only after :back
    $("m-start").disabled = !state.manual;
    $("m-step").disabled = !state.manual;
    $("m-run").disabled = !state.manual;
    $("m-end").disabled = !state.manual;
    $("m-term").textContent = state.manual ? state.manualTerm : "";
    $("m-term").title = state.manual ? state.manualTerm : "";
    if (!state.manual) state.redexes = [];
    renderRedexes();
  }

  async function exec(line, opts){
    opts = opts || {};
    var gen = state.gen;
    if (!opts.silent) echoPrompt(line);
    var tline = line.trim();
    if (!opts.silent && /^:/.test(tline) && CMD_NAMES().indexOf(baseOf(tline)) < 0){
      var near = fuzzyCommands(baseOf(tline), 1);
      if (near.length) toast(t("fuzzyTip") + " " + near[0] + "?");
    }
    var trimmed = line.trim();
    if (!trimmed) { scrollDown(); return []; }

    if (trimmed === ":clear" || trimmed === "clear" || trimmed === ":cls"){
      clearAll(); return [];
    }
    if (trimmed === ":q" || trimmed === ":quit"){
      addLine("info", dual("Web 会话不会退出；用“清空”重建会话。",
                           "The web session does not quit; use clear to reset it."));
      return [];
    }
    if (/^:edit\b/.test(trimmed)){
      addLine("info", dual("网页端不能启动服务器上的编辑器；请使用命令行 :edit。",
                           "The web app cannot launch a server-side editor; use :edit in the CLI."));
      return [];
    }

    if (opts.record !== false) state.codeLines.push(line);

    var outputs = await evalLine(line, opts.silent, opts.record !== false);
    // 期间清空了界面：丢弃这条命令的后续渲染与状态更新
    // If the UI was cleared meanwhile, drop this command's rendering/updates.
    if (state.gen !== gen) return [];
    outputs.forEach(function(o){ renderOutput(o, line, opts.silent); });

    if (/^:end\b/.test(trimmed)) setManual(false);
    if (/^:run\b/.test(trimmed)) setManual(false);
    if (/^:reset\b/.test(trimmed)) setManual(false);
    // 定义、删除、重置与 :load 之后只刷新一次环境，避免逐条定义重复请求
    // Refresh the environment once after definitions/deletes/load, not per definition.
    var needsEnv = outputs.some(function(o){ return o.kind === "define"; }) ||
                   /^:(reset|del|load)\b/.test(trimmed);
    if (needsEnv && !state.replaying) await refreshEnv();

    var stratMatch = trimmed.match(/^:strategy\s+(\S+)/);
    if (stratMatch && STRATEGY_LABELS[stratMatch[1]]){
      $("strategy").value = stratMatch[1];
      applyStaticTexts();
    }
    var stepsMatch = trimmed.match(/^:steps\s+(\d+)/);
    if (stepsMatch){
      state.limit = parseInt(stepsMatch[1], 10);
      $("st-limit").value = state.limit;
    }
    var etaMatch = trimmed.match(/^:eta\s+(on|off|true|false|1|0)\b/i);
    if (etaMatch){
      state.eta = /^(on|true|1)$/i.test(etaMatch[1]);
      if (state.tab === "tools") renderPanel();
    }
    var fastMatch = trimmed.match(/^:fast\s+(on|off|true|false|1|0)\b/i);
    if (fastMatch){
      state.fast = /^(on|true|1)$/i.test(fastMatch[1]);
      applyFastButton();
      if (state.tab === "tools") renderPanel();
    }
    // 终端里直接输入 :lang 时也要同步本地语言与界面（不只是下拉框走 lang 路由）
    // Typing :lang in the terminal must also sync local language and UI,
    // not just the select via the lang route.
    var langMatch = trimmed.match(/^:lang\s+(zh|en|both)\b/i);
    if (langMatch){
      state.lang = langMatch[1].toLowerCase();
      $("lang").value = state.lang;
      applyStaticTexts();
      applyTranscriptLang();
    }

    // :load 里的 :strategy/:steps/:eta/:fast/:lang 也要同步到界面
    // Settings inside a loaded file must also reach the UI state.
    // 普通求值结果里的 strategy/eta 是解释器“当前”的设置，不能拿来覆盖界面，
    // 否则分享链接里的策略会在回放时被结果冲掉
    // The strategy/eta of an ordinary result are the interpreter's current
    // settings; only a loaded file may change the UI, otherwise a shared
    // link's strategy would be overwritten while the history replays.
    if (/^:load\b/.test(trimmed)){
      var seen = {strategy: null, limit: null, eta: null, fast: null, lang: null};
      outputs.forEach(function(o){
        if (validStrategy(o.strategy)) seen.strategy = o.strategy;
        if (typeof o.limit === "number" && o.limit > 0) seen.limit = o.limit;
        if (typeof o.eta === "boolean") seen.eta = o.eta;
        if (typeof o.fast === "boolean") seen.fast = o.fast;
        if (validLang(o.lang)) seen.lang = o.lang;
      });
      if (seen.strategy){
        $("strategy").value = seen.strategy;
        $("st-strategy").textContent = strategyText(seen.strategy);
      }
      if (seen.limit){
        state.limit = seen.limit;
        $("st-limit").value = state.limit;
      }
      if (seen.eta != null){
        state.eta = seen.eta;
        if (state.tab === "tools") renderPanel();
      }
      if (seen.fast != null){
        state.fast = seen.fast;
        applyFastButton();
        if (state.tab === "tools") renderPanel();
      }
      if (seen.lang && seen.lang !== state.lang){
        state.lang = seen.lang;
        $("lang").value = state.lang;
        applyStaticTexts();
        applyTranscriptLang();
      }
    }

    var last = outputs.filter(function(o){ return o.kind === "result" || o.kind === "warn"; }).pop();
    if (last){
      // 协议提供 typeZh/typeEn，切语言时由 refreshStType 重新取值
      // The protocol provides typeZh/typeEn; refreshStType re-picks on language change.
      state.lastType = {zh: last.typeZh, en: last.typeEn, text: last.type};
      refreshStType();
      if (last.trace && last.trace.length && !opts.silent){
        state.selected = last;
        state.tracePos = last.trace.length - 1;
        if (state.tab === "trace") renderPanel();
      }
    }
    if (!opts.silent) scrollDown();
    saveLocal();
    return outputs;
  }

  /* ------------------------------------------------------------------- ac / 补全 */
  function tokenBeforeCursor(){
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos);
    var m = left.match(/(:[A-Za-z]+|[A-Za-z_][A-Za-z0-9_']*)$/);
    return m ? m[1] : "";
  }

  function candidates(token){
    var names = state.envRows.map(function(r){ return r.name; });
    var cmds = CMD_NAMES();
    var pool = token.charAt(0) === ":" ? cmds : names;
    var lower = token.toLowerCase();
    var seen = {};
    // 前缀匹配优先，其次允许子串匹配 / prefer prefix matches, then allow substring matches
    var start = [], inside = [];
    pool.forEach(function(x){
      if (seen[x]) return;
      seen[x] = 1;
      var i = x.toLowerCase().indexOf(lower);
      if (i === 0) start.push(x);
      else if (i > 0) inside.push(x);
    });
    return start.concat(inside).slice(0, 10);
  }

  function closeAc(){
    ac.classList.remove("open");
    if (ac.removeAttribute) ac.removeAttribute("aria-activedescendant");
    state.acItems = []; state.acIndex = -1;
  }

  function openAc(){
    var token = tokenBeforeCursor();
    if (!token || token.length < 1) { closeAc(); return; }
    var items = candidates(token);
    if (!items.length || (items.length === 1 && items[0] === token)) { closeAc(); return; }
    state.acItems = items;
    state.acIndex = 0;
    ac.innerHTML = items.map(function(x, i){
      return '<div class="item' + (i === 0 ? ' active' : '') + '" role="option" id="ac-opt-' + i +
             '" data-i="' + i + '" aria-selected="' + (i === 0 ? 'true' : 'false') + '">' +
             '<span>' + esc(x) + '</span><span class="hint">' + esc(cmdHint(x)) + '</span></div>';
    }).join("");
    if (ac.setAttribute) ac.setAttribute("aria-activedescendant", "ac-opt-0");
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el){
      el.addEventListener("mousedown", function(ev){ ev.preventDefault(); acceptAc(parseInt(el.dataset.i, 10)); });
    });
    ac.classList.add("open");
  }

  function acceptAc(i){
    if (i == null) i = state.acIndex;
    var token = tokenBeforeCursor();
    var pick = state.acItems[i];
    if (!pick) { closeAc(); return; }
    var pos = cmd.selectionStart || 0;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    cmd.value = left.slice(0, left.length - token.length) + pick + right;
    var newPos = pos - token.length + pick.length;
    cmd.setSelectionRange(newPos, newPos);
    closeAc();
    cmd.focus();
    pushEditor(cmd.value);
    syncEditor();
  }

  function insertText(text){
    var pos = cmd.selectionStart || cmd.value.length;
    var left = cmd.value.slice(0, pos), right = cmd.value.slice(pos);
    var pad = left && !/\s$/.test(left) ? " " : "";
    cmd.value = left + pad + text + right;
    var p = (left + pad + text).length;
    cmd.setSelectionRange(p, p);
    cmd.focus();
    pushEditor(cmd.value);
    syncEditor();
  }

  /* ------------------------------------------------------------- 编辑器 / editor */
  // 读入的计算样式同步到高亮层与行号列，避免断点覆盖字体后错位
  // Copy computed metrics so breakpoint font overrides cannot desync the layers.
  function syncEditorMetrics(){
    if (!hl || !gutter || !cmd) return;
    if (typeof window.getComputedStyle !== "function") return;
    var cs = null;
    try { cs = window.getComputedStyle(cmd); } catch(e){ return; }
    if (!cs) return;
    var keys = ["fontFamily","fontSize","lineHeight","letterSpacing","paddingTop",
                "paddingRight","paddingBottom","paddingLeft","tabSize"];
    keys.forEach(function(k){
      var v = cs[k];
      if (v == null) return;
      if (hl.style) hl.style[k] = v;
      if (k === "fontFamily" || k === "fontSize" || k === "lineHeight" || k === "paddingTop"){
        if (gutter.style) gutter.style[k] = v;
      }
    });
  }
  // 返回光标附近配对括号的两个下标 / indices of the bracket pair near the caret
  function findBracketPair(src, pos){
    var i, depth, left = src.charAt(pos - 1), right = src.charAt(pos);
    function isOpen(c){ return c === "(" || c === "["; }
    function isClose(c){ return c === ")" || c === "]"; }
    function closer(c){ return c === "(" ? ")" : "]"; }
    function opener(c){ return c === ")" ? "(" : "["; }
    if (isOpen(left) || isOpen(right)){
      var s = isOpen(left) ? pos - 1 : pos;
      var open = src.charAt(s), want = closer(open);
      depth = 0;
      for (i = s; i < src.length; i++){
        var c = src.charAt(i);
        if (c === open) depth++;
        else if (c === want){ depth--; if (depth === 0) return [s, i]; }
      }
    } else if (isClose(left)){
      var back = opener(left);
      depth = 0;
      for (i = pos - 1; i >= 0; i--){
        var b = src.charAt(i);
        if (b === left) depth++;
        else if (b === back){ depth--; if (depth === 0) return [i, pos - 1]; }
      }
    }
    return null;
  }
  // 逐字符 token 化并转义，配对的括号额外标记 / tokenize and escape, mark matched brackets
  function highlight(src, pair){
    var re = /(:[A-Za-z]+|λ|\\|\d+|[()\[\]]|→|->|[A-Za-z_][A-Za-z0-9_']*)/g;
    var htmlOut = "", last = 0, m, idx;
    function isMatch(i){ return pair && (i === pair[0] || i === pair[1]); }
    while ((m = re.exec(src)) !== null){
      idx = m.index;
      if (idx > last) htmlOut += esc(src.slice(last, idx));
      var tok = m[0], cls = "";
      if (tok === "λ" || tok === "\\") cls = "tok-lam";
      else if (tok.charAt(0) === ":") cls = "tok-cmd";
      else if (/^\d/.test(tok)) cls = "tok-num";
      else if (tok === "(" || tok === ")" || tok === "[" || tok === "]") cls = isMatch(idx) ? "tok-paren-match" : "tok-paren";
      else if (/^[A-Za-z_]/.test(tok)) cls = "tok-var";
      htmlOut += cls ? '<span class="' + cls + '">' + esc(tok) + '</span>' : esc(tok);
      last = idx + tok.length;
    }
    if (last < src.length) htmlOut += esc(src.slice(last));
    return htmlOut;
  }
  function renderGutter(src){
    if (!gutter) return;
    var n = src.split("\n").length, s = "";
    for (var i = 1; i <= n; i++) s += '<div>' + i + '</div>';
    gutter.innerHTML = s;
  }
  function syncEditorScroll(){
    if (!cmd) return;
    var top = cmd.scrollTop || 0, left = cmd.scrollLeft || 0;
    if (hl){ hl.scrollTop = top; hl.scrollLeft = left; }
    if (gutter && gutter.scrollTop != null) gutter.scrollTop = top;
  }
  // 透明输入层、高亮层与行号列的统一刷新 / unified refresh of all three layers
  function syncEditor(){
    if (!cmd) return;
    var src = String(cmd.value == null ? "" : cmd.value);
    var pos = cmd.selectionStart;
    if (typeof pos !== "number") pos = src.length;
    var pair = findBracketPair(src, pos);
    if (hl) hl.innerHTML = highlight(src, pair);
    renderGutter(src);
    syncEditorMetrics();
    syncEditorScroll();
  }
  // 编辑器输入撤销栈，与终端输出历史相互独立 / undo stack separate from terminal history
  function pushEditor(value){
    var v = String(value == null ? "" : value);
    if (edHist[edHistIdx] === v) return;
    edHist = edHist.slice(0, edHistIdx + 1);
    edHist.push(v);
    if (edHist.length > 200) edHist.shift();
    edHistIdx = edHist.length - 1;
  }
  function setEditorValue(v){ cmd.value = v; syncEditor(); }
  function editorUndo(){ if (edHistIdx > 0){ edHistIdx--; setEditorValue(edHist[edHistIdx]); } }
  function editorRedo(){ if (edHistIdx < edHist.length - 1){ edHistIdx++; setEditorValue(edHist[edHistIdx]); } }

  // 多行输入：未闭合的括号/方括号或行尾反斜杠表示续行，与命令行一致
  // Multi-line input: an unclosed parenthesis/bracket or a trailing backslash
  // continues the line, exactly like the command line REPL.
  function needsContinuation(line){
    if (/\\\s*$/.test(line)) return true;
    var depth = 0;
    for (var i = 0; i < line.length; i++){
      var c = line.charAt(i);
      if (c === "(" || c === "[") depth++;
      else if (c === ")" || c === "]") depth--;
    }
    return depth > 0;
  }
  function splitLogicalCommands(text){
    var lines = String(text == null ? "" : text).split(/\r?\n/);
    var out = [], cur = null;
    for (var i = 0; i < lines.length; i++){
      var line = lines[i].trim();
      if (!line) continue;
      // 行尾反斜杠是续行标记，去掉后与下一行拼接
      // A trailing backslash marks a continuation and is dropped.
      var continued = /\\\s*$/.test(line);
      if (continued) line = line.replace(/\\\s*$/, "").trim();
      cur = (cur == null) ? line : (cur + " " + line);
      if (!continued && !needsContinuation(cur)){ out.push(cur); cur = null; }
    }
    if (cur != null) out.push(cur);
    return out;
  }
  // 光标所在的逻辑命令范围：Ctrl/Cmd+Enter 只执行这一段，其余保留在输入框
  // The logical command under the caret: Ctrl/Cmd+Enter runs just this segment.
  function logicalCommandAt(text, pos){
    var s = String(text == null ? "" : text);
    var lines = s.split(/\r?\n/);
    var offsets = [], acc = 0;
    for (var i = 0; i < lines.length; i++){ offsets.push(acc); acc += lines[i].length + 1; }
    var at = Math.max(0, Math.min(Number(pos) || 0, s.length));
    var row = 0;
    for (var i = 0; i < lines.length; i++){
      if (at <= offsets[i] + lines[i].length){ row = i; break; }
      row = i;
    }
    var start = row;
    while (start > 0 && needsContinuation(lines[start - 1])) start--;
    var end = row;
    while (end < lines.length - 1 && needsContinuation(lines[end])) end++;
    var startOff = offsets[start];
    var endOff = end < lines.length - 1 ? offsets[end + 1] - 1 : offsets[end] + lines[end].length;
    return { start: startOff, end: endOff, text: s.slice(startOff, endOff) };
  }
  // 命令面板复用 dialog 的 list 模式 / the palette reuses dialog's list mode
  function openCommandPalette(){
    return dialog({
      title: t("cmdPaletteTitle"), message: t("cmdPaletteMsg"),
      input: true, ok: t("practiceInsert"), list: paletteItems()
    }).then(function(v){ if (v && typeof v === "string") insertText(v); });
  }

  /* ---------------------------------------------------------------- events / 事件 */
  cmd.addEventListener("input", function(){
    cmd.style.height = "auto";
    cmd.style.height = Math.min(cmd.scrollHeight, 120) + "px";
    pushEditor(cmd.value);
    syncEditor();
    openAc();
  });

  cmd.addEventListener("keydown", function(e){
    // 编辑器撤销/重做：独立于终端输出历史 / editor undo/redo, independent of terminal history
    if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")){
      e.preventDefault();
      if (e.shiftKey) editorRedo(); else editorUndo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === "y" || e.key === "Y")){
      e.preventDefault(); editorRedo(); return;
    }
    if (ac.classList.contains("open")){
      if (e.key === "ArrowDown"){ e.preventDefault(); state.acIndex = (state.acIndex + 1) % state.acItems.length; paintAc(); return; }
      if (e.key === "ArrowUp"){ e.preventDefault(); state.acIndex = (state.acIndex - 1 + state.acItems.length) % state.acItems.length; paintAc(); return; }
      if (e.key === "Tab" || e.key === "Enter"){ e.preventDefault(); acceptAc(); return; }
      // 只关闭补全弹窗；阻止冒泡，否则全局 Escape 会把正在进行的求值也取消掉
      // Dismiss only the popup; stop propagation so the global Escape cannot
      // also cancel an in-flight evaluation.
      if (e.key === "Escape"){ e.stopPropagation(); closeAc(); return; }
    }
    // Ctrl/Cmd+Enter 只运行当前逻辑命令；Shift+Enter 仍然是插入换行
    // Ctrl/Cmd+Enter runs the current logical command; Shift+Enter still inserts a newline.
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){
      e.preventDefault();
      var seg = logicalCommandAt(cmd.value,
        cmd.selectionStart == null ? cmd.value.length : cmd.selectionStart);
      // 与 Enter 一致：先拼掉续行反斜杠，不能把裸换行发给后端拆成多条命令
      // Like plain Enter: join continuations so a raw newline is never sent as
      // several separate commands.
      var parts = splitLogicalCommands(seg.text);
      var one = parts.length ? parts.join(" ") : "";
      if (!one) return;
      cmd.value = (cmd.value.slice(0, seg.start) + cmd.value.slice(seg.end)).replace(/^\n/, "");
      cmd.style.height = "auto";
      pushEditor(cmd.value);
      syncEditor();
      state.history.push(one);
      if (state.history.length > 100) state.history.shift();
      state.hIdx = state.history.length;
      saveLocal();
      exec(one);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      var v = cmd.value;
      cmd.value = "";
      cmd.style.height = "auto";
      pushEditor("");
      syncEditor();
      if (v.trim()) state.history.push(v);
      state.hIdx = state.history.length;
      saveLocal();
      // 与命令行一致：未闭合的括号或行尾反斜杠表示续行，多行输入按一条命令发送
      // Like the CLI, an unclosed bracket or a trailing backslash continues the
      // line, so a multi-line term is sent as one command.
      var cmds = splitLogicalCommands(v);
      var chain = Promise.resolve();
      cmds.forEach(function(c){ chain = chain.then(function(){ return exec(c); }); });
      return;
    }
    if (e.key === "ArrowUp" && !cmd.value.includes("\n")){
      if (state.history.length){ if (state.hIdx > 0) state.hIdx--; cmd.value = state.history[state.hIdx] || ""; e.preventDefault(); }
    } else if (e.key === "ArrowDown" && !cmd.value.includes("\n")){
      if (state.history.length){
        if (state.hIdx < state.history.length - 1){ state.hIdx++; cmd.value = state.history[state.hIdx]; }
        else { state.hIdx = state.history.length; cmd.value = ""; }
      }
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")){
      e.preventDefault(); clearAll();
    }
  });

  function paintAc(){
    Array.prototype.forEach.call(ac.querySelectorAll(".item"), function(el, i){
      el.classList.toggle("active", i === state.acIndex);

  }

  // 滚动与光标移动时同步高亮层、行号与括号匹配 / keep layers aligned on scroll and caret moves
  if (cmd.addEventListener){

          e.key === "ArrowDown" || e.key === "Home" || e.key === "End") syncEditor();

  async function startSession(opts){
    opts = opts || {};
    out.innerHTML = "";
    state.selected = null;
    state.envRows = [];
    state.replaying = true;
    setManual(false);
    stopPlay();
    try {
      if (!opts.reuse || !state.session) await newSession();
      addLine("info", t("welcome"), null, null, I18N.welcome.zh, I18N.welcome.en);
      // 设置必须先发送到解释器，回放才会按分享的策略/步数执行
      // Apply settings before replay so shared strategy and limit take effect.
      await evalLine(":lang " + state.lang, true);
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await evalLine(":eta " + (state.eta ? "on" : "off"), true);
      await evalLine(":fast " + (state.fast ? "on" : "off"), true);
      await evalLine(":encoding " + state.encoding, true);
      // 跳过历史里的 :lang，最后按分享链接/下拉框选定的语言重新声明
      // Skip replayed :lang lines; re-assert the chosen language afterwards.
      var lines = state.codeLines.filter(function(l){ return !/^\s*:lang\b/i.test(l); });
      for (var i = 0; i < lines.length; i++){
        await exec(lines[i], {record: false});
      }
      await evalLine(":lang " + state.lang, true);
      await refreshEnv();
    } finally {
      state.replaying = false;
    }
  }

  function clearAll(){
    state.gen = (state.gen || 0) + 1;
    // 清空也要终止所有进行中的请求与轨迹播放，否则它们随后仍会重建会话
    // Clear must abort every in-flight request and stop playback, otherwise a
    // pending response can still revive the session afterwards.
    inflight.slice().forEach(function(c){
      if (c && typeof c.abort === "function"){
        try { c.abort(); } catch(e){}
      }
    });
    inflight.length = 0;
    activeController = null;
    setCancelActive(false);
    stopPlay();
    out.innerHTML = "";
    state.codeLines = [];
    state.selected = null;
    state.envRows = [];
    state.session = null;
    setManual(false);
    newSession().then(async function(){
      await evalLine(":strategy " + $("strategy").value, true);
      await evalLine(":steps " + state.limit, true);
      await evalLine(":eta " + (state.eta ? "on" : "off"), true);
      await evalLine(":fast " + (state.fast ? "on" : "off"), true);
      await evalLine(":encoding " + state.encoding, true);
      addLine("info", t("welcome"), null, null, I18N.welcome.zh, I18N.welcome.en);
      await refreshEnv();
      renderPanel();
      saveLocal();
    });
    try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    cmd.value = "";
    pushEditor("");
    syncEditor();
    cmd.focus();
  }

  // Trace shortcuts: ←/→ step, Space plays/pauses (ignored while typing).
  document.addEventListener("keydown", function(e){
    if (dialogOpen) return;
    // 证明视图渲染的是 renderProof()，没有播放控件；此时不应响应轨迹快捷键
    // The proof view renders renderProof() with no playback controls, so ignore trace keys.
    if (state.tab !== "trace" || !state.selected || !state.selected.trace
        || state.selected.leftTrace) return;
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ae.tagName)) return;
    var n = state.selected.trace.length;
    if (e.key === "ArrowLeft"){ e.preventDefault(); stopPlay(); state.tracePos = Math.max(0, state.tracePos - 1); renderPanel(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); stopPlay(); state.tracePos = Math.min(n - 1, state.tracePos + 1); renderPanel(); }
    else if (e.key === " "){ e.preventDefault(); if (state.playing){ stopPlay(); renderPanel(); } else startPlay(); }
  });

  document.addEventListener("keydown", function(e){

      // 已有弹窗时不再叠加：多个 dialog 共用同一个 #modal，会导致列表互相覆盖、
      // 一次 Enter 同时 resolve 多个 Promise.
      // Do not stack dialogs: they share one #modal, so lists overwrite each
      // other and a single Enter resolves more than one promise.
      if (dialogOpen) return;

    // roving tabindex 与左右方向键切换 / roving tabindex and Left/Right navigation
    b.addEventListener("keydown", function(e){
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault();
      var arr = Array.prototype.slice.call(tabEls);
      var idx = arr.indexOf(b), next;
      if (e.key === "Home") next = 0;
      else if (e.key === "End") next = arr.length - 1;
      else next = (idx + (e.key === "ArrowRight" ? 1 : -1) + arr.length) % arr.length;
      if (arr[next]){
        switchTab(arr[next].dataset.tab);
        if (arr[next].focus) arr[next].focus();
      }
    });
  });

  function sharePayload(){
    return {
      v: 2,
      code: state.codeLines,
      strategy: $("strategy").value,
      limit: state.limit,
      theme: state.theme,
      lang: state.lang,
      eta: state.eta,
      fast: state.fast,
      encoding: state.encoding

  function encodeShareState(){
    return btoa(unescape(encodeURIComponent(JSON.stringify(sharePayload()))))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }

  // 分享链接可被手工构造（#state= 不经过服务端），因此逐字段校验，
  // 避免非法策略/步数/语言把界面带入无效状态
  // Share links can be crafted (#state= bypasses the server), so validate each
  // field instead of trusting it.
  function validLang(v){ return v === "zh" || v === "en" || v === "both"; }
  function validTheme(v){ return v === "light" || v === "dark"; }
  function validLimit(v){ return typeof v === "number" && isFinite(v) && v > 0 && v <= 10000000; }
  function validStrategy(v){ return typeof v === "string" && !!STRATEGY_LABELS[v]; }

  // 与后端 /api/share 一致的白名单：外部构造的 #state=/#code= 不能绕过它
  // Mirror the backend share whitelist: crafted #state=/#code= must not bypass it.
  var SAFE_SHARE_CMDS = {
    ":lang":1, ":strategy":1, ":steps":1, ":eta":1, ":fast":1, ":encoding":1,
    ":type":1, ":trace":1, ":ast":1, ":db":1, ":eq":1, ":conv":1, ":prove":1, ":nf":1, ":whnf":1,
    ":int":1, ":church":1, ":env":1, ":help":1, ":def":1, ":search":1, ":let":1,
    ":begin":1, ":step":1, ":back":1, ":undo":1, ":forward":1, ":redo":1, ":goto":1, ":run":1, ":end":1
  };
  function isSafeShareCommand(line){
    if (typeof line !== "string") return false;
    for (var i = 0; i < line.length; i++){
      var c = line.charCodeAt(i);
      if ((c < 32 && c !== 9) || c === 0x1e || c === 0xfeff ||
          c === 0x2028 || c === 0x2029) return false;
    }
    var s = line.trim();
    if (!s || s.slice(0, 2) === "--" || s.charAt(0) === "#") return true;
    if (s.charAt(0) === ":") return !!SAFE_SHARE_CMDS[s.split(/\s+/)[0].toLowerCase()];
    return true;
  }
  function safeShareCode(code){
    if (!Array.isArray(code)) return [];
    return code.filter(isSafeShareCommand).slice(0, 200);
  }

  function applySharePayload(payload){
    if (!payload) return;
    if (Array.isArray(payload.code)) {
      state.codeLines = safeShareCode(payload.code);
    }
    if (typeof payload.strategy === "string" && STRATEGY_LABELS[payload.strategy]) {
      $("strategy").value = payload.strategy;
    }
    if (validLimit(payload.limit)) state.limit = Math.floor(payload.limit);
    if (validTheme(payload.theme)) state.theme = payload.theme;
    if (validLang(payload.lang)) state.lang = payload.lang;
    if (typeof payload.eta === "boolean") state.eta = payload.eta;
    if (typeof payload.fast === "boolean") state.fast = payload.fast;
    if (payload.encoding === "church" || payload.encoding === "scott"){
      state.encoding = payload.encoding;
      $("encoding").value = payload.encoding;
    }
    applyFastButton();
  }

  // 不重放命令，直接用服务端同时返回的中/英文本刷新已有输出
  // Refresh existing output from the bilingual fields without replaying.
  function applyTranscriptLang(){
    // 批量改写历史文本时暂停朗读，避免读屏软件重读整段记录
    // Pause live announcements while rewriting the whole transcript.
    var live = out.getAttribute("aria-live");
    out.removeAttribute("aria-live");
    Array.prototype.forEach.call(out.querySelectorAll(".line"), function(el){
      if (el._zh != null){
        var body = el.querySelector(".body");
        if (body) body.textContent = pickPair(el._zh, el._en, el._zh);
      }
      var m = el._metaEl || el.querySelector(".meta");
      if (el._metaObj && m){
        // 警告行显示的是错误码，不是结果摘要；切换语言时不能把它替换掉
        // A warning's meta is its error code, not a result summary.
        m.textContent = el._errCode ? String(el._errCode) : resultMeta(el._metaObj);
      }
      if (el._metaPair && m){
        m.textContent = pickPair(el._metaPair[0], el._metaPair[1], el._metaPair[0]);
      }
      // 错误码提示的标题里含可翻译的“错误码”前缀，切换语言时一并刷新
      // The code tooltip contains a translatable prefix; refresh it on lang switch.
      if (el._errCode) el.title = t("errCode") + ": " + el._errCode;
    });
    Array.prototype.forEach.call(out.querySelectorAll(".act"), function(b){
      if (b._relabel) b._relabel();
    });
    renderRedexes();
    refreshStType();
    renderPanel();
    if (live) out.setAttribute("aria-live", live);
  }

  function applyStaticTexts(){
    document.body.dataset.lang = state.lang;
    $("subline").textContent = t("subline");
    $("ex-title").textContent = t("exTitle");
    $("pre-title").textContent = t("preTitle");
    $("foot-hint").textContent = t("foot");
    $("clear").textContent = t("clear");
    $("skip-link").textContent = t("skipLink");
    $("cancel-eval").textContent = t("cancelEval");
    $("share").textContent = t("share");
    $("export").textContent = t("exportB");
    $("import").textContent = t("importB");
    applyPlaceholder();
    $("theme-toggle").textContent = state.theme === "dark" ? t("light") : t("dark");
    $("st-steps-label").textContent = t("steps");
    $("m-label").textContent = t("manual");
    $("m-begin").textContent = t("begin");
    $("m-back").textContent = t("backB");
    $("m-forward").textContent = t("forwardB");
    $("m-start").textContent = t("startB");
    $("m-step").textContent = t("stepB");
    $("m-run").textContent = t("runEndB");
    $("m-end").textContent = t("endB");
    Array.prototype.forEach.call($("strategy").options, function(o){
      if (STRATEGY_LABELS[o.value]) o.textContent = strategyText(o.value);
    });
    $("st-strategy").textContent = strategyText($("strategy").value);
    applyFastButton();
    selects.forEach(function(s){ s.sync(); });
    renderExamples();
  }

  /* ------------------------------------------------------------------ boot / 启动 */
  async function boot(){
    var saved = loadLocal();
    if (saved){
      if (validLang(saved.lang)) state.lang = saved.lang;
      if (validTheme(saved.theme)) state.theme = saved.theme;
      if (validLimit(saved.limit)) state.limit = Math.floor(saved.limit);
      if (typeof saved.eta === "boolean") state.eta = saved.eta;
      if (typeof saved.fast === "boolean") state.fast = saved.fast;
      if (saved.encoding === "church" || saved.encoding === "scott"){
        state.encoding = saved.encoding;
        $("encoding").value = saved.encoding;
      }
      if (saved.exerciseDone && typeof saved.exerciseDone === "object") state.exerciseDone = saved.exerciseDone;
      if (Array.isArray(saved.notebookCells) && saved.notebookCells.length) state.notebookCells = saved.notebookCells;
      if (saved.compare && typeof saved.compare === "object") state.compare = saved.compare;
      if (saved.a11y && typeof saved.a11y === "object"){
        state.a11y.contrast = saved.a11y.contrast === true;
        state.a11y.font = (typeof saved.a11y.font === "number")
          ? Math.max(80, Math.min(130, saved.a11y.font)) : 100;
      }
      applyA11y();
      if (typeof saved.strategy === "string" && STRATEGY_LABELS[saved.strategy]) {
        $("strategy").value = saved.strategy;
      }
      if (Array.isArray(saved.code)) {
        // 本地存储与分享链接同样要经过命令白名单，避免刷新后回放 :load/:edit/:q
        // Local storage must pass the same command whitelist as share links.
        state.codeLines = safeShareCode(saved.code);
      }
      // 命令历史随界面状态一起持久化，刷新后仍可用上下方向键找回
      // Persist command history with the UI state so Up/Down survives a reload.
      if (Array.isArray(saved.history)) {
        state.history = saved.history.filter(function(x){ return typeof x === "string"; }).slice(-100);
        state.hIdx = state.history.length;
      }
    }
    // 首次访问默认浅色；之后沿用用户保存的主题
    // First visit defaults to light; later visits keep the saved theme.
    applyTheme(state.theme);
    $("lang").value = state.lang;
    $("st-strategy").textContent = $("strategy").value;
    $("st-limit").value = state.limit;
    applyStaticTexts();
    loadPrelude();

    // URL 分享链接优先：新格式含代码 + 策略 + 步数 + 主题 + 语言
    // URL share state first: new format carries code, strategy, limit, theme and language.
    var hash = location.hash.slice(1);
    if (hash.indexOf("s=") === 0){
      var sid = hash.slice(2);
      if (/^[0-9a-f]{10}$/.test(sid)){
        try {
          var sr = await api("api/share/" + sid, null, "GET");
          if (sr.data && sr.data.ok) applySharePayload(sr.data.state);
          else toast(dual("分享链接已失效或未找到", "share link expired or not found"));
        } catch(e){}
      }
    } else if (hash.indexOf("state=") === 0){
      try {
        var sb64 = hash.slice(6).replace(/-/g,"+").replace(/_/g,"/");
        while (sb64.length % 4) sb64 += "=";
        applySharePayload(JSON.parse(decodeURIComponent(escape(atob(sb64)))));
      } catch(e){}
    } else if (hash.indexOf("code=") === 0){
      try {
        var b64 = hash.slice(5).replace(/-/g,"+").replace(/_/g,"/");
        while (b64.length % 4) b64 += "=";
        var text = decodeURIComponent(escape(atob(b64)));
        state.codeLines = text.split("\n").filter(function(l){
          return l.trim() && isSafeShareCommand(l);
        }).slice(0, 200);
      } catch(e){}
    }

    var stepsLine = state.codeLines.filter(function(l){ return /^:steps\s+\d+/.test(l.trim()); }).pop();
    if (stepsLine){
      var stepsVal = parseInt(stepsLine.trim().split(/\s+/)[1], 10);
      if (validLimit(stepsVal) && stepsVal <= 10000000) state.limit = Math.floor(stepsVal);
    }
    // 分享链接可能覆盖语言/主题/策略，重新应用一次
    // A share link may override language/theme/strategy; re-apply them.
    applyTheme(state.theme);
    $("lang").value = state.lang;
    $("st-strategy").textContent = strategyText($("strategy").value);
    $("st-limit").value = state.limit;
    applyStaticTexts();
    await startSession();
    renderPanel();
    if (!saved && !state.codeLines.length && !hash) switchTab("guide");
    syncEditor();
    cmd.focus();
    showNarrowHint();
  }

  if (phoneQuery){
    if (phoneQuery.addEventListener) phoneQuery.addEventListener("change", applyPlaceholder);
    else if (phoneQuery.addListener) phoneQuery.addListener(applyPlaceholder);
  }

  boot();
})();
</script>
