<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="./">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Lambda 演算计算器 · Lambda Calculus</title>
<style>
  @font-face{
    font-family:'APL385 Unicode';
    src:url(fonts/APL385.ttf) format('truetype');
    font-display:swap;
  }
  .lam{font-family:'APL385 Unicode',var(--mono);}
  :root{
    color-scheme: light;
    --bg:#fafaf8; --paper:#ffffff; --card:#ffffff; --term-bg:#ffffff;
    --text:#141518; --dim:#5c5f66; --faint:#5f626a; --fg:var(--text);
    --border:rgba(20,21,24,.14); --border-strong:rgba(20,21,24,.46);
    --hover:rgba(20,21,24,.045);
    --accent:#141518; --prompt:#141518;
    --ok:#2f7d4f; --err:#b83a30; --warn:#8a6416; --info:#5c5f66;
    --del:#b83a30; --ins:#2f7d4f;
    --sel:rgba(20,21,24,.14);
    --scroll:#dddcd6; --scroll-hover:#bfbeb7;
    --mono:'APL385 Unicode','SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',Menlo,'Courier New',monospace;
    --serif:"Georgia","Times New Roman","Songti SC","SimSun","宋体",serif;
    --radius:2px;
    --font-scale:1;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b0c0e; --paper:#0e0f11; --card:#0e0f11; --term-bg:#0b0c0e;
    --text:#e8e9ec; --dim:#b6b9c0; --faint:#9a9ea7; --fg:var(--text);
    --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.44);
    --hover:rgba(255,255,255,.05);
    --accent:#f0f1f3; --prompt:#f0f1f3;
    --ok:#84c99b; --err:#e8887e; --warn:#d8b978; --info:#9ea1a8;
    --del:#e8887e; --ins:#84c99b;
    --sel:rgba(255,255,255,.16);
    --scroll:#26282d; --scroll-hover:#3a3d43;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--sel);color:inherit;}
  *{scrollbar-width:thin;scrollbar-color:var(--scroll) transparent;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;border:3px solid transparent;background-clip:padding-box;}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover);}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:calc(14px * var(--font-scale,1));line-height:1.7;transition:background .2s ease,color .2s ease;overflow:hidden;}
  .app{height:100%;max-width:1180px;margin:0 auto;padding:20px 20px 14px;display:flex;flex-direction:column;overflow:hidden;}
  header{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap;}
  h1{font-size:calc(18px * var(--font-scale,1));font-weight:400;margin:0 0 4px;letter-spacing:.04em;font-family:var(--mono);}
  .sub{color:var(--dim);font-size:calc(11.5px * var(--font-scale,1));margin:0;letter-spacing:.01em;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button.ctl,.sel-btn{font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px;cursor:pointer;transition:color .15s,border-color .15s;}
  button.ctl:hover,.sel-btn:hover{color:var(--text);border-color:var(--border-strong);}
  button.ctl:focus-visible,.sel-btn:focus-visible{outline:1px solid var(--accent);outline-offset:2px;}
  #fast-toggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);}
  .sel{position:relative;display:inline-flex;}
  .sel > select{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;}
  .sel-btn{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;}
  .sel-btn .chev{color:var(--faint);font-size:calc(9px * var(--font-scale,1));line-height:1;}
  .sel.open .sel-btn{border-color:var(--border-strong);color:var(--text);}
  .sel-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);display:none;max-height:280px;overflow:auto;padding:2px 0;}
  .sel.open .sel-menu{display:block;}
  .sel-opt{padding:5px 10px 5px 9px;border-left:1px solid transparent;font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);cursor:pointer;white-space:nowrap;}
  .sel-opt:hover{color:var(--text);}
  .sel-opt[aria-selected="true"]{color:var(--text);border-left-color:var(--accent);}
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.open{display:flex;}
  .modal .box{width:min(420px,100%);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:16px;font-family:var(--mono);}
  .modal h3{margin:0 0 8px;font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400;}
  .modal p{margin:0 0 12px;font-size:calc(12.5px * var(--font-scale,1));color:var(--dim);line-height:1.6;}
  .modal input{width:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));padding:7px 9px;outline:none;margin-bottom:14px;}
  .modal input:focus{border-color:var(--border-strong);}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;}
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:stretch;}
  .term{display:flex;flex-direction:column;min-height:0;height:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .term-bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);}
  .term-title{font-family:var(--mono);font-size:calc(10px * var(--font-scale,1));color:var(--faint);letter-spacing:.16em;text-transform:uppercase;}
  .term-tools{margin-left:auto;display:flex;gap:6px;}
  .term-tools button{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:3px 9px;cursor:pointer;}
  .term-tools button:hover{background:var(--hover);color:var(--text);}
  .term-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 10px;}
  .term-out{flex:1;min-height:0;max-height:none;overflow-y:auto;font-family:var(--mono);font-size:calc(13.5px * var(--font-scale,1));line-height:1.75;white-space:pre-wrap;word-break:break-word;padding-right:6px;}
  .line{margin:2px 0;display:flex;gap:8px;align-items:flex-start;}
  /* 结果行的 kind=term 与终端卡片 .term 同名，这里恢复成普通行 / a "term" result line must not inherit the .term card box */
  .line.term{display:flex;flex-direction:row;height:auto;min-height:0;gap:8px;align-items:flex-start;
    background:transparent;border:0;border-radius:0;overflow:visible;}
  .line-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .line .body{min-width:0;white-space:pre-wrap;word-break:break-word;}
  .line-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .line.echo{color:var(--faint);}
  .line.echo .p{color:var(--prompt);font-weight:600;}
  .line.result .body{color:var(--text);}
  .line.result .mark{color:var(--ok);}
  .line.define{color:var(--dim);}
  .line.define .mark{color:var(--faint);}
  .line.error .body{color:var(--err);}
  .line.fail .body{color:var(--err);}
  .line.warn .body{color:var(--warn);}
  .line.info .body{color:var(--info);}
  .mark{flex:none;font-weight:600;user-select:none;}
  .meta{font-size:calc(10.5px * var(--font-scale,1));color:var(--faint);border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;white-space:nowrap;background:transparent;}
  .line-main > .meta{align-self:flex-start;}
  .line .act{font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:0 7px;cursor:pointer;opacity:0;transition:opacity .12s,color .12s,border-color .12s;}
  .line:hover .act,.line.sel .act{opacity:1;}
  .line .act:hover{color:var(--text);border-color:var(--border-strong);}
  .line.sel{background:var(--hover);border-radius:var(--radius);}
  /* 解析错误的定位片段：出错行 + 脱字符 / parse-error snippet: the failing line plus a caret */
  .err-snip{color:var(--dim);margin:0 0 2px;}
  .err-src{color:var(--dim);}
  .err-ch{color:var(--err);border-bottom:2px solid var(--err);}
  .err-caret{color:var(--err);font-family:var(--mono);white-space:pre;cursor:pointer;user-select:none;
    align-self:flex-start;border-radius:var(--radius);}
  .err-caret:hover,.err-caret:focus-visible{color:var(--text);background:var(--hover);outline:none;}
  .term-line{flex:none;display:flex;align-items:flex-start;gap:9px;margin-top:10px;font-family:var(--mono);font-size:calc(13.5px * var(--font-scale,1));border-top:1px solid var(--border);padding-top:11px;}
  .prompt{color:var(--prompt);flex:none;user-select:none;font-weight:600;padding-top:2px;}
  .input-wrap{flex:1;min-width:0;position:relative;
    --ed-font:var(--mono); --ed-fs:13.5px; --ed-lh:1.7; --ed-padv:2px; --ed-padh:0px;}
  .editor-row{display:flex;align-items:stretch;}
  /* 行号列与编辑器共享字体、行高、内边距 / the gutter shares font, leading and padding */
  .gutter{flex:none;min-width:2.2em;text-align:right;overflow:hidden;user-select:none;pointer-events:none;
    color:var(--faint);font-family:var(--ed-font);font-size:var(--ed-fs);line-height:var(--ed-lh);
    padding:var(--ed-padv) 8px var(--ed-padv) 0;border-right:1px solid var(--border);}
  .gutter div{line-height:inherit;}
  .ed-stack{position:relative;flex:1;min-width:0;}
  /* 透明 textarea 叠在高亮层之上 / transparent textarea above the highlight layer */
  .hl,#cmd{margin:0;font-family:var(--ed-font);font-size:var(--ed-fs);line-height:var(--ed-lh);
    letter-spacing:normal;tab-size:4;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;
    padding:var(--ed-padv) var(--ed-padh);border:0;}
  .hl{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
    color:var(--text);background:transparent;}
  #cmd{position:relative;z-index:2;display:block;width:100%;background:transparent;outline:none;
    color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--accent);
    resize:none;overflow-x:hidden;overflow-y:auto;}
  #cmd::selection{background:var(--sel);}
  #cmd::placeholder{color:var(--faint);-webkit-text-fill-color:var(--faint);}
  .tok-lam{color:var(--accent);font-weight:600;}
  .tok-cmd{color:var(--info);font-weight:600;}
  .tok-num{color:var(--warn);}
  .tok-paren{color:var(--dim);}
  .tok-var{color:var(--text);}
  .tok-paren-match{color:var(--accent);background:var(--sel);border-radius:2px;font-weight:600;}
  #cancel-eval{flex:none;align-self:flex-start;margin-top:1px;font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));
    color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);
    padding:4px 9px;cursor:pointer;white-space:nowrap;}
  #cancel-eval:hover{color:var(--err);border-color:var(--err);}
  #cancel-eval:disabled{opacity:.4;cursor:default;}
  .ac{position:absolute;left:0;top:100%;z-index:20;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);min-width:220px;max-height:240px;overflow:auto;display:none;}
  .ac.open{display:block;}
  .ac .item{padding:4px 10px;font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));cursor:pointer;display:flex;justify-content:space-between;gap:12px;}
  .ac .item .hint{color:var(--faint);font-size:calc(11px * var(--font-scale,1));}
  .ac .item.active,.ac .item:hover{background:var(--hover);}
  .status{flex:none;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--faint);margin-top:8px;align-items:center;}
  .status b{font-weight:500;color:var(--dim);}
  .status .lim{display:inline-flex;align-items:center;gap:5px;}
  .status input[type=number]{width:66px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));padding:1px 4px;-moz-appearance:textfield;}
  .status input[type=number]::-webkit-outer-spin-button,
  .status input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .status input[type=number]:focus-visible{outline:1px solid var(--accent);outline-offset:1px;}
  .manual-bar{flex:none;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--faint);}
  .mini{font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:2px 8px;cursor:pointer;}
  .mini:hover:not(:disabled){color:var(--text);border-color:var(--border-strong);}
  .mini:disabled{opacity:.35;cursor:default;}
  .mini[aria-pressed="true"]{color:var(--text);border-color:var(--border-strong);}
  .manual-bar .mterm{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .panel-head h3{margin:0;}
  .panel-head .hp{display:flex;gap:6px;flex:none;}
  /* 右侧面板 / inspector */
  .side{display:flex;flex-direction:column;min-height:0;height:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .tabs{flex:none;display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tab{flex:0 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);background:transparent;border:0;border-bottom:1px solid transparent;padding:8px 7px 7px;cursor:pointer;white-space:nowrap;}
  .tab .en{font-size:calc(9px * var(--font-scale,1));color:var(--faint);letter-spacing:.08em;text-transform:uppercase;}
  .tab:hover{color:var(--text);}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);}
  .tab[aria-selected="true"] .en{color:var(--dim);}
  body[data-lang="zh"] .tab .en{display:none;}
  body[data-lang="en"] .tab .zh{display:none;}
  .panel{flex:1;min-height:0;max-height:none;padding:12px 14px;overflow:auto;font-family:var(--mono);}
  .panel h3{font-size:calc(11px * var(--font-scale,1));font-weight:400;color:var(--dim);margin:0 0 8px;letter-spacing:.05em;font-family:var(--mono);text-transform:uppercase;}
  .panel pre{font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));line-height:1.7;margin:0;white-space:pre-wrap;word-break:break-word;}
  .panel pre.ast-pre{white-space:pre;word-break:normal;overflow-x:auto;padding-bottom:4px;}
  .empty{color:var(--faint);font-size:calc(12px * var(--font-scale,1));font-style:italic;}
  .player{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .player button{font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);width:28px;height:26px;cursor:pointer;}
  .player button:hover{color:var(--text);border-color:var(--border-strong);}
  .player input[type=range]{flex:1;height:16px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;--p:0%;}
  .player input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:0;background:linear-gradient(to right,var(--text) 0 var(--p),var(--border) var(--p) 100%);}
  .player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-3.5px;border-radius:50%;background:var(--text);border:0;}
  .player input[type=range]::-moz-range-track{height:2px;border-radius:0;background:var(--border);}
  .player input[type=range]::-moz-range-progress{height:2px;background:var(--text);}
  .player input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--text);}
  .player input[type=range]:focus-visible{outline:1px solid var(--accent);outline-offset:3px;}
  .player .count{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));color:var(--faint);white-space:nowrap;}
  .cmp{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
  .cmp .row{padding:8px 10px;font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));white-space:pre-wrap;word-break:break-word;}
  .cmp .row + .row{border-top:1px dashed var(--border);}
  .cmp .lab{font-size:calc(10px * var(--font-scale,1));color:var(--faint);font-family:var(--mono);letter-spacing:.05em;display:block;margin-bottom:2px;}
  .cmp del{background:rgba(192,57,43,.16);color:var(--del);text-decoration:none;border-radius:2px;}
  .cmp ins{background:rgba(47,143,82,.16);color:var(--ins);text-decoration:none;border-radius:2px;}
  .note{font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);margin-bottom:10px;}
  .steps-list{display:flex;flex-direction:column;gap:2px;}
  .steps-list .st{font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);padding:4px 8px;border:0;border-left:1px solid transparent;background:transparent;text-align:left;width:100%;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .steps-list .st:hover{color:var(--text);border-left-color:var(--border-strong);}
  .steps-list .st.active{color:var(--text);border-left-color:var(--accent);}
  .proof-summary{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);margin-bottom:12px;}
  .proof-summary .lab{color:var(--fg);opacity:.7;}
  .proof-list{list-style:none;margin:4px 0 14px;padding:0;display:flex;flex-direction:column;gap:2px;}
  .proof-list li{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);padding:3px 0;border-bottom:1px dashed var(--border);}
  .proof-list .pf-n{min-width:2.5em;text-align:right;color:var(--fg);opacity:.6;}
  .proof-list .pf-rule{min-width:2em;color:var(--accent);}
  .proof-list code{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proof-acts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
  .proof-acts .mini{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);padding:3px 8px;cursor:pointer;}
  .proof-acts .mini:hover{color:var(--text);border-color:var(--border-strong);}
  .prop-box{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--dim);font-size:calc(12px * var(--font-scale,1));}
  .deriv-list{margin:6px 0 0;padding-left:22px;font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);}
  .deriv-list li{padding:2px 0;border-bottom:1px dashed var(--border);}
  .type-err{text-decoration:underline wavy var(--err);text-underline-offset:3px;}
  .deriv-list button{background:transparent;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0 4px;}
  .diamond{width:100%;max-width:440px;height:auto;margin:4px 0 14px;}
  .diamond-edge{stroke:var(--border-strong);stroke-width:1.2;fill:none;}
  .diamond-node{fill:var(--fg);}
  .diamond-node.common{fill:var(--accent);}
  .diamond-text{font-family:var(--mono);font-size:calc(10px * var(--font-scale,1));fill:var(--dim);}
  .diamond-step{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));fill:var(--accent);}
  .ex-card,.sess-card{border:1px solid var(--border);border-radius:var(--radius);padding:9px 11px;margin-bottom:8px;}
  .ex-title{color:var(--fg);font-size:calc(12px * var(--font-scale,1));}
  .ex-ask{color:var(--dim);font-size:calc(11.5px * var(--font-scale,1));margin:6px 0;}
  .ex-card input,.sess-card input,.ex-card textarea{font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));width:100%;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:6px 8px;}
  .ex-card textarea{resize:vertical;min-height:44px;}
  :root[data-contrast=on]{--dim:var(--fg);--faint:var(--fg);--border:var(--fg);--border-strong:var(--fg);}
  .ex-result{font-size:calc(11.5px * var(--font-scale,1));margin-top:6px;}
  .ex-result.ok{color:var(--ins);}.ex-result.no{color:var(--del);}
  .sess-head{display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .sess-meta{font-size:calc(11px * var(--font-scale,1));color:var(--faint);margin:4px 0 8px;}
  .sess-acts{display:flex;gap:6px;flex-wrap:wrap;}
  .sess-acts button,.ex-card button{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);padding:4px 8px;cursor:pointer;}
  .sess-acts button:hover,.ex-card button:hover{color:var(--text);border-color:var(--border-strong);}
  .race-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .race-card{border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .race-head{font-size:calc(12px * var(--font-scale,1));color:var(--fg);border-bottom:1px dashed var(--border);padding-bottom:5px;}
  .race-meta{font-size:calc(11px * var(--font-scale,1));color:var(--dim);}
  .race-card code{font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--text);white-space:pre-wrap;word-break:break-word;max-height:6.5em;overflow:auto;}
  .race-card .mini{align-self:flex-start;font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);padding:3px 8px;cursor:pointer;}
  .race-card .mini:hover{color:var(--text);border-color:var(--border-strong);}
  .env-row{display:flex;flex-direction:column;gap:1px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .env-row:last-child{border-bottom:0;}
  .env-head{display:flex;align-items:center;gap:8px;}
  .env-name{font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));color:var(--text);cursor:pointer;border-bottom:1px solid transparent;}
  .env-name:hover{border-bottom-color:var(--border-strong);}
  .env-val{font-family:var(--mono);font-size:calc(11.5px * var(--font-scale,1));color:var(--dim);white-space:pre-wrap;word-break:break-word;}
  .env-ty{font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--faint);}
  .env-del{margin-left:auto;font-size:calc(10.5px * var(--font-scale,1));color:var(--faint);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:0 6px;cursor:pointer;opacity:0;}
  .env-row:hover .env-del{opacity:1;}
  .env-del:hover{color:var(--err);border-color:var(--err);}
  .help-dl dt{font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));color:var(--accent);margin-top:7px;}
  .help-dl dd{margin:0 0 2px 0;font-size:calc(12px * var(--font-scale,1));color:var(--dim);}
  .guide-step{padding:9px 0;border-top:1px dashed var(--border);}
  .guide-step:first-of-type{border-top:0;padding-top:0;}
  .guide-step h4{margin:0 0 3px;font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));letter-spacing:.05em;color:var(--text);font-weight:400;}
  .guide-step p{margin:0;font-size:calc(12.5px * var(--font-scale,1));color:var(--dim);line-height:1.65;}
  .guide-step .en-line{display:block;color:var(--faint);font-size:calc(11px * var(--font-scale,1));margin-top:2px;}
  .guide-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  footer{flex:none;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);}
  .helpers{display:flex;align-items:center;gap:14px;margin:0;}
  .helpers + .helpers{margin-top:8px;}
  .helpers h2{flex:none;white-space:nowrap;font-size:calc(10.5px * var(--font-scale,1));font-weight:400;color:var(--faint);margin:0;letter-spacing:.14em;font-family:var(--mono);text-transform:uppercase;}
  .chips{flex:1;min-width:0;display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;padding-bottom:4px;}
  .chip{flex:none;font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius);color:var(--dim);cursor:pointer;background:transparent;transition:color .12s,border-color .12s;}
  .chip:hover{color:var(--text);border-color:var(--border-strong);}
  .hint{color:var(--faint);font-size:calc(11.5px * var(--font-scale,1));margin-top:6px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  kbd{font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--dim);}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 14px;font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s;}
  .toast.show{opacity:1;}
  /* 可归约位置 / redex picker */
  .redex-list{flex:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .redex-list:empty{display:none;}
  .redex-btn{font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--dim);background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:2px 8px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .redex-btn:hover{color:var(--text);border-color:var(--border-strong);}
  .redex-btn b{font-weight:500;color:var(--faint);margin-right:4px;}
  .redex-hint{flex:none;width:100%;font-family:var(--mono);font-size:calc(10px * var(--font-scale,1));color:var(--faint);}
  .trace-note{margin:-4px 0 10px;font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));color:var(--warn);}
  /* 可折叠语法树 / collapsible AST */
  .ast-tree{font-family:var(--mono);font-size:calc(12.5px * var(--font-scale,1));line-height:1.8;}
  .ast-tree details{margin-left:14px;}
  .ast-tree summary{cursor:pointer;color:var(--text);list-style:none;}
  .ast-tree summary::-webkit-details-marker{display:none;}
  .ast-tree summary::before{content:"▸";display:inline-block;width:12px;color:var(--faint);}
  .ast-tree details[open] > summary::before{content:"▾";}
  .ast-tree .leaf{margin-left:14px;color:var(--dim);}
  .ast-tree .leaf .k{color:var(--faint);}
  .ast-view{display:flex;gap:6px;margin:0 0 10px;}
  .ast-svg{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);padding:4px;}
  .ast-svg svg{display:block;max-width:100%;height:auto;}
  .ast-svg .ast-edge{stroke:var(--border-strong);stroke-width:1;}
  .ast-svg .ast-node-rect{fill:var(--card);stroke:var(--border);}
  .ast-svg .ast-redex{fill:rgba(192,57,43,.12);stroke:var(--del);cursor:pointer;}
  .ast-svg .ast-redex:hover{fill:rgba(192,57,43,.24);}
  .ast-svg .ast-node-text{fill:var(--text);font-family:var(--mono);font-size:calc(11px * var(--font-scale,1));}
  .player .play{width:30px;}
  .tools{display:flex;flex-wrap:wrap;gap:7px;}
  .tools .mini{padding:4px 9px;}

  /* 跳到输入框 / skip link to the editor */
  .skip-link{position:absolute;left:-9999px;top:0;z-index:100;background:var(--bg);color:var(--text);
    border:1px solid var(--border-strong);border-radius:var(--radius);padding:8px 12px;
    font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));text-decoration:none;}
  .skip-link:focus{left:8px;top:8px;outline:1px solid var(--accent);outline-offset:2px;}

  /* 命令面板列表 / command palette list inside dialog() */
  .pal-list{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;}
  .pal-list[hidden]{display:none;}
  .pal-opt{padding:5px 10px;font-family:var(--mono);font-size:calc(12px * var(--font-scale,1));color:var(--dim);cursor:pointer;
    display:flex;justify-content:space-between;gap:12px;border-left:1px solid transparent;}
  .pal-opt .hint{color:var(--faint);font-size:calc(10.5px * var(--font-scale,1));white-space:nowrap;}
  .pal-opt.active,.pal-opt:hover{background:var(--hover);color:var(--text);border-left-color:var(--accent);}
  .pal-empty{padding:8px 10px;color:var(--faint);font-size:calc(11px * var(--font-scale,1));font-style:italic;}

  /* 分类示例与练习 / example categories and guided practice */
  .ex-block{flex-direction:column;align-items:stretch;gap:6px;}
  .ex-cats{display:flex;flex-wrap:wrap;gap:6px;}
  .ex-cat{font-size:calc(11px * var(--font-scale,1));padding:3px 9px;}
  .ex-cat[aria-pressed="true"]{color:var(--text);border-color:var(--accent);}
  .practice{margin:0 0 4px;padding-left:18px;list-style:decimal;}
  .practice-task{padding:6px 0;border-top:1px dashed var(--border);font-size:calc(12px * var(--font-scale,1));color:var(--dim);line-height:1.6;}
  .practice-task .mini{margin-left:6px;}
  .practice-result{display:block;color:var(--faint);font-size:calc(11px * var(--font-scale,1));}

  /* 播放器帧间隔 / player frame interval */
  .player .speed{display:inline-flex;align-items:center;gap:4px;font-size:calc(10px * var(--font-scale,1));color:var(--faint);white-space:nowrap;}
  .player .speed input{width:58px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);
    color:var(--dim);font-family:var(--mono);font-size:calc(10.5px * var(--font-scale,1));padding:1px 3px;}

  /* 尊重系统减少动效偏好 / honour the reduced-motion preference */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important;}
  }

  /* ------------------------------------------------ 平板 / 手机：单列、整页滚动
     Tablet / phone: one column, the page itself scrolls.
     放在所有组件规则之后，避免被同优先级的基础规则覆盖
     Kept last so component rules of equal specificity cannot override it. */
  @media (max-width:900px){
    html,body{height:auto;overflow:auto;-webkit-text-size-adjust:100%;}
    .app{height:auto;min-height:100vh;min-height:100dvh;max-width:none;overflow:visible;
         padding:14px 14px calc(16px + env(safe-area-inset-bottom));}
    header{gap:10px;padding-bottom:10px;margin-bottom:12px;}
    main{grid-template-columns:minmax(0,1fr);grid-auto-rows:auto;gap:12px;}
    .term,.side{height:auto;min-height:0;}
    .side{overflow:visible;}
    .term-body{padding:10px 12px 9px;}
    .term-out{min-height:220px;max-height:min(52vh,430px);padding-right:2px;}
    .panel{max-height:none;overflow:visible;padding:12px;}
    .tabs{position:sticky;top:0;background:var(--bg);z-index:20;}
    /* 触屏没有悬停，行内操作始终显示 / no hover on touch: keep inline actions visible */
    .line .act,.env-del{opacity:1;}
    footer{margin-top:14px;}
    .helpers{flex-direction:column;align-items:stretch;gap:6px;}
    .chips{width:100%;}
    .hint{white-space:normal;line-height:1.55;}
    .toast{bottom:calc(16px + env(safe-area-inset-bottom));}
    /* 16px 起可避免 iOS 聚焦时自动放大 / 16px stops iOS from zooming on focus */
    #cmd,.modal input{font-size:calc(16px * var(--font-scale,1));}
  }

  /* ------------------------------------------------------------ 手机 / Phone */
  @media (max-width:600px){
    .app{padding:12px 12px calc(14px + env(safe-area-inset-bottom));}
    header{flex-direction:column;align-items:stretch;}
    h1{font-size:calc(15px * var(--font-scale,1));line-height:1.45;letter-spacing:.02em;}
    .sub{font-size:calc(10.5px * var(--font-scale,1));line-height:1.5;}
    .controls{gap:6px;}
    button.ctl,.sel-btn{font-size:calc(11.5px * var(--font-scale,1));padding:7px 9px;min-height:32px;}
    .sel-btn{gap:7px;}
    .term-bar{padding:7px 12px;}
    .term-tools button{min-height:28px;padding:4px 10px;}
    .term-out{font-size:calc(13px * var(--font-scale,1));line-height:1.7;min-height:200px;max-height:min(48vh,380px);}
    .term-line{font-size:calc(15px * var(--font-scale,1));gap:7px;margin-top:8px;padding-top:9px;}
    #cmd{font-size:calc(16px * var(--font-scale,1));line-height:1.5;}
    .ac{min-width:0;width:100%;max-height:40vh;}
    .status{gap:10px;font-size:calc(11px * var(--font-scale,1));}
    .status input[type=number]{width:72px;font-size:calc(12px * var(--font-scale,1));padding:3px 5px;}
    .line-acts{gap:5px;}
    .line .act{padding:2px 8px;min-height:24px;}
    .manual-bar{font-size:calc(11px * var(--font-scale,1));gap:6px;}
    .mini{font-size:calc(11px * var(--font-scale,1));padding:5px 11px;min-height:30px;}
    .manual-bar .mterm{max-width:100%;}
    .redex-btn{font-size:calc(11px * var(--font-scale,1));padding:4px 9px;min-height:28px;}
    .tab{flex:1 1 0;min-width:0;min-height:36px;padding:9px 2px 8px;}
    .tab .en{font-size:calc(8.5px * var(--font-scale,1));}
    .player{gap:7px;}
    .player button{width:34px;height:34px;font-size:calc(13px * var(--font-scale,1));}
    .player .play{width:38px;}
    .steps-list .st{padding:6px 8px;font-size:calc(11.5px * var(--font-scale,1));}
    .env-del{min-height:26px;}
    .chip{min-height:30px;padding:5px 10px;}
    .modal{padding:14px;}
    .modal input{font-size:calc(16px * var(--font-scale,1));}
    .sel-opt{padding:8px 10px;font-size:calc(12.5px * var(--font-scale,1));}
    .sel-menu{max-height:50vh;}
  }

  /* 触屏没有悬停：行内操作与环境删除按钮常显 / touch has no hover, so keep them visible */
  @media (hover:none){
    .line .act{opacity:1;min-height:24px;padding:2px 8px;}
    .env-del{opacity:1;}
  }
</style>
</head>
<body>
<a class="skip-link" id="skip-link" href="#cmd">跳到输入框 / skip to input</a>
<div class="app">
  <header>
    <div>
      <h1><span class="lam">λ</span> 演算计算器 <span style="color:var(--faint)">/ Lambda Calculus</span></h1>
      <p class="sub" id="subline">Haskell 解释器 · 归约轨迹 · 语法树 · 类型推断</p>
    </div>
    <div class="controls">
      <div class="sel" id="sel-lang">
        <select id="lang" aria-label="language" tabindex="-1" aria-hidden="true">
          <option value="both">中 / EN</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="sel-label"></span><span class="chev">▾</span>
        </button>
        <div class="sel-menu" role="listbox"></div>
      </div>
      <div class="sel" id="sel-strategy">
        <select id="strategy" aria-label="strategy" tabindex="-1" aria-hidden="true">
          <option value="applicative">应用序 / applicative</option>
          <option value="normal">正规序 / normal</option>
          <option value="cbn">按名 / call-by-name</option>
          <option value="cbv">按值 / call-by-value</option>
           <option value="need">按需 / call-by-need</option>
        </select>
        <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="sel-label"></span><span class="chev">▾</span>
        </button>
        <div class="sel-menu" role="listbox"></div>
      </div>
      <div class="sel" id="sel-encoding">
        <select id="encoding" aria-label="numeral encoding" tabindex="-1" aria-hidden="true">
          <option value="church">邱奇 / Church</option>
          <option value="scott">Scott</option>
        </select>
        <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span class="sel-label"></span><span class="chev">▾</span>
        </button>
        <div class="sel-menu" role="listbox"></div>
      </div>
      <button class="ctl" id="fast-toggle" type="button" aria-pressed="false">快速 / Fast</button>
      <button class="ctl" id="share" type="button">分享 / Share</button>
      <button class="ctl" id="export" type="button">导出 / Export</button>
      <button class="ctl" id="static-page" type="button">静态页 / Static page</button>
      <button class="ctl" id="import" type="button">导入 / Import</button>
      <button class="ctl" id="theme-toggle" type="button">深色 / Dark</button>
      <input type="file" id="file" accept=".lam,.txt" hidden>
    </div>
  </header>

  <main>
    <section class="term" aria-label="REPL">
      <div class="term-bar">
        <span class="term-title">lambda-repl</span>
        <div class="term-tools">
          <button id="clear" type="button">清空 / clear</button>
        </div>
      </div>
      <div class="term-body">
        <div class="term-out" id="out" aria-live="polite" aria-relevant="additions"></div>
        <div class="term-line">
          <span class="prompt">λ&gt;</span>
          <div class="input-wrap">
            <div class="editor-row">
              <div class="gutter" id="gutter" aria-hidden="true"></div>
              <div class="ed-stack">
                <div class="hl" id="hl" aria-hidden="true"></div>
                <textarea id="cmd" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false"
                  placeholder="输入表达式，回车执行 / type an expression, Enter to run"></textarea>
              </div>
            </div>
            <div class="ac" id="ac" role="listbox"></div>
          </div>
          <button class="mini" id="cancel-eval" type="button" disabled>取消 / cancel</button>
        </div>
        <div class="status">
          <span><b id="st-strategy">applicative</b></span>
          <span class="lim"><span id="st-steps-label">步 / steps</span>
            <input id="st-limit" type="number" min="1" step="1000" value="10000" aria-label="reduction step limit"></span>
          <span><b id="st-type">—</b></span>
          <span id="st-conn">●</span>
        </div>
        <div class="manual-bar">
          <span id="m-label">手动 / Manual</span>
          <button class="mini" id="m-begin" type="button">开始 / begin</button>
          <button class="mini" id="m-back" type="button" disabled>上一步 / back</button>
          <button class="mini" id="m-forward" type="button" disabled>前进 / forward</button>
          <button class="mini" id="m-start" type="button" disabled>回到起点 / start</button>
          <button class="mini" id="m-step" type="button" disabled>单步 / step</button>
          <button class="mini" id="m-run" type="button" disabled>到底 / run</button>
          <button class="mini" id="m-end" type="button" disabled>结束 / end</button>
          <span class="mterm" id="m-term"></span>
        </div>
        <div class="redex-list" id="redex-list"></div>
      </div>
    </section>

    <aside class="side" aria-label="inspector">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-trace" data-tab="trace" aria-controls="panel" aria-selected="true" tabindex="0"><span class="zh">轨迹</span><span class="en">Trace</span></button>
        <button class="tab" role="tab" id="tab-race" data-tab="race" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">竞速</span><span class="en">Race</span></button>
        <button class="tab" role="tab" id="tab-ast" data-tab="ast" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">结构</span><span class="en">AST</span></button>
        <button class="tab" role="tab" id="tab-type" data-tab="type" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">类型</span><span class="en">Type</span></button>
        <button class="tab" role="tab" id="tab-env" data-tab="env" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">环境</span><span class="en">Env</span></button>
        <button class="tab" role="tab" id="tab-growth" data-tab="growth" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">曲线</span><span class="en">Growth</span></button>
        <button class="tab" role="tab" id="tab-notebook" data-tab="notebook" aria-controls="panel" aria-selected="false" tabindex="-1"><span class="zh">笔记</span><span class="en">Notebook</span></button>

    var b = $("cancel-eval");
    if (b) b.disabled = !on;
  }
  function trackRequest(c){
    if (c) inflight.push(c);
    activeController = c;
    // 回放历史时不点亮取消按钮，否则重建过程中再次取消会触发连环重建
    // Do not re-enable Cancel while replaying: a second cancel during rebuild
    // would cascade into more sessions.
    setCancelActive(!state.replaying && inflight.length > 0);
  }
  function untrackRequest(c){
    var i = inflight.indexOf(c);
    if (i >= 0) inflight.splice(i, 1);
    if (activeController === c){
      activeController = inflight.length ? inflight[inflight.length - 1] : null;
    }
    setCancelActive(!state.replaying && inflight.length > 0);
  }
  var dialogOpen = false;       // 是否有弹窗打开 / whether a dialog is open
  var edHist = [""], edHistIdx = 0;  // 编辑器输入撤销栈 / editor input undo history

  // 手机屏幕上的提示语要短一些，否则输入框里只剩半句
  // On a phone the longer hint gets clipped, so use a short one there.
  var phoneQuery = window.matchMedia ? window.matchMedia("(max-width:600px)") : null;
  function isPhone(){ return !!(phoneQuery && phoneQuery.matches); }
  function applyPlaceholder(){
    cmd.placeholder = t(isPhone() ? "placeholderShort" : "placeholder");
  }

  function t(key, extra){
    var e = I18N[key] || {zh:key, en:key};
    if (state.lang === "zh") return e.zh;
    if (state.lang === "en") return e.en;
    return e.zh + " / " + e.en;
  }

  function dual(zh, en){
    if (state.lang === "zh") return zh;
    if (state.lang === "en") return en;
    return zh + " / " + en;
  }

  // 选择服务端同时返回的中/英文本，无需重放命令
  // Pick the server-provided Chinese/English text without replaying commands.
  function pickPair(zh, en, fallback){
    if (state.lang === "zh") return zh || fallback || "";
    if (state.lang === "en") return en || fallback || "";
    if (zh && en && zh !== en) return zh + " / " + en;
    return zh || en || fallback || "";
  }

  function objText(obj){
    return pickPair(obj.textZh, obj.textEn, obj.text);

  function resultMeta(obj){
    var parts = [];
    if (obj.steps) parts.push(obj.steps + " " + t("steps"));
    var hint = pickPair(obj.hintZh, obj.hintEn, obj.hint || "");
    if (hint.trim()) parts.push(hint.trim());
    return parts.join(" · ");
  }

  /* -------------------------------------------- 命令清单 / command catalogue */
  // 签名只含标识与占位符，说明文案全部来自 I18N.cmdDesc
  // Signatures hold identifiers only; descriptions live in I18N.cmdDesc.
  var CMDS = [
    ":help [cmd]", ":time [n] <expr>", ":bench <n> <expr>", ":trace <expr>", ":ast <expr>",
    ":db <expr>", ":type <expr>", ":eq <a> , <b>", ":conv <a> , <b>", ":prove <a> , <b>", ":nf <expr>",
    ":whnf <expr>", ":int <expr>", ":church <n>", ":strategy <s>", ":steps <n>",
    ":eta on|off", ":fast on|off", ":encoding church|scott", ":machine <expr>",
    ":stats <expr>", ":par <expr>", ":shortest <a> , <b>", ":growth <expr>",
    ":ftype <term>",
    ":begin <expr>", ":step [n]", ":run", ":end",
    ":back", ":forward", ":goto <n>", ":def <name>", ":search <s>", ":reload", ":edit [f]",
    ":let name = expr", "rec name = expr", ":load <f>", ":save <f>", ":env",
    ":del <n>", ":reset", ":lang zh|en|both", ":clear", ":q"
  ];
  function baseOf(sig){ return String(sig).split(/\s/)[0]; }
  function CMD_NAMES(){
    var seen = {}, arr = [];
    CMDS.forEach(function(sig){
      var b = baseOf(sig);
      if (b.charAt(0) === ":" && !seen[b]){ seen[b] = 1; arr.push(b); }
    });
    return arr;
  }
  // 编辑距离与模糊纠错 / edit distance and fuzzy suggestions
  function levenshtein(a, b){
    a = String(a || ""); b = String(b || "");
    var prev = [], cur = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++){
      cur[0] = i;
      for (j = 1; j <= b.length; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
                          prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur; cur = [];
    }
    return prev[b.length];
  }
  function fuzzyCommands(name, limit){
    var base = baseOf(String(name || ""));
    return CMD_NAMES().map(function(c){ return {cmd: c, d: levenshtein(base, c)}; })
      .filter(function(x){ return x.d <= Math.max(2, Math.floor(base.length / 3)); })
      .sort(function(x, y){ return x.d - y.d; })
      .slice(0, limit || 3).map(function(x){ return x.cmd; });
  }
  var INTENTS = [
    {zh:"怎么求阶乘", en:"how to compute factorial", cmd:":let"},
    {zh:"查看归约轨迹", en:"show reduction trace", cmd:":trace"},
    {zh:"判断两个项是否等价", en:"check beta equivalence", cmd:":conv"},
    {zh:"把邱奇数转成整数", en:"decode a Church numeral", cmd:":int"},
    {zh:"切换成快速模式", en:"turn on fast mode", cmd:":fast"},
    {zh:"看看类型", en:"infer the type", cmd:":type"}
  ];
  function intentItems(){
    return INTENTS.map(function(x){
      return {value: x.cmd, label: dual(x.zh, x.en), hint: descOf(x.cmd)};
    });
  }

  function descOf(base){
    var d = I18N.cmdDesc && I18N.cmdDesc[base];
    if (!d) return "";
    if (state.lang === "en") return d.en;
    if (state.lang === "zh") return d.zh;
    return d.zh + " / " + d.en;
  }
  function cmdHint(name){
    return descOf(baseOf(name)) || t("nameHint");
  }
  function paletteItems(){
    return CMDS.map(function(sig){
      var b = baseOf(sig);
      return {value: b, label: sig, hint: descOf(b)};
    }).concat(intentItems());

  function refreshStType(){

    if (!el) return;

    el.textContent = o ? (pickPair(o.zh, o.en, o.text) || "—") : "—";

  function focusKeyOf(el){
    // 生成可重查的选择器，便于重绘后恢复焦点 / a re-queryable selector for focus restore
    if (!el || !el.getAttribute) return null;
    if (el.id) return "#" + el.id;
    var keys = ["data-play","data-nav","data-astview","data-tool","data-step","data-guide","data-practice"];
    for (var i = 0; i < keys.length; i++){
      var v = el.getAttribute(keys[i]);
      if (v != null) return "[" + keys[i] + "=\"" + v + "\"]";
    }
    return null;
  }

  /* -------------------------------------------------- custom select / 下拉 */
  function initSelect(wrapId){
    var wrap = $(wrapId);
    var sel = wrap.querySelector("select");
    var btn = wrap.querySelector(".sel-btn");
    var menu = wrap.querySelector(".sel-menu");
    var label = btn.querySelector(".sel-label");

    function optId(i){ return wrapId + "-opt-" + i; }
    function setActiveDesc(i){
      // 让读屏软件知道当前活动选项 / tell assistive tech which option is active
      if (menu.setAttribute) menu.setAttribute("aria-activedescendant", optId(i));
    }
    function sync(){
      var opt = sel.options[sel.selectedIndex];
      label.textContent = opt ? opt.textContent : "";
    }
    function paint(){
      menu.innerHTML = Array.prototype.map.call(sel.options, function(o, i){
        return '<div class="sel-opt" role="option" id="' + optId(i) + '" data-i="' + i +
               '" aria-selected="' + (o.selected ? "true" : "false") + '">' +
               esc(o.textContent) + '</div>';
      }).join("");
      setActiveDesc(sel.selectedIndex);
    }
    function open(){
      paint();
      wrap.classList.add("open");
      btn.setAttribute("aria-expanded", "true");
      setActiveDesc(sel.selectedIndex);
    }
    function close(){
      wrap.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
    function choose(i){
      if (i < 0 || i >= sel.options.length) return;
      sel.selectedIndex = i;
      setActiveDesc(i);
      sel.dispatchEvent(new Event("change", {bubbles: true}));
      sync();
      close();
      btn.focus();
    }
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      if (wrap.classList.contains("open")) close(); else open();
    });
    btn.addEventListener("keydown", function(e){
      if (e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        var n = sel.options.length;
        choose((sel.selectedIndex + (e.key === "ArrowDown" ? 1 : -1) + n) % n);
      } else if (e.key === "Escape"){
        close();
      }
    });
    menu.addEventListener("click", function(e){
      var opt = e.target.closest(".sel-opt");
      if (opt) choose(parseInt(opt.dataset.i, 10));
    });
    sel.addEventListener("change", sync);
    document.addEventListener("click", function(e){
      if (!wrap.contains(e.target)) close();
    });
    sync();
    return {sync: sync, close: close};
  }

  /* ------------------------------------------------ custom dialog / 对话框 */
  // 弹窗打开时把背景标记为 inert，关闭时还原 / mark the background inert, restore on close
  function setBackgroundInert(on){
    var sibs = (document.body && document.body.children) ? document.body.children : [];
    var modal = $("modal"), toast = $("toast");
    Array.prototype.forEach.call(sibs, function(n){
      if (!n || !n.setAttribute || n === modal || n === toast) return;
      if (on){ n.setAttribute("inert", ""); n.setAttribute("aria-hidden", "true"); }
      else { n.removeAttribute("inert"); n.removeAttribute("aria-hidden"); }
    });
  }

  function dialog(opts){
    return new Promise(function(resolve){
      var modal = $("modal"), input = $("modal-input"), listBox = $("modal-list");
      var trigger = (document.activeElement && document.activeElement.focus)
                    ? document.activeElement : null;
      var isList = !!(opts.list && opts.list.length);
      var listActive = 0;
      $("modal-title").textContent = opts.title || "";
      $("modal-text").textContent = opts.message || "";
      $("modal-text").hidden = !opts.message;
      input.hidden = !opts.input;
      input.value = opts.value || "";
      $("modal-ok").textContent = opts.ok || t("ok");
      $("modal-cancel").textContent = opts.cancel || t("cancel");
      if (listBox) listBox.hidden = !isList;

      function renderList(q){
        if (!isList || !listBox) return;
        var needle = String(q || "").toLowerCase();
        var items = opts.list.filter(function(it){
          return !needle || String(it.label).toLowerCase().indexOf(needle) !== -1 ||
                 String(it.hint || "").toLowerCase().indexOf(needle) !== -1;
        }).slice(0, 12);
        if (listActive >= items.length) listActive = items.length - 1;
        if (listActive < 0) listActive = 0;
        listBox.innerHTML = items.length ? items.map(function(it, i){
          return '<div class="pal-opt' + (i === listActive ? ' active' : '') +
                 '" role="option" id="pal-opt-' + i + '" data-v="' + esc(it.value) +
                 '" aria-selected="' + (i === listActive ? "true" : "false") + '">' +
                 '<span>' + esc(it.label) + '</span><span class="hint">' +
                 esc(it.hint || "") + '</span></div>';
        }).join("") : '<div class="pal-empty">' + esc(t("noMatch")) + '</div>';
        if (listBox.setAttribute) {
          listBox.setAttribute("aria-activedescendant", items.length ? "pal-opt-" + listActive : "");
        }
        listBox._items = items;
      }
      function moveList(delta){
        if (!isList || !listBox) return;
        var items = listBox._items || [];
        if (!items.length) return;
        listActive = (listActive + delta + items.length) % items.length;
        renderList(input.value);
      }
      function finish(value){
        modal.classList.remove("open");
        modal.setAttribute("aria-hidden", "true");
        document.removeEventListener("keydown", onKey, true);
        modal.removeEventListener("click", onBackdrop);
        if (input.removeEventListener) input.removeEventListener("input", onInput);
        if (listBox && listBox.removeEventListener) listBox.removeEventListener("click", onListClick);
        if (listBox) listBox.hidden = true;
        setBackgroundInert(false);
        dialogOpen = false;
        // 关闭后把焦点还给触发元素 / return focus to the element that opened the dialog
        if (trigger && trigger.focus) trigger.focus();
        resolve(value);
      }
      function accept(){
        if (isList && listBox){
          var it = listBox._items && listBox._items[listActive];
          finish(it ? it.value : null);
        } else {
          finish(opts.input ? input.value.trim() : true);
        }
      }
      function onKey(e){
        if (e.key === "Escape"){ e.preventDefault(); finish(null); }
        else if (e.key === "ArrowDown" && isList){ e.preventDefault(); moveList(1); }
        else if (e.key === "ArrowUp" && isList){ e.preventDefault(); moveList(-1); }
        else if (e.key === "Enter"){ e.preventDefault(); accept(); }
        else if (e.key === "Tab"){
          // 焦点陷阱：Tab 在弹窗内循环 / keep Tab focus inside the dialog
          var f = [];
          if (opts.input && !input.hidden) f.push(input);
          f.push($("modal-ok"), $("modal-cancel"));
          f = f.filter(function(n){ return n && n.focus; });
          if (!f.length) return;
          var first = f[0], last = f[f.length - 1];
          var ae = document.activeElement;
          if (e.shiftKey && (ae === first || !ae)){ e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && (ae === last || !ae)){ e.preventDefault(); first.focus(); }
        }
      }
      function onInput(){ if (isList) renderList(input.value); }
      function onBackdrop(e){ if (e.target === modal) finish(null); }
      function onListClick(e){
        var opt = (e.target && e.target.closest) ? e.target.closest(".pal-opt") : null;
        if (opt && opt.getAttribute) finish(opt.getAttribute("data-v"));
      }
      $("modal-ok").onclick = accept;
      $("modal-cancel").onclick = function(){ finish(null); };
      if (listBox && listBox.addEventListener) listBox.addEventListener("click", onListClick);
      modal.addEventListener("click", onBackdrop);
      if (input.addEventListener) input.addEventListener("input", onInput);
      document.addEventListener("keydown", onKey, true);
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      dialogOpen = true;
      setBackgroundInert(true);
      if (isList) renderList(opts.value || "");
      (opts.input ? input : $("modal-ok")).focus();
      if (opts.input && input.select) input.select();
    });
  }

  /* ------------------------------------------------------------- text utils / 文本工具 */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }
  function shorten(s, n){
    s = String(s == null ? "" : s);
    return s.length <= n ? s : s.slice(0, n - 1) + "…";
  }
  function elem(tag, cls, html){
    var d = document.createElement(tag);

    var el = $("toast");

  function addLine(kind, text, meta, source, zh, en){
    var d = elem("div", "line " + kind);
    var mark = "·";
    if (kind === "result") mark = "⇒";
    else if (kind === "define") mark = "⟶";
    else if (kind === "error" || kind === "fail") mark = "⚠";
    else if (kind === "warn") mark = "⚠";
    else if (kind === "step") mark = "→";
    var main = elem("div", "line-main");
    var body = elem("span", "body");
    body.textContent = text;
    main.appendChild(body);
    if (meta){
      var m = elem("span", "meta");
      m.textContent = meta;
      main.appendChild(m);
      d._metaEl = m;  // 直接持有节点，语言切换无需再查 DOM / keep a direct ref
    }
    d.innerHTML = '<span class="mark">' + mark + '</span>';
    d.appendChild(main);
    d._zh = (zh == null ? text : zh);
    d._en = (en == null ? text : en);
    out.appendChild(d);
    return d;
  }

  // 解析错误定位：显示出错的那一行，并在对应列下画脱字符
  // Parse errors: show the failing line and put the caret under the reported column.
  // 类型错误：在回显的命令里给失败子项加波浪线 / underline the failing subterm
  function markTypeFailure(failing){
    var rows = out.querySelectorAll(".line.echo");
    var row = rows[rows.length - 1];
    if (!row || !failing) return;
    // 回显行的命令正文在 .body 里，不是 .line-main；旧选择器永远匹配不到
    // Echo lines put the command text in .body, not .line-main; the old selector never matched.
    var main = row.querySelector(".body") || row.querySelector(".line-main");
    if (!main || main.dataset.typed === "1") return;
    var txt = main.textContent || "";
    var i = txt.indexOf(failing);
    if (i < 0) return;
    main.innerHTML = esc(txt.slice(0, i)) + '<span class="type-err">' +
      esc(failing) + '</span>' + esc(txt.slice(i + failing.length));
    main.dataset.typed = "1";
  }

  function addErrorSnippet(pos, source){
    var text = String(source || "");
    var at = Math.max(1, Number(pos) || 1);
    var lines = text.split("\n");
    var start = 0, row = 0;
    for (var i = 0; i < lines.length; i++){
      if (at <= start + lines[i].length || i === lines.length - 1){ row = i; break; }
      start += lines[i].length + 1;
    }
    var lineText = lines[row] || "";
    var col = Math.min(Math.max(1, at - start), lineText.length + 1);
    var before = lineText.slice(0, col - 1);
    var hitChar = lineText.charAt(col - 1);
    var after = lineText.slice(col);

    var d = elem("div", "line err-snip");
    d.innerHTML = '<span class="mark">↳</span>';
    var main = elem("div", "line-main");
    var src = elem("span", "body err-src");
    var pre = elem("span", "err-pre");
    pre.textContent = before;
    src.appendChild(pre);
    if (hitChar){
      var hit = elem("span", "err-ch");
      hit.textContent = hitChar;
      src.appendChild(hit);
    }
    if (after){
      var post = elem("span", "err-post");
      post.textContent = after;
      src.appendChild(post);
    }
    main.appendChild(src);

    var caret = elem("span", "err-caret");
    caret.textContent = "^";
    caret.title = t("gotoErr");
    caret.setAttribute("role", "button");
    caret.setAttribute("tabindex", "0");
    function pick(){
      cmd.value = text;
      if (cmd.setSelectionRange){
        var c = Math.min(Math.max(0, at - 1), cmd.value.length);
        cmd.setSelectionRange(c, c);
      }
      if (cmd.focus) cmd.focus();
      pushEditor(cmd.value);
      syncEditor();
    }
    caret.addEventListener("click", pick);
    caret.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); }
    });
    main.appendChild(caret);
    d.appendChild(main);
    out.appendChild(d);
    // 用实际宽度对齐：中英文与制表符的宽度不同，不能靠空格数猜
    // Align by measured width: CJK glyphs and tabs are not one column per character.
    (function align(){
      var w = pre.getBoundingClientRect ? pre.getBoundingClientRect().width : 0;
      var room = Number(out.clientWidth) || 0;
      var max = room > 0 ? room - 32 : w;
      caret.style.paddingLeft = Math.max(0, Math.min(w || 0, max)) + "px";
    })();
    return d;
  }

  function copyText(text){
    var ok = function(){ toast(t("copied")); };
    // 剪贴板 API 不可用时退回 execCommand，再失败就如实报错
    // Fall back to execCommand when the clipboard API is unavailable or rejects.
    var fallback = function(){
      try {
        var ta = document.createElement("textarea");
        ta.value = String(text);
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        if (ta.select) ta.select();
        var done = document.execCommand && document.execCommand("copy");
        document.body.removeChild(ta);
        toast(done ? t("copied") : t("copyFailed"));
      } catch(e){ toast(t("copyFailed")); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else {
      fallback();
    }
  }

  function traceMarkdown(obj){
    var lines = ["# λ reduction trace", "", "```text", obj.term || "", "```", ""];
    (obj.trace || []).forEach(function(s){
      lines.push("## " + s.n + ". " + (s.rule || "β"));
      if (s.note) lines.push(s.note);
      lines.push("", "before:", "```text", s.before, "```", "", "after:", "```text", s.after, "```", "");
    });
    return lines.join("\n");
  }

  function traceLatex(obj){
    function esc(s){
      return String(s || "").replace(/\\/g, "\\textbackslash{}")
        .replace(/([{}_$%&#^~])/g, "\\$1");
    }
    var out = ["\\documentclass{article}", "\\usepackage[T1]{fontenc}",
               "\\begin{document}", "\\section*{Reduction trace}",
               "\\noindent\\texttt{" + esc(obj.term) + "}", "\\begin{enumerate}"];
    (obj.trace || []).forEach(function(s){
      out.push("\\item[" + esc(s.n) + "] " + esc(s.rule || "beta"));
      if (s.note) out.push("\\\\ " + esc(s.note));
      out.push("\\begin{verbatim}", s.before || "", "\\end{verbatim}",
               "\\begin{verbatim}", s.after || "", "\\end{verbatim}");
    });
    out.push("\\end{enumerate}", "\\end{document}", "");
    return out.join("\n");
  }

  function proofMarkdown(obj){
    var lines = ["# beta-convertibility proof", "",
                 "- left: " + (obj.left || ""),
                 "- right: " + (obj.right || ""),
                 "- common normal form: " + (obj.normalForm || ""), ""];
    [["Left", obj.leftTrace], ["Right", obj.rightTrace]].forEach(function(pair){
      lines.push("## " + pair[0] + " reduction", "");
      (pair[1] || []).forEach(function(s){
        lines.push("### " + s.n + ". " + (s.rule || "beta"));
        if (s.note) lines.push(s.note);
        lines.push("before:", "```text", s.before, "```", "", "after:", "```text", s.after, "```", "");
      });
    });
    return lines.join("\n");
  }

  function proofLatex(obj){
    function esc(s){
      return String(s || "").replace(/\\/g, "\\textbackslash{}")
        .replace(/([{}_$%&#^~])/g, "\\$1");
    }
    var out = ["\\documentclass{article}", "\\usepackage[T1]{fontenc}",
               "\\begin{document}", "\\section*{beta-convertibility proof}",
               "Left: \\texttt{" + esc(obj.left) + "}",
               "Right: \\texttt{" + esc(obj.right) + "}",
               "Common normal form: \\texttt{" + esc(obj.normalForm) + "}", ""];
    [["Left", obj.leftTrace], ["Right", obj.rightTrace]].forEach(function(pair){
      out.push("\\subsection*{" + pair[0] + " reduction}", "\\begin{enumerate}");
      (pair[1] || []).forEach(function(s){
        out.push("\\item[" + esc(s.n) + "] " + esc(s.rule || "beta"));
        if (s.note) out.push("\\\\ " + esc(s.note));
        out.push("\\begin{verbatim}", s.before || "", "\\end{verbatim}",
                 "\\begin{verbatim}", s.after || "", "\\end{verbatim}");
      });
      out.push("\\end{enumerate}", "");
    });
    out.push("\\end{document}", "");
    return out.join("\n");
  }

  function traceAnimation(obj){
    function esc(s){ return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    var frames = (obj.trace || []).map(function(s, i){
      return '<section class="frame" data-i="' + i + '"><h2>' + esc(String(s.n || i + 1)) +
        ' · ' + esc(s.rule || "β") + '</h2><pre>' + esc(s.before) + '</pre><pre class="after">' +
        esc(s.after) + '</pre></section>';
    }).join("");
    if (!frames) frames = '<section class="frame"><pre>' + esc(obj.term) + '</pre></section>';
    return '<!doctype html><html lang="en"><head><meta charset="utf-8">' +
      '<title>lambda reduction animation</title><style>' +
      'body{margin:0;padding:24px;background:#fbfaf7;color:#1d1d1b;font-family:ui-monospace,monospace}' +
      '.frame{display:none;max-width:900px;margin:auto}.frame.on{display:block}' +
      'pre{white-space:pre-wrap;word-break:break-word;border:1px solid #ddd;padding:12px}' +
      '.after{border-color:#2f6f4f}button{font:inherit;padding:6px 12px;margin:0 4px}' +
      '</style></head><body><div id="v">' + frames + '</div>' +
      '<button id="pp">play / pause</button><button id="pr">prev</button><button id="nx">next</button>' +
      '<button id="rec">record WebM</button><span id="msg"></span><canvas id="cv" width="960" height="540" hidden></canvas>' +
      '<script>(function(){var f=[].slice.call(document.querySelectorAll(".frame")),i=0,t=null;' +
      'function show(){f.forEach(function(x,j){x.classList.toggle("on",j===i)});}show();' +
      'function tick(){i=(i+1)%f.length;show();}document.getElementById("pp").onclick=function(){' +
      'if(t){clearInterval(t);t=null}else{t=setInterval(tick,1200)}};' +
      'document.getElementById("nx").onclick=function(){i=(i+1)%f.length;show()};' +
      'document.getElementById("pr").onclick=function(){i=(i-1+f.length)%f.length;show()};' +
      'document.getElementById("rec").onclick=function(){' +
      'if(!window.MediaRecorder||!document.getElementById("cv").captureStream){' +
      'document.getElementById("msg").textContent="MediaRecorder unavailable";return}' +
      'var cv=document.getElementById("cv"),cx=cv.getContext("2d"),s=cv.captureStream(2);' +
      'var chunks=[],r=new MediaRecorder(s,{mimeType:"video/webm"});' +
      'r.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};' +
      'r.onstop=function(){var a=document.createElement("a"),b=new Blob(chunks,{type:"video/webm"});' +
      'a.href=URL.createObjectURL(b);a.download="lambda-trace.webm";a.click();' +
      'document.getElementById("msg").textContent="WebM saved"};' +
      'function draw(j){var x=f[j];cx.fillStyle="#fbfaf7";cx.fillRect(0,0,960,540);' +
      'cx.fillStyle="#1d1d1b";cx.font="22px monospace";cx.fillText("step "+(j+1),40,60);' +
      'cx.font="16px monospace";var ps=x.querySelectorAll("pre"),y=120;' +
      '[].forEach.call(ps,function(p){cx.fillText(p.textContent.slice(0,90),40,y);y+=90})};' +
      'r.start();var k=0;draw(0);var iv=setInterval(function(){k++;if(k>=f.length){clearInterval(iv);r.stop();return}' +
      'draw(k);show()},1200)};' +
      '})();<' + '/script></body></html>';
  }

  function proofDiamond(obj){
    function esc(s){ return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    var left = esc(obj.left || ""), right = esc(obj.right || "");
    var nf = esc(obj.normalForm || "");
    var ls = esc(String(obj.leftSteps || 0)), rs = esc(String(obj.rightSteps || 0));
    return '<svg class="diamond" viewBox="0 0 440 150" role="img" aria-label="confluence">' +
      '<path d="M100 30 L220 75 M340 30 L220 75" class="diamond-edge"/>' +
      '<circle cx="100" cy="30" r="5" class="diamond-node"/>' +
      '<circle cx="340" cy="30" r="5" class="diamond-node"/>' +
      '<circle cx="220" cy="75" r="6" class="diamond-node common"/>' +
      '<text x="100" y="15" text-anchor="middle" class="diamond-text">' + left + '</text>' +
      '<text x="340" y="15" text-anchor="middle" class="diamond-text">' + right + '</text>' +
      '<text x="220" y="105" text-anchor="middle" class="diamond-text">' + nf + '</text>' +
      '<text x="158" y="45" class="diamond-step">' + ls + '</text>' +
      '<text x="282" y="45" class="diamond-step">' + rs + '</text></svg>';
  }

  function saveBlob(name, text, type){
    var blob = new Blob([text], {type: type});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  function linkCodeHelp(lineEl, code){
    var m = lineEl && lineEl.querySelector ? lineEl.querySelector(".meta") : null;
    if (!m || !code) return;
    m.setAttribute("role", "button");
    m.setAttribute("tabindex", "0");
    m.style.cursor = "pointer";
    m.title = t("errCode") + ": " + code + " — " + dual("点击查看原因", "click for details");
    function show(){
      var h = ERR_HELP[code];
      var msg = h ? dual(h.zh, h.en)
                  : dual("暂无该错误码的详细说明。", "No detailed help is available for this code.");
      dialog({title: t("errCode") + ": " + code, message: msg});
    }
    m.addEventListener("click", show);
    m.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); show(); }
    });
  }

  // 导出文件名带时间戳，避免多次导出后无法区分
  // Timestamp exported files so repeated exports stay distinguishable.
  function fileStamp(){
    var d = new Date();
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return String(d.getFullYear()) + p(d.getMonth() + 1) + p(d.getDate()) + "-" +
           p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function addActions(lineEl, obj, source){
    // 手动单步的输出没有 trace，补一个单步对比 / synthesize a one-step trace
    if (!obj.trace && obj.before && obj.term){
      obj = Object.assign({}, obj, {
        trace: [{n: 1, rule: obj.rule || "β", note: obj.note || "",
                 before: obj.before, after: obj.term}],
        steps: 1
      });
    }
    var acts = elem("div", "line-acts");
    var main = lineEl.querySelector(".line-main");
    if (main) main.appendChild(acts);
    function add(labelFn, titleFn, fn){
      var b = elem("button", "act", "");
      b.type = "button";
      b._relabel = function(){ b.textContent = labelFn(); b.title = titleFn(); };
      b._relabel();
      b.addEventListener("click", function(ev){ ev.stopPropagation(); fn(); });
      acts.appendChild(b);
      return b;
    }
    if (obj.trace || obj.ast){
      add(function(){ return "⚙ " + t("trace"); }, function(){ return t("trace"); },
          function(){ selectResult(obj, lineEl, "trace"); });
    }
    if (obj.term){
      add(function(){ return "⧉ " + t("copy"); }, function(){ return t("copy"); },
          function(){ copyText(obj.term); });
      add(function(){ return "↳ " + t("insertB"); }, function(){ return t("insertB"); },
          function(){ insertText(obj.term); });
      add(function(){ return "⊕ " + t("defineB"); }, function(){ return t("defineB"); },
          async function(){
            var name = await dialog({title: t("defineB"), message: t("saveName"),
                                     input: true, ok: t("defineB")});
            if (!name) return;
            exec(":let " + name + " = " + obj.term);
          });
    }
    if (obj.trace && obj.trace.length){
      add(function(){ return "⤓ " + t("exportT"); }, function(){ return t("exportT"); },
          function(){
            saveBlob("lambda-trace-" + fileStamp() + ".md", traceMarkdown(obj), "text/markdown;charset=utf-8");
          });
      add(function(){ return "⤓ " + t("exportJson"); }, function(){ return t("exportJson"); },
          function(){
            saveBlob("lambda-trace-" + fileStamp() + ".json", JSON.stringify(obj, null, 2), "application/json;charset=utf-8");
          });
      add(function(){ return "⤓ " + t("exportTex"); }, function(){ return t("exportTex"); },
          function(){
            saveBlob("lambda-trace-" + fileStamp() + ".tex", traceLatex(obj), "application/x-tex;charset=utf-8");
          });
      add(function(){ return "⤓ " + t("animation"); }, function(){ return t("animation"); },
          function(){
            saveBlob("lambda-trace-" + fileStamp() + ".html", traceAnimation(obj), "text/html;charset=utf-8");
          });
    }
    lineEl.addEventListener("click", function(){
      if (obj.trace || obj.ast || obj.type) selectResult(obj, lineEl, state.tab === "trace" && !obj.trace ? "ast" : "trace");
    });
    lineEl._obj = obj;
    return obj;
  }

  function selectResult(obj, lineEl, tab){
    stopPlay();
    state.selected = obj;
    state.tracePos = (obj.trace && obj.trace.length) ? obj.trace.length - 1 : 0;
    Array.prototype.forEach.call(out.querySelectorAll(".line.sel"), function(n){ n.classList.remove("sel"); });
    if (lineEl && lineEl.classList) lineEl.classList.add("sel");
    switchTab(tab || "trace");
  }

  function renderOutput(obj, source, silent){
    if (obj.kind === "env"){
      state.envRows = obj.rows || [];
      if (state.tab === "env") renderPanel();
      return;
    }
    if (silent) return;

    if (obj.kind === "result" || obj.kind === "warn"){
      // 警告行必须保留“步数上限 / 发散”等原因，不能只显示未完成的项
      // A warning must keep its reason (limit/divergence), not just the partial term.
      var isWarn = obj.kind === "warn";
      var bodyText = isWarn ? objText(obj) : (obj.term || objText(obj));
      // 警告与失败都带机器可读的错误码，和 error 行一样显示出来
      // Warnings and failures carry a machine-readable code; show it like errors do.
      var warnCode = isWarn && obj.code ? String(obj.code) : null;
      var el = addLine(obj.kind, bodyText, isWarn ? warnCode : resultMeta(obj), source,
                       isWarn ? obj.textZh : (obj.term || obj.textZh),
                       isWarn ? obj.textEn : (obj.term || obj.textEn));
      if (warnCode){ el._errCode = warnCode; el.title = t("errCode") + ": " + warnCode; linkCodeHelp(el, warnCode); }
      el._metaObj = obj;
      addActions(el, obj, source);
      // 普通结果的 redex 不属于手动归约，不能覆盖手动归约的 redex 列表
      // A plain result's redexes are not the manual reduction's, so they must
      // not replace the buttons of the reduction in progress.
      if (!state.selected) selectResult(obj, el, (obj.trace && obj.trace.length) ? "trace" : "ast");
      if (state.tab !== "env" && el.classList.contains("sel")) renderPanel();
      return;
    }
    if (obj.kind === "eq" || obj.kind === "conv"){
      var ecol = obj.equal ? "var(--ok)" : (obj.limitHit ? "var(--warn)" : "var(--err)");
      var prefix = obj.equal ? "✓ " : "✗ ";
      var ed = addLine("info", prefix + objText(obj), null, source,
                       prefix + (obj.textZh || obj.text || ""),
                       prefix + (obj.textEn || obj.text || ""));
      ed.querySelector(".mark").style.color = ecol;
      return;
    }
    if (obj.kind === "int" || obj.kind === "church"){
      var id = addLine("result", obj.text || String(obj.value));
      var metaZh = obj.kind === "int" ? "邱奇数 → 整数" : "整数 → 邱奇数";
      var metaEn = obj.kind === "int" ? "Church → int" : "int → Church";
      var im = elem("span", "meta");
      im.textContent = pickPair(metaZh, metaEn, metaZh);
      id._metaPair = [metaZh, metaEn];  // 供语言切换重渲染 / for lang switch
      id._metaEl = im;
      id.querySelector(".line-main").appendChild(im);
      return;
    }
    if (obj.kind === "error"){
      // 错误码进入该行的 meta 与 title / surface the error code in meta and title
      var codeMeta = obj.code ? String(obj.code) : null;
      var d = addLine("error", objText(obj), codeMeta, source, obj.textZh, obj.textEn);
      if (obj.code){ d._errCode = String(obj.code); d.title = t("errCode") + ": " + String(obj.code); linkCodeHelp(d, String(obj.code)); }
      if (obj.pos != null && source) addErrorSnippet(obj.pos, source);
      return;
    }
    if (obj.kind === "fail" || obj.kind === "info" || obj.kind === "define" || obj.kind === "step" || obj.kind === "term"){
      var body = (obj.kind === "step" || obj.kind === "term")
        ? (obj.term || objText(obj)) : objText(obj);
      var failCode = (obj.kind === "fail" && obj.code) ? String(obj.code) : null;
      var line = addLine(obj.kind, body, failCode, source,
                         obj.textZh || body, obj.textEn || body);
      if (failCode){ line._errCode = failCode; line.title = t("errCode") + ": " + failCode; linkCodeHelp(line, failCode); }
      if (obj.failing) markTypeFailure(String(obj.failing));
      if (obj.kind === "term"){ setManual(true, obj.term); }
      if (obj.kind === "term" || obj.kind === "step"){
        if (obj.term) state.manualTerm = obj.term;
        // 每步都刷新手动归约条的当前项，不能只停留在 :begin 的起始项
        // Refresh the manual bar on every step, not just on :begin.
        var mt = $("m-term");
        if (mt){ mt.textContent = state.manualTerm || ""; mt.title = state.manualTerm || ""; }
        state.redexes = obj.redexes || [];
        if (obj.kind === "step"){
          // 后退到起点后禁用“上一步”，与后端 canStepBack 保持一致
          // Honour canStepBack so reaching step 0 disables Back.
          if ($("m-back")) $("m-back").disabled = obj.canStepBack === false;
          if ($("m-forward")){
            $("m-forward").disabled = obj.canStepForward !== true;
          }
        }
        renderRedexes();
        var enriched = addActions(line, obj, source);
        if (obj.kind === "step") selectResult(enriched, line, "trace");
      }
      return;
    }
    if (obj.kind === "trace"){
      var o = {term: obj.final, trace: obj.trace || [], steps: obj.steps || 0,
               type: "", traceTruncated: obj.traceTruncated};
      var el2 = addLine("result", o.term, (o.steps || 0) + " " + t("steps"));
      el2._metaObj = o;
      addActions(el2, o, source);
      selectResult(o, el2, "trace");
      return;
    }
    if (obj.kind === "proof"){
      // 证明对象复用跟踪面板展示两条归约序列，同时保留复制/导出等操作
      // Reuse the trace panel for both sequences while keeping copy/export actions.
      var pv = Object.assign({}, obj, {
        term: obj.normalForm || (obj.left + " , " + obj.right),
        trace: obj.leftTrace || []
      });
      var stepText = (obj.leftSteps || 0) + " + " + (obj.rightSteps || 0) + " ";
      var pmetaZh = obj.convertible ? stepText + I18N.proofSteps.zh
        : (obj.limitHit ? I18N.timeout.zh : "不可转换");
      var pmetaEn = obj.convertible ? stepText + I18N.proofSteps.en
        : (obj.limitHit ? I18N.timeout.en : "not convertible");
      var pe = addLine("result", objText(obj), pickPair(pmetaZh, pmetaEn), source,
                       obj.textZh, obj.textEn);
      // 结果行的摘要也要随语言切换刷新，否则终端与证明面板语言不一致
      // Keep the terminal meta in sync with the proof panel on language switch.
      pe._metaPair = [pmetaZh, pmetaEn];
      addActions(pe, pv, source);
      selectResult(pv, pe, "trace");
      return;
    }
    if (obj.kind === "ast"){
      state.selected = {ast: obj.tree, astTree: obj.astTree, term: "",
                        astOmitted: obj.astOmitted, astTreeOmitted: obj.astTreeOmitted};
      switchTab("ast");
      return;
    }
    if (obj.kind === "db"){
      addLine("info", "db: " + (obj.text || ""));
      state.selected = {term: obj.term || "", ast: obj.ast || [],
                        astTree: obj.astTree, db: obj.text || "",
                        astOmitted: obj.astOmitted, astTreeOmitted: obj.astTreeOmitted};
      switchTab("ast");
      return;
    }
    if (obj.kind === "shortest"){
      var sl = addLine(obj.found ? "result" : "warn", objText(obj),
                       null, source, obj.textZh, obj.textEn);
      if (obj.found && obj.trace && obj.trace.length) selectResult(obj, sl, "trace");
      return;
    }
    if (obj.kind === "growth"){
      state.growth = obj;
      addLine("info", objText(obj), null, source, obj.textZh, obj.textEn);
      switchTab("growth");
      return;
    }
    if (obj.kind === "ftype"){
      addLine("info", "∀ " + (obj.type || ""), null, source,
              "System F 类型：" + (obj.type || ""), "System F type: " + (obj.type || ""));
      state.selected = {type: obj.type, typeZh: obj.type, typeEn: obj.type,
                        proposition: obj.proposition, propositionZh: obj.proposition,
                        propositionEn: obj.proposition, erased: obj.erased,
                        fTerm: obj.fTerm};
      switchTab("type");
      return;
    }
    if (obj.kind === "type"){
      addLine("info", "⊢ " + pickPair(obj.typeZh, obj.typeEn, obj.type || obj.text), null, source,

  function stopPlay(){
