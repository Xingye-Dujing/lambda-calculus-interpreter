name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: build.bat
        shell: cmd

      - name: Cabal build
        run: cabal build all

      - name: Check core sync (main.hs / extension.hs)
        run: python tools/check_core_sync.py

      - name: Byte-compile Python sources
        run: python -m compileall -q web tests tools

      - name: Install web dependencies
        run: python -m pip install -r web/requirements.txt

      - name: End-to-end tests
        run: python tests/run_tests.py
